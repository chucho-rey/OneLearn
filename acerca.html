   {

    "content": [
     {

      "text": "Escribir un editor de texto desde cero es de lo más difícil que hay en la web: selección, deshacer, pegar desde Word, teclados de celular, acentos… Por eso OneBook usa "

   {
    "type": "paragraph",
    "content": [
     {

     {
      "type": "text",

      "text": "import",
      "marks": [

        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": ". Para usarlo desde scripts clásicos, una herramienta llamada "

       {
        "type": "bold"

        "type": "code"

    }

   {
    "type": "codeBlock",
    "attrs": {

    },
    "content": [
     {
      "type": "text",
      "text": "esbuild.build({\n  entryPoints:['entrada.js'],\n  bundle:true,        // seguir los import y juntarlo todo\n  minify:true,        // quitar espacios y acortar nombres\n  format:'iife',      // un script clásico, no un módulo\n  target:['es2020','safari15'],\n  outfile:'../../assets/vendor/tiptap.min.js'\n});"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "El resultado pesa unos 456 KB (unos 150 KB comprimido) y se guarda en el repositorio. Esto se hace solo al actualizar Tiptap; por eso el sitio sigue sin necesitar compilación para publicarse. Las versiones están "

        "type": "code"

   {
    "type": "heading",
    "attrs": {
     "id": "s-terminal",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "La terminal simulada"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Las lecciones de Linux, redes y servidores traen una terminal de Ubuntu que corre completa en el navegador ("
     },
     {
      "type": "text",
      "text": "assets/js/terminal.js",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": "). No hay una computadora real detrás: es un pequeño intérprete escrito en JavaScript, y por dentro funciona como un shell de verdad, en tres pasos:"
     }
    ],
    "attrs": {
     "id": "b-act001"
    }
   },
   {
    "type": "orderedList",
    "attrs": {
     "id": "b-act002"
    },
    "content": [
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Leer la línea",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " ("
         },
         {
          "type": "text",
          "text": "lexer",
          "marks": [
           {
            "type": "italic"
           }
          ]
         },
         {
          "type": "text",
          "text": "): separa la línea en palabras y operadores, respetando las comillas y el "

         {
          "type": "text",
          "text": "\\",
          "marks": [
           {
            "type": "code"

         },
         {
          "type": "text",
          "text": "|",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": ")."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Entenderla",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " ("
         },
         {
          "type": "text",
          "text": "parser",
          "marks": [
           {
            "type": "italic"
           }
          ]
         },
         {
          "type": "text",
          "text": "): arma una lista de tuberías, cada una con sus comandos y sus redirecciones ("
         },
         {
          "type": "text",
          "text": ">",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": ", "
         },
         {
          "type": "text",
          "text": ">>",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": ", "
         },
         {
          "type": "text",
          "text": "\u003c",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": ", "
         },
         {
          "type": "text",
          "text": "2>",
          "marks": [

            "type": "code"

          "type": "text",
          "text": ")."

      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Ejecutarla",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": ": expande variables ("

         {

         {
          "type": "text",

          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": ") y "

          "type": "text",
          "text": "$(...)",
          "marks": [
           {
            "type": "code"
           }

         {
          "type": "text",
          "text": ", y corre cada comando pasándole la salida del anterior como entrada."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "El sistema de archivos es un árbol de objetos. Cada carpeta guarda a sus hijos y cada nodo tiene dueño, grupo y permisos como un número, igual que Linux. Revisar un permiso es una operación de bits:"
     }
    ],
    "attrs": {
     "id": "b-act003"
    }
   },
   {
    "type": "codeBlock",
    "attrs": {
     "id": "b-act004",
     "language": "js"
    },
    "content": [
     {
      "type": "text",
      "text": "/* ¿El usuario u puede leer (r), escribir (w) o ejecutar (x) el nodo n? */\nfunction puede(n,u,q){\n  var bit=q==='r'?4:q==='w'?2:1;          // r=4, w=2, x=1\n  if(u==='root')return true;              // root puede todo (simplificado)\n  if(n.u===u)return !!((n.modo>>6)&bit);  // dueño: los 3 bits de la izquierda\n  if(enGrupo(u,n.g))return !!((n.modo>>3)&bit);  // grupo: los de en medio\n  return !!(n.modo&bit);                  // los demás: los de la derecha\n}"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Los comandos que esperan algo (la contraseña de sudo, el «¿Desea continuar?» de apt, "
     },
     {
      "type": "text",
      "text": "sleep",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": ") devuelven "
     },
     {
      "type": "text",
      "text": "promesas",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ", así la terminal puede esperar tu respuesta sin congelar la página, y Ctrl+C simplemente rechaza la promesa pendiente. Cada ejercicio es una función que revisa el estado del sistema después de cada comando: «¿existe la carpeta?», «¿el servicio quedó encendido?»."
     }
    ],
    "attrs": {
     "id": "b-act005"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "También simula la red. Cada computadora conoce su IP, su puerta de enlace y sus rutas, y "
     },
     {
      "type": "text",
      "text": "ping",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": ", "
     },
     {
      "type": "text",
      "text": "traceroute",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": ", "
     },
     {
      "type": "text",
      "text": "dig",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": ", "
     },
     {
      "type": "text",
      "text": "curl",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": " y "
     },
     {
      "type": "text",
      "text": "ssh",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": " recorren ese mapa: un internet de ejemplo con su DNS y otros equipos de la red local, cada uno con sus servicios, su firewall ("
     },
     {
      "type": "text",
      "text": "ufw",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": ") y su nginx. Así una lección puede romper la red a propósito (apagar la tarjeta, borrar la ruta por defecto, detener el DNS) y pedirte que la arregles con las mismas herramientas que en un servidor real."
     }
    ],
    "attrs": {
     "id": "b-act006"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Las lecciones de subredes, enrutamiento y VPN usan además "
     },
     {
      "type": "text",
      "text": "assets/js/red.js",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": ". Ahí una dirección IPv4 es un número de 32 bits, y una subred, un bloque de números: saber si una IP está en una red es dividir y comparar. También dibuja redes en SVG y calcula el camino de un paquete: en cada salto, el router busca en su tabla la ruta más específica, con rutas escritas a mano o calculadas como OSPF, con una búsqueda en anchura del camino más corto."
     }
    ],
    "attrs": {
     "id": "b-act007"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-datos",
     "level": 2
    },

         {
          "type": "text",
          "text": " y después en IndexedDB. Si cierras la pestaña a la mitad, la siguiente visita termina de guardarla. Las bases de datos reales usan la misma idea ("

           }

         },

          "text": " "
         },
         {

      "content": [
       {

          "text": "Respaldo en JSON:",

   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Una tesis guarda en el mismo documento sus fuentes y su "

     {
      "type": "text",
      "text": ": cada sesión con su hora, cuántos caracteres se teclearon, se borraron y se pegaron, y de dónde venía lo pegado; nunca las teclas. La constancia de autoría trae la "

     },
     {
      "type": "text",
      "text": ": si cambia una sola letra, la huella es otra. Si la tesis tiene figuras, la huella cubre también sus imágenes, que se comprimen antes de guardarse: se dibujan en un "

      "content": [
       {
        "type": "text",
        "text": "Como no hay servidor, tus datos no salen de tu dispositivo. La desventaja es que si borras los datos del navegador, se pierden. Por eso conviene descargar un respaldo de vez en cuando."

        "content": [

          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " es un script que se pone entre la página y la red. Puede responder a cada petición con una copia guardada."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "La estrategia de OneBook se llama "
     },
     {
      "type": "text",
      "text": "«red primero»",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ": siempre intenta descargar la versión publicada y, si no hay red o tarda más de 4 segundos, usa la copia guardada:"
     }
    ],
    "attrs": {
     "id": "b-ac054"
    }
   },
   {
    "type": "codeBlock",
    "attrs": {
     "id": "b-ac055",
     "language": "js"
    },
    "content": [
     {
      "type": "text",
      "text": "self.addEventListener('fetch',function(e){\n  e.respondWith(\n    fetch(e.request)\n      .then(function(res){            // hay red: guarda una copia\n        cache.put(e.request,res.clone());\n        return res;\n      })\n      .catch(function(){              // sin red: usa la copia\n        return caches.match(e.request);\n      })\n  );\n});"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "El service worker tiene la lista de todos los archivos del sitio y un número de versión. Cuando se publica algo nuevo, se sube la versión y la app muestra el aviso «Hay una versión nueva»."
     }
    ],
    "attrs": {
     "id": "b-ac056"

    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Un sitio para estudiar tiene que poder usarlo cualquiera: con teclado, con lector de pantalla, con letra grande o con dislexia. Lo que hace OneBook:"

        "type": "paragraph",

          "text": " las pestañas, la barra de herramientas del editor y la búsqueda siguen los patrones de la guía "

       {
        "type": "paragraph",

          "text": " al abrir una ventana, el foco entra en ella; al cerrarla, vuelve al botón que la abrió. En el celular, el resto de la página queda "

         },

            "type": "code"

           {
            "type": "bold"
           }

         {

          "text": "Atajos de teclado",

   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Cada vez que algo cambia, un programa abre OneBook en un navegador real y lo revisa todo. Usa "

      "type": "text",

       {
        "type": "bold"
       }

     {

      "marks": [
       {
        "type": "italic"
       }
      ]

     {
      "type": "text",
      "text": "): hace clic, escribe, cambia el tamaño de la pantalla y lee lo que se ve."

    }

   {

     "language": "js"
    },
    "content": [
     {
      "type": "text",
      "text": "prueba('Marcadores',async function({browser,base,r}){\n  const p=await pagina(browser,{ancho:1280});\n  await p.goto(base+'lecciones/ram.html');\n  await p.keyboard.press('m');                 // guardar la sección actual\n  const n=await p.locator('#marcLista li').count();\n  r.igual(n,1,'la tecla M guarda un marcador');\n});"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Hay 27 archivos de pruebas con más de 3,200 comprobaciones. Además de las funciones, revisan en cada página, en varios anchos de pantalla, temas y tamaños de letra:"
     }
    ],
    "attrs": {
     "id": "b-ac061"
    }
   },
   {
    "type": "bulletList",
    "attrs": {

        "type": "paragraph",
        "content": [

          "text": "que nada se salga de la pantalla hacia los lados,"

      "type": "listItem",
      "content": [
       {
        "type": "paragraph",

      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "y que "

          "type": "text",
          "text": "cada texto visible",
          "marks": [
           {
            "type": "bold"

         },
         {
          "type": "text",
          "text": " cumpla el contraste mínimo, calculado píxel por píxel con la fórmula de WCAG."

       }
      ]
     }
