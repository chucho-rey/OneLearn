<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="cap-ohm">
<p class="hint">Mueve el voltaje y elige la resistencia. La barra muestra cuánta corriente pasa.</p>
<div class="ctl" style="margin-top:0">
  <span class="lbl">Voltaje</span>
  <input class="slider" type="range" id="ohV" min="1" max="24" step="0.5" value="5" aria-label="Voltaje">
  <b class="mono" id="ohVv"></b>
</div>
<div class="ctl">
  <span class="lbl">Resistencia</span>
  <div class="seg" id="ohR" role="group" aria-label="Resistencia">
    <button type="button" data-v="47" aria-pressed="false">47 Ω</button>
    <button type="button" data-v="220" aria-pressed="false">220 Ω</button>
    <button type="button" data-v="1000" aria-pressed="true">1 kΩ</button>
    <button type="button" data-v="10000" aria-pressed="false">10 kΩ</button>
  </div>
</div>
<div class="kpis">
  <div class="kpi"><span>Corriente (I = V ÷ R)</span><b id="ohI"></b><div class="bar"><i id="ohBar"></i></div></div>
  <div class="kpi"><span>Potencia en la resistencia (P = V × I)</span><b id="ohP"></b></div>
</div>
<div class="status" id="ohStat" data-k="" aria-live="polite"><span class="dot"></span><span id="ohMsg"></span></div>
</template>
<template data-lab="cap-serie">
<p class="hint">Elige dos resistencias y cómo se conectan. La pila es de 9 V.</p>
<div class="ctl" style="margin-top:0">
  <span class="lbl">R1</span>
  <div class="seg" id="srA" role="group" aria-label="Resistencia R1">
    <button type="button" data-v="100" aria-pressed="true">100 Ω</button>
    <button type="button" data-v="220" aria-pressed="false">220 Ω</button>
    <button type="button" data-v="1000" aria-pressed="false">1 kΩ</button>
  </div>
  <span class="lbl">R2</span>
  <div class="seg" id="srB" role="group" aria-label="Resistencia R2">
    <button type="button" data-v="100" aria-pressed="true">100 Ω</button>
    <button type="button" data-v="220" aria-pressed="false">220 Ω</button>
    <button type="button" data-v="1000" aria-pressed="false">1 kΩ</button>
  </div>
</div>
<div class="ctl">
  <div class="seg" id="srModo" role="group" aria-label="Conexión">
    <button type="button" data-v="s" aria-pressed="true">En serie</button>
    <button type="button" data-v="p" aria-pressed="false">En paralelo</button>
  </div>
</div>
<svg class="sr-svg" id="srSvg" viewBox="0 0 320 132" role="img" aria-label="Diagrama del circuito"></svg>
<div class="kpis">
  <div class="kpi"><span>Resistencia total</span><b id="srT"></b></div>
  <div class="kpi"><span>Corriente que sale de la pila</span><b id="srI"></b></div>
</div>
<p class="msg" id="srMsg" aria-live="polite"></p>
</template>
<template data-lab="cap-rc">
<p class="hint">El capacitor se carga a 5 V a través de una resistencia. Elige los valores y pulsa «Cargar» o «Descargar».</p>
<div class="ctl" style="margin-top:0">
  <span class="lbl">R</span>
  <div class="seg" id="rcR" role="group" aria-label="Resistencia">
    <button type="button" data-v="1000" aria-pressed="false">1 kΩ</button>
    <button type="button" data-v="10000" aria-pressed="true">10 kΩ</button>
    <button type="button" data-v="100000" aria-pressed="false">100 kΩ</button>
  </div>
  <span class="lbl">C</span>
  <div class="seg" id="rcC" role="group" aria-label="Capacitancia">
    <button type="button" data-v="0.00001" aria-pressed="false">10 µF</button>
    <button type="button" data-v="0.0001" aria-pressed="true">100 µF</button>
    <button type="button" data-v="0.001" aria-pressed="false">1,000 µF</button>
  </div>
</div>
<svg class="rc-svg" id="rcSvg" viewBox="0 0 320 170" role="img" aria-label="Voltaje del capacitor a lo largo del tiempo"></svg>
<div class="kpis">
  <div class="kpi"><span>Constante de tiempo τ = R × C</span><b id="rcTau"></b></div>
  <div class="kpi"><span>Casi lleno (5τ)</span><b id="rcCinco"></b></div>
  <div class="kpi"><span>Voltaje ahora</span><b id="rcV"></b><div class="bar"><i id="rcBar"></i></div></div>
</div>
<div class="ctl">
  <button class="btn pri" type="button" id="rcCargar">Cargar</button>
  <button class="btn" type="button" id="rcDescargar">Descargar</button>
</div>
<p class="msg" id="rcMsg" aria-live="polite"></p>
</template>
