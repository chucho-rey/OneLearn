<template data-lab="ci-xor">
<p class="hint">Cada letra se guarda como 8 bits. Elige una letra y una clave de 8 bits: el cifrado es letra XOR clave, y el descifrado, cifrado XOR clave.</p>

  </div>
</div>

<p class="msg" id="xoMsg" aria-live="polite"></p>
</template>

        "type": "paragraph",

          "type": "text",
          "text": "No se conoce ninguna forma práctica de romper AES bien usado. Los ataques reales van contra lo que lo rodea: contraseñas débiles, claves mal guardadas, programas con errores o personas engañadas."

        "type": "paragraph",

          "type": "text",
          "text": "Una computadora cuántica grande podría romper RSA y las curvas elípticas (con el algoritmo de Shor); a AES le afectaría mucho menos. Por eso ya existen algoritmos "

          "marks": [
           {
            "type": "bold"

      ]
     }
    ]

      "type": "desplegableTitulo",

       {
        "type": "text",
        "text": "Si cifro mi celular y olvido la contraseña, ¿se puede recuperar?"

      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Normalmente no: esa es justo la idea. Por eso los sistemas te ofrecen una clave de recuperación; guárdala en un lugar seguro."
         }
        ]
       }
      ]
     }

          ]
