     {
      "type": "text",
      "text": "HTTPS",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " es HTTP dentro de un túnel cifrado con "

     {
      "type": "text",
      "text": "TLS",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ". Antes de mandar la primera petición, el navegador y el servidor acuerdan claves, y el servidor muestra un "
     },
     {
      "type": "text",
      "text": "certificado",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " firmado por una autoridad en la que tu sistema confía: así sabes que hablas con el sitio real y no con un impostor. Usa el puerto 443."
     }
    ],
    "attrs": {
     "id": "b-ht015"
    }

    "attrs": {

      "type": "columna",

        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Quien espía en la red ve"

        ]
       },
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "La IP del servidor, el nombre del sitio (va sin cifrar al inicio de la conexión) y cuántos datos van y vienen."
         }
        ]
       }
      ]
     },
     {
      "type": "columna",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "No puede ver"

        ]
       },
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "La ruta, los encabezados (incluidas cookies y contraseñas), ni el contenido. Tampoco puede cambiarlos sin que se note."
         }
        ]
       }
      ]
     }
    ]

        "text": " manda muchas peticiones a la vez por una sola conexión y comprime los encabezados. "

   {

    "attrs": {
     "id": "b-ht020"

    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Qué diferencia hay entre 401 y 403?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "401",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " significa «no sé quién eres»: falta el token o la contraseña, o no es válido. "
         },
         {
          "type": "text",
          "text": "403",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " significa «sé quién eres, pero no tienes permiso para esto». Con un 401 sirve iniciar sesión; con un 403, no."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-ht021"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Una API es lo mismo que un sitio web?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Usan el mismo protocolo. La diferencia es para quién responden: el sitio web devuelve HTML para que lo dibuje el navegador; la API devuelve datos para que los use un programa."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-ht022"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Por qué http:// me manda a https://?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Casi todos los sitios responden a "
         },
         {
          "type": "text",
          "text": "http://",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " con un "
         },
         {
          "type": "text",
          "text": "301",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " hacia "
         },
         {
          "type": "text",
          "text": "https://",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": ". Además, muchos mandan el encabezado "
         },
         {
          "type": "text",
          "text": "Strict-Transport-Security",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " para que el navegador use HTTPS directo las siguientes veces."
         }
        ]
       }
      ]
     }
    ]

       "o": [

       ],
       "a": 1,
       "e": "GET solo lee. POST crea y DELETE borra."

      {

       "o": [

       "a": 1,
       "e": "404 Not Found: no hay nada en esa ruta. Es un error del cliente (4xx)."
      },
      {
       "q": "Mandas una petición sin token a una ruta protegida. ¿Qué código esperas?",
       "o": [
        "401",

       "a": 0,
       "e": "401: el servidor no sabe quién eres. 403 sería si ya te identificaste y no tienes permiso."

       "q": "¿Qué encabezado indica qué sitio quieres en un servidor con muchos dominios?",
       "o": [

       ],
       "a": 1,
       "e": "Host. Gracias a él, un servidor puede atender muchos sitios en la misma IP."
      },
      {
       "q": "Con HTTPS, ¿qué puede ver alguien que espía tu Wi-Fi?",
       "o": [

        "El nombre del sitio y la cantidad de datos, pero no el contenido"

        "type": "listItem",

         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "HTTP es una conversación de petición y respuesta: método, ruta, encabezados y cuerpo."
           }
          ]
         }
        ]

       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Métodos: GET lee, POST crea, PUT y PATCH cambian, DELETE borra."

        "type": "listItem",
        "content": [
         {
          "type": "paragraph",

        "content": [

          "content": [

            "text": "Una API devuelve datos (JSON) para programas; HTTPS cifra todo con TLS."
