        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Conviene, porque en el trabajo se dice todo el tiempo «falla de capa 1» (cable) o «switch de capa 3» (switch que también enruta). Pero lo importante es entender la idea: cada capa resuelve un problema y le agrega su encabezado."
         }

        "type": "text",
        "text": "¿En qué capa va TLS, el cifrado de HTTPS?"

      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Es un caso discutido: cifra (una tarea de la capa 6) y mantiene una sesión (capa 5), pero corre como parte de la aplicación. En el modelo TCP/IP simplemente es parte de la capa de aplicación."
         }

          "type": "text",
          "text": "MTU",
          "marks": [

            "type": "bold"

          "type": "text",
          "text": ". Si un paquete es más grande, hay que partirlo. Por eso un archivo grande viaja en miles de paquetes."
