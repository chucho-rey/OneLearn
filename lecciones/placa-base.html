<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="placa-pcie">
<p class="hint">Elige la generación de PCIe y cuántos carriles usa la conexión. Las cifras son por dirección (de ida o de vuelta).</p>
<div class="ctl" style="margin-top:0">
  <span class="lbl">Generación</span>
  <div class="seg" id="pcGen" role="group" aria-label="Generación de PCIe">
    <button type="button" data-v="3" aria-pressed="false">3.0</button>
    <button type="button" data-v="4" aria-pressed="true">4.0</button>
    <button type="button" data-v="5" aria-pressed="false">5.0</button>
  </div>
</div>
<div class="ctl">
  <span class="lbl">Carriles</span>
  <div class="seg" id="pcLan" role="group" aria-label="Carriles">
    <button type="button" data-v="1" aria-pressed="false">×1</button>
    <button type="button" data-v="4" aria-pressed="true">×4</button>
    <button type="button" data-v="8" aria-pressed="false">×8</button>
    <button type="button" data-v="16" aria-pressed="false">×16</button>
  </div>
</div>
<div class="barras" id="pcBar"></div>
<p class="msg" id="pcMsg" aria-live="polite"></p>
</template>
<template data-lab="placa-compat">
<p class="hint">Elige un procesador, una placa base y la RAM. Los modelos son reales; revisa qué reglas se cumplen.</p>
<p class="lbl pc-t">Procesador</p>
<div class="chips" id="cmCpu" role="group" aria-label="Procesador">
  <button class="chip" type="button" data-v="0" aria-pressed="true">Intel Core i5-14600K</button>
  <button class="chip" type="button" data-v="1" aria-pressed="false">Intel Core Ultra 5 245K</button>
  <button class="chip" type="button" data-v="2" aria-pressed="false">AMD Ryzen 5 9600X</button>
  <button class="chip" type="button" data-v="3" aria-pressed="false">AMD Ryzen 5 5600</button>
</div>
<p class="lbl pc-t">Placa base</p>
<div class="chips" id="cmPlaca" role="group" aria-label="Placa base">
  <button class="chip" type="button" data-v="0" aria-pressed="false">Chipset Z790 · DDR5</button>
  <button class="chip" type="button" data-v="1" aria-pressed="false">Chipset Z890 · DDR5</button>
  <button class="chip" type="button" data-v="2" aria-pressed="true">Chipset B650 · DDR5</button>
  <button class="chip" type="button" data-v="3" aria-pressed="false">Chipset B550 · DDR4</button>
</div>
<p class="lbl pc-t">RAM</p>
<div class="seg" id="cmRam" role="group" aria-label="RAM">
  <button type="button" data-v="4" aria-pressed="false">DDR4</button>
  <button type="button" data-v="5" aria-pressed="true">DDR5</button>
</div>
<ul class="cm" id="cmRes"></ul>
<div class="status" id="cmStat" data-k="" aria-live="polite"><span class="dot"></span><span id="cmMsg"></span></div>
</template>
<template data-lab="placa-arranque">
<p class="hint">Avanza por lo que pasa entre que presionas el botón y aparece el sistema operativo. Activa la falla para ver qué hace la placa cuando algo está mal.</p>
<label class="chk"><input type="checkbox" id="arFalla"> Simular que la RAM está mal puesta</label>
<ol class="ar" id="arPasos"></ol>
<div class="status" id="arStat" data-k="" aria-live="polite"><span class="dot"></span><span id="arMsg"></span></div>
<div class="ctl">
  <button class="btn pri" type="button" id="arSig">Siguiente paso</button>
  <button class="btn" type="button" id="arReset">Reiniciar</button>
</div>
</template>

       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Computadoras de escritorio normales; la más común"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Micro-ATX"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "24.4 × 24.4 cm"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "2 o 4"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "1 o 2"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Equipos más baratos o gabinetes medianos"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Mini-ITX"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "17 × 17 cm"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "2"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "1"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Computadoras pequeñas; menos expansión"
           }
          ]
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "En laptops, consolas y celulares no hay un formato estándar: la placa se diseña a la medida de cada modelo, y muchas piezas (como la RAM) van soldadas."
     }
    ],
    "attrs": {
     "id": "b-pb013"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-compat",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Compatibilidad: que todo encaje"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Al armar una computadora, la placa base es la pieza que tiene que llevarse bien con todas las demás. Hay tres reglas que no fallan:"
     }
    ],
    "attrs": {
     "id": "b-pb014"
    }
   },
   {
    "type": "orderedList",
    "attrs": {
     "id": "b-pb015"
    },
    "content": [
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "El socket",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " de la placa debe ser el del procesador."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "El chipset",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " debe ser de la misma familia que el procesador (por ejemplo, un chipset para AM5 con un Ryzen para AM5)."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "La RAM",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " debe ser del tipo que acepta la placa: DDR4 y DDR5 no entran en la misma ranura, tienen la muesca en otro lugar."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-pb016",
     "nombre": "placa-compat",
     "titulo": "¿Son compatibles?"
    }
   },
   {
    "type": "callout",
    "attrs": {
     "id": "b-pb017",
     "variante": "info"
    },
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "A veces el socket coincide, pero una placa vieja necesita "
       },
       {
        "type": "text",
        "text": "actualizar su UEFI",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " para reconocer un procesador más nuevo de la misma familia. Revisa la lista de procesadores compatibles en la página del fabricante de la placa."
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-energia",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "La energía: el VRM"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Un procesador moderno trabaja a poco más de 1 V, pero puede pedir más de 200 A en un instante. El "
     },
     {
      "type": "text",
      "text": "VRM",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " ("
     },
     {
      "type": "text",
      "text": "voltage regulator module",
      "marks": [
       {
        "type": "italic"
       }
      ]
     },
     {
      "type": "text",
      "text": ") convierte los 12 V de la fuente en ese voltaje bajo, por "
     },
     {
      "type": "text",
      "text": "fases",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " que se turnan para repartir el calor. Un VRM débil se calienta y obliga al procesador a bajar su velocidad."
     }
    ],
    "attrs": {
     "id": "b-pb018"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Por eso las placas para procesadores de gama alta tienen más fases y disipadores metálicos alrededor del socket."
     }
    ],
    "attrs": {
     "id": "b-pb019"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-arranque",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "UEFI y el arranque"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Al presionar el botón de encendido, el procesador todavía no sabe nada del sistema operativo. El primer programa que ejecuta es el "
     },
     {
      "type": "text",
      "text": "firmware",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " de la placa, la "
     },
     {
      "type": "text",
      "text": "UEFI",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " (la versión moderna de la BIOS). Ella revisa el hardware, lo prepara y busca de dónde arrancar."
     }
    ],
    "attrs": {
     "id": "b-pb020"
    }
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-pb021",
     "nombre": "placa-arranque",
     "titulo": "El arranque paso a paso"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Desde la configuración de la UEFI (se entra con una tecla como Supr, F2 o F12 al encender) puedes cambiar el orden de arranque, activar el perfil de velocidad de la RAM (XMP o EXPO) o el "
     },
     {
      "type": "text",
      "text": "arranque seguro",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " ("
     },
     {
      "type": "text",
      "text": "Secure Boot",
      "marks": [
       {
        "type": "italic"
       }
      ]
     },
     {
      "type": "text",
      "text": "), que solo deja arrancar sistemas firmados para evitar programas maliciosos."
     }
    ],
    "attrs": {
     "id": "b-pb022"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-dudas",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Dudas comunes"
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-pb023"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿La placa base afecta el rendimiento?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Menos de lo que parece: el procesador y la tarjeta gráfica rinden casi igual en una placa barata que en una cara, mientras el VRM aguante. Lo que cambia es la cantidad de puertos, ranuras M.2, la red, el audio y la posibilidad de subir la frecuencia (overclock)."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-pb024"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Puedo cambiar el procesador sin cambiar la placa?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Solo si el nuevo usa el mismo socket y el chipset lo acepta, a veces con una actualización de la UEFI. Si cambias de generación de socket (por ejemplo, de AM4 a AM5), necesitas placa nueva y, en ese caso, también RAM DDR5."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-pb025"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Qué pasa si se acaba la pila CMOS?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "La computadora sigue funcionando, pero pierde la hora al desconectarla y, en placas viejas, también los ajustes de la UEFI. Es una pila de botón CR2032, barata y fácil de cambiar."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-pb026"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Qué significan los pitidos o las luces al encender?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Son códigos de diagnóstico: si el POST encuentra un problema antes de poder mostrar imagen, la placa avisa con pitidos o con LED marcados como CPU, DRAM, VGA y BOOT. El manual explica cada código."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-repaso",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Repasa lo aprendido"
     }
    ]
   },
   {
    "type": "repaso",
    "attrs": {
     "id": "b-pb027",
     "preguntas": [
      {
       "q": "¿Qué pieza decide qué procesadores puedes usar?",
       "o": [
        "La fuente de poder",
        "El socket y el chipset de la placa base",
        "La tarjeta gráfica"
       ],
       "a": 1,
       "e": "El procesador debe encajar en el socket, y el chipset debe ser de la misma familia."
      },
      {
       "q": "Un SSD en PCIe 4.0 ×4, ¿cuánto ancho de banda tiene aproximadamente?",
       "o": [
        "Unos 8 GB/s",
        "Unos 2 GB/s",
        "Unos 32 GB/s"
       ],
       "a": 0,
       "e": "Cada carril de PCIe 4.0 da unos 2 GB/s; con 4 carriles son casi 8 GB/s."
      },
      {
       "q": "Tu placa acepta DDR4. ¿Puedes ponerle un módulo DDR5?",
       "o": [
        "Sí, solo va más lento",
        "No: tienen la muesca en otro lugar y no entran",
        "Sí, si actualizas la UEFI"
       ],
       "a": 1,
       "e": "DDR4 y DDR5 son físicamente distintos; una placa acepta solo uno de los dos tipos."
      },
      {
       "q": "¿Qué hace el POST al encender la computadora?",
       "o": [
        "Instala el sistema operativo",
        "Revisa que el hardware básico funcione antes de arrancar",
        "Descarga actualizaciones"
       ],
       "a": 1,
       "e": "El Power-On Self-Test revisa el procesador, la RAM y la tarjeta gráfica; si algo falla, avisa con pitidos o luces."
      },
      {
       "q": "¿Para qué sirve el VRM?",
       "o": [
        "Para dar el voltaje exacto y estable que pide el procesador",
        "Para conectar la red",
        "Para guardar la hora"
       ],
       "a": 0,
       "e": "Convierte los 12 V de la fuente en el voltaje bajo del procesador, repartido en fases."
      }
     ]
    }
   },
   {
    "type": "resumen",
    "attrs": {
     "id": "b-pb028"
    },
    "content": [
     {
      "type": "bulletList",
      "content": [
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "La placa base conecta y alimenta todas las piezas, y guarda el firmware que arranca la computadora."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "El socket, el chipset y el tipo de RAM deben coincidir con el procesador y la memoria."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "PCIe usa carriles; cada generación duplica la velocidad por carril, y a veces los carriles se comparten."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "ATX, Micro-ATX y Mini-ITX son tamaños estándar con distinta cantidad de ranuras."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Al encender, la UEFI hace el POST, prepara el hardware y busca el sistema operativo."
           }
          ]
         }
        ]
       }
      ]
     }
    ]
   }
  ]
 }
