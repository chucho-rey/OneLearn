<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="pr-lenta">
<p class="hint">La computadora de Ana va lentísima desde hace un rato. Encuentra qué la frena y arréglalo.</p>
<div class="term-host"></div>
</template>
<template data-lab="pr-arranque">
<p class="hint">Cada servicio tiene dos interruptores: si está encendido ahora y si arranca solo al encender la computadora. Cámbialos, reinicia y mira qué queda encendido.</p>
<ul class="pa-l" id="paLista"></ul>
<div class="ctl">
  <button class="btn pri" type="button" id="paReinicio">Reiniciar la computadora</button>
  <button class="btn" type="button" id="paReset">Como al principio</button>
</div>
<p class="pa-cmd" id="paCmd" aria-live="polite"></p>
<div class="kpis">
  <div class="kpi"><span>Encendidos ahora</span><b id="paAct"></b></div>
  <div class="kpi"><span>Arrancan solos</span><b id="paHab"></b></div>
  <div class="kpi"><span>Reinicios</span><b id="paRei"></b></div>
</div>
<div class="status" id="paStat" data-k="" aria-live="polite"><span class="dot"></span><span id="paMsg"></span></div>
</template>
<template data-lab="pr-servicio">
<p class="hint">Es lunes y nadie puede conectarse por SSH al servidor de la oficina. Averigua qué pasó, arréglalo y deja constancia de quién fue.</p>
<div class="term-host"></div>

         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Cuánto ocupa una carpeta"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "nproc",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Cuántos núcleos de procesador hay"
           }
          ]
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "callout",
    "attrs": {
     "id": "b-pr010",
     "variante": "idea"
    },
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "La memoria «libre» casi siempre se ve baja, y está bien: Linux usa la RAM sobrante como caché del disco para ir más rápido, y la suelta en cuanto un programa la pide. Lo que importa es la columna "
       },
       {
        "type": "text",
        "text": "disponible",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": "."
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-senales",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Señales: pedirle a un proceso que termine"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Para detener un proceso se le manda una "
     },
     {
      "type": "text",
      "text": "señal",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " con el comando "
     },
     {
      "type": "text",
      "text": "kill",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": " y su PID. El nombre asusta, pero la señal que manda por defecto es educada: «termina, por favor»."
     }
    ],
    "attrs": {
     "id": "b-pr011"
    }
   },
   {
    "type": "table",
    "attrs": {
     "id": "b-pr012"
    },
    "content": [
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableHeader",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Señal"
           }
          ]
         }
        ]
       },
       {
        "type": "tableHeader",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Número"
           }
          ]
         }
        ]
       },
       {
        "type": "tableHeader",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Qué hace"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "TERM",
            "marks": [
             {
              "type": "bold"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "15"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "La de siempre ("
           },
           {
            "type": "text",
            "text": "kill PID",
            "marks": [
             {
              "type": "code"
             }
            ]
           },
           {
            "type": "text",
            "text": "): pide que termine; el programa puede guardar y cerrar bien"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "KILL",
            "marks": [
             {
              "type": "bold"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "9"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "kill -9 PID",
            "marks": [
             {
              "type": "code"
             }
            ]
           },
           {
            "type": "text",
            "text": ": el kernel lo termina en el acto, sin dejarlo guardar. Último recurso"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "INT",
            "marks": [
             {
              "type": "bold"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "2"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "La que mandas con Ctrl+C"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "HUP",
            "marks": [
             {
              "type": "bold"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "1"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Muchos servicios la usan para volver a leer su configuración"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "STOP",
            "marks": [
             {
              "type": "bold"
             }
            ]
           },
           {
            "type": "text",
            "text": " y "
           },
           {
            "type": "text",
            "text": "CONT",
            "marks": [
             {
              "type": "bold"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "19 y 18"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Pausan y reanudan un proceso"
           }
          ]
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "codeBlock",
    "attrs": {
     "id": "b-pr013",
     "language": "bash"
    },
    "content": [
     {
      "type": "text",
      "text": "kill 2290          # pide al proceso 2290 que termine\nkill -9 2290       # lo termina a la fuerza si no hizo caso\nkillall firefox    # todos los procesos que se llamen firefox\npkill -f reporte   # los que tengan «reporte» en su comando"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Solo puedes mandar señales a tus propios procesos. Los de otros usuarios y los del sistema requieren "
     },
     {
      "type": "text",
      "text": "sudo",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": "."
     }
    ],
    "attrs": {
     "id": "b-pr014"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "b-pr015",
     "level": 3
    },
    "content": [
     {
      "type": "text",
      "text": "Primer y segundo plano"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Un comando que tarda deja la terminal ocupada; "
     },
     {
      "type": "text",
      "text": "Ctrl+C",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " lo interrumpe. Si escribes "
     },
     {
      "type": "text",
      "text": "&",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": " al final, corre en "
     },
     {
      "type": "text",
      "text": "segundo plano",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " y puedes seguir trabajando: "
     },
     {
      "type": "text",
      "text": "jobs",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": " lista esas tareas y "
     },
     {
      "type": "text",
      "text": "kill %1",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": " termina la número 1."
     }
    ],
    "attrs": {
     "id": "b-pr016"
    }
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-pr017",
     "nombre": "pr-lenta",
     "titulo": "La computadora va lenta"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-servicios",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Servicios y systemd"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Un "
     },
     {
      "type": "text",
      "text": "servicio",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " (también llamado "
     },
     {
      "type": "text",
      "text": "demonio",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ", "
     },
     {
      "type": "text",
      "text": "daemon",
      "marks": [
       {
        "type": "italic"
       }
      ]
     },
     {
      "type": "text",
      "text": ") es un programa que corre en segundo plano esperando trabajo: el servidor web espera visitas, SSH espera conexiones, cron espera la hora de sus tareas. Por eso muchos terminan en «d»: "
     },
     {
      "type": "text",
      "text": "sshd",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": ", "
     },
     {
      "type": "text",
      "text": "crond",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": ", "
     },
     {
      "type": "text",
      "text": "systemd",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": "."
     }
    ],
    "attrs": {
     "id": "b-pr018"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "En Ubuntu, y en casi todas las distribuciones actuales, los servicios los administra "
     },
     {
      "type": "text",
      "text": "systemd",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " con el comando "
     },
     {
      "type": "text",
      "text": "systemctl",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": ":"
     }
    ],
    "attrs": {
     "id": "b-pr019"
    }
   },
   {
    "type": "table",
    "attrs": {
     "id": "b-pr020"
    },
    "content": [
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableHeader",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Comando"
           }
          ]
         }
        ]
       },
       {
        "type": "tableHeader",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Qué hace"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "systemctl status ssh",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Cómo está: si corre, desde cuándo, su PID y sus últimos registros"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "sudo systemctl start ssh",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Lo enciende ahora"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "sudo systemctl stop ssh",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Lo apaga ahora"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "sudo systemctl restart ssh",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Lo apaga y lo vuelve a encender (por ejemplo, después de cambiar su configuración)"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "sudo systemctl reload nginx",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Relee la configuración sin cortar a quien está conectado (si el servicio lo permite)"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "sudo systemctl enable ssh",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Hace que arranque solo cada vez que se enciende la computadora"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "sudo systemctl disable ssh",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Que ya no arranque solo"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "sudo systemctl enable --now ssh",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Las dos cosas a la vez: lo habilita y lo enciende"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "systemctl list-units --type=service",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Los servicios que están corriendo"
           }
          ]
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "callout",
    "attrs": {
     "id": "b-pr021",
     "variante": "idea"
    },
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "`start` no es lo mismo que `enable`.",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " "
       },
       {
        "type": "text",
        "text": "start",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": " lo enciende ahora; "
       },
       {
        "type": "text",
        "text": "enable",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": " lo deja listo para el siguiente arranque. Un servicio puede estar encendido pero no habilitado (al reiniciar se queda apagado) o habilitado pero apagado. Es una de las causas más comunes de «ayer funcionaba y después de reiniciar ya no»."
       }
      ]
     }
    ]
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-pr022",
     "nombre": "pr-arranque",
     "titulo": "Encendido y habilitado"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "b-pr023",
     "level": 3
    },
    "content": [
     {
      "type": "text",
      "text": "Leer el estado de un servicio"
     }
    ]
   },
   {
    "type": "codeBlock",
    "attrs": {
     "id": "b-pr024",
     "language": "text"

      {
       "q": "¿Qué diferencia hay entre un programa y un proceso?",
       "o": [
        "Ninguna",
        "El proceso es el programa corriendo, con su PID y su memoria",
        "El programa es más rápido"
       ],
       "a": 1,
       "e": "El programa es el archivo; cada vez que lo ejecutas nace un proceso con su propio PID."
      },
      {
       "q": "¿Qué señal manda `kill 2290`?",
       "o": [
        "KILL (9): lo termina en el acto",
        "TERM (15): le pide que termine",
        "STOP: lo pausa"
       ],
       "a": 1,
       "e": "Por defecto, kill manda TERM, que deja al programa cerrar bien. Para forzarlo: `kill -9`."
      },
      {
       "q": "`uptime` dice «carga media: 3,9» en una computadora de 2 núcleos. ¿Qué significa?",
       "o": [
        "Que va sobrada",
        "Que hay casi el doble de trabajo del que puede atender",
        "Que lleva 3,9 días encendida"
       ],
       "a": 1,
       "e": "Con 2 núcleos, una carga de 2 es el 100 %. Con 3,9 hay procesos esperando turno: por eso se siente lenta."
      },
      {
       "q": "Encendiste nginx con `sudo systemctl start nginx`, reiniciaste la computadora y quedó apagado. ¿Qué faltó?",
       "o": [
        "restart",
        "enable",
        "reload"
       ],
       "a": 1,
       "e": "`start` lo enciende solo por ahora; `enable` hace que arranque en cada encendido. `enable --now` hace las dos cosas."
      },
      {
       "q": "¿Dónde buscas por qué un servicio no arranca?",
       "o": [
        "En sus registros: systemctl status o journalctl -u",
        "En /home",
        "Reinstalando Linux"
       ],
       "a": 0,
       "e": "`systemctl status` muestra las últimas líneas y `journalctl -u servicio` todas. Ahí suele estar el error exacto."
      },
      {
       "q": "¿En qué columna de `free -h` debes fijarte para saber si te falta memoria?",
       "o": [
        "libre",
        "disponible",
        "compartido"
       ],
       "a": 1,
       "e": "Linux usa la RAM que sobra como caché y la libera cuando hace falta, así que «disponible» es la que cuenta."
      }
     ]
