<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="aa-recta">
<p class="hint">Cada punto es un estudiante: horas de estudio a la semana y su calificación. Mueve la recta para que quede lo más cerca posible de los puntos, o deja que se entrene sola.</p>
<svg class="ar-svg" id="arSvg" viewBox="0 0 340 220" role="img" aria-label="Puntos de horas de estudio contra calificación y la recta del modelo"></svg>
<div class="ctl">
  <span class="lbl">Pendiente</span>
  <input class="slider" type="range" id="arM" min="-0.5" max="1.5" step="0.05" value="0" aria-label="Pendiente">
  <b class="mono" id="arMv"></b>
</div>
<div class="ctl">
  <span class="lbl">Valor inicial</span>
  <input class="slider" type="range" id="arB" min="0" max="10" step="0.1" value="7.5" aria-label="Valor inicial">
  <b class="mono" id="arBv"></b>
</div>
<div class="kpis">
  <div class="kpi"><span>Error (promedio de los cuadrados)</span><b id="arErr"></b><div class="bar"><i id="arBar"></i></div></div>
  <div class="kpi"><span>Predicción para 12 horas</span><b id="arPred"></b></div>
</div>
<div class="ctl">
  <button class="btn pri" type="button" id="arEntrenar">Entrenar (descenso de gradiente)</button>
  <span class="lbl" id="arPasos"></span>
</div>
<p class="msg" id="arMsg" aria-live="polite"></p>
</template>
<template data-lab="aa-vecinos">
<p class="hint">Cada punto es un animal que ya conocemos: peso y altura. Mueve el animal nuevo (el rombo) con los controles o tocando la gráfica, y elige cuántos vecinos votan.</p>
<svg class="vc-svg" id="vcSvg" viewBox="0 0 340 230" role="img" aria-label="Gatos y perros según su peso y altura, con el animal nuevo"></svg>
<div class="leg"><span><i class="vc-l-g"></i>Gato</span><span><i class="vc-l-p"></i>Perro</span><span><i class="vc-l-n"></i>Animal nuevo</span></div>
<div class="ctl">
  <span class="lbl">Peso</span>
  <input class="slider" type="range" id="vcPeso" min="1" max="40" step="0.5" value="9" aria-label="Peso del animal nuevo">
  <b class="mono" id="vcPesoV"></b>
</div>
<div class="ctl">
  <span class="lbl">Altura</span>
  <input class="slider" type="range" id="vcAlt" min="15" max="75" step="1" value="33" aria-label="Altura del animal nuevo">
  <b class="mono" id="vcAltV"></b>
</div>
<div class="ctl">
  <span class="lbl">Vecinos (k)</span>
  <div class="seg" id="vcK" role="group" aria-label="Cantidad de vecinos">
    <button type="button" data-v="1" aria-pressed="false">1</button>
    <button type="button" data-v="3" aria-pressed="true">3</button>
    <button type="button" data-v="5" aria-pressed="false">5</button>
  </div>
</div>
<div class="status" id="vcStat" data-k="" aria-live="polite"><span class="dot"></span><span id="vcMsg"></span></div>
</template>
<template data-lab="aa-sobreajuste">
<p class="hint">Los puntos llenos son los datos de entrenamiento; los huecos, datos de prueba que el modelo no ve. Elige qué tan flexible es la curva.</p>
<div class="seg" id="sjG" role="group" aria-label="Flexibilidad del modelo">
  <button type="button" data-v="1" aria-pressed="false">Recta</button>
  <button type="button" data-v="3" aria-pressed="true">Curva suave</button>
  <button type="button" data-v="9" aria-pressed="false">Curva muy flexible</button>
</div>
<svg class="sj-svg" id="sjSvg" viewBox="0 0 340 200" role="img" aria-label="Datos de entrenamiento, de prueba y la curva del modelo"></svg>
<div class="leg"><span><i class="sj-l-e"></i>Entrenamiento</span><span><i class="sj-l-p"></i>Prueba</span></div>
<div class="kpis">
  <div class="kpi"><span>Error con los datos de entrenamiento</span><b id="sjEe"></b></div>
  <div class="kpi"><span>Error con los datos de prueba</span><b id="sjEp"></b></div>
</div>
<p class="msg" id="sjMsg" aria-live="polite"></p>
</template>
