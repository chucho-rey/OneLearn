<template data-lab="dn-ip">
<p class="hint">Escribe los cuatro números de una dirección (del 0 al 255) y mira sus bits y de qué tipo es.</p>
<div class="ip" role="group" aria-label="Dirección IPv4">
  <input class="campo num mono" type="number" min="0" max="255" id="ip0" value="192" aria-label="Primer octeto">
  <span aria-hidden="true">.</span>
  <input class="campo num mono" type="number" min="0" max="255" id="ip1" value="168" aria-label="Segundo octeto">
  <span aria-hidden="true">.</span>
  <input class="campo num mono" type="number" min="0" max="255" id="ip2" value="1" aria-label="Tercer octeto">
  <span aria-hidden="true">.</span>
  <input class="campo num mono" type="number" min="0" max="255" id="ip3" value="10" aria-label="Cuarto octeto">
</div>
<div class="chips ip-ej" id="ipEj" role="group" aria-label="Ejemplos">
  <button class="chip" type="button" data-v="192.168.1.10" aria-pressed="false">192.168.1.10</button>
  <button class="chip" type="button" data-v="10.0.0.25" aria-pressed="false">10.0.0.25</button>
  <button class="chip" type="button" data-v="127.0.0.1" aria-pressed="false">127.0.0.1</button>
  <button class="chip" type="button" data-v="8.8.8.8" aria-pressed="false">8.8.8.8</button>
</div>
<div class="ip-bits" id="ipBits"></div>
<div class="status" id="ipStat" data-k="" aria-live="polite"><span class="dot"></span><span id="ipMsg"></span></div>
</template>
<template data-lab="dn-mascara">
<p class="hint">Tu equipo tiene la dirección 192.168.1.10. Elige la máscara y otra dirección para ver si están en la misma red.</p>
<div class="ctl" style="margin-top:0">
  <span class="lbl">Máscara</span>
  <div class="seg" id="msPre" role="group" aria-label="Máscara">
    <button type="button" data-v="8" aria-pressed="false">/8</button>
    <button type="button" data-v="16" aria-pressed="false">/16</button>
    <button type="button" data-v="24" aria-pressed="true">/24</button>
    <button type="button" data-v="28" aria-pressed="false">/28</button>
  </div>
</div>
<div class="ctl">
  <span class="lbl">Otra dirección</span>
  <div class="chips" id="msOtra" role="group" aria-label="Otra dirección">
    <button class="chip" type="button" data-v="192.168.1.200" aria-pressed="true">192.168.1.200</button>
    <button class="chip" type="button" data-v="192.168.1.12" aria-pressed="false">192.168.1.12</button>
    <button class="chip" type="button" data-v="192.168.2.5" aria-pressed="false">192.168.2.5</button>
    <button class="chip" type="button" data-v="10.0.0.1" aria-pressed="false">10.0.0.1</button>
  </div>
</div>
<div class="kpis">
  <div class="kpi"><span>Máscara</span><b id="msMas"></b></div>
  <div class="kpi"><span>Dirección de la red</span><b id="msRed"></b></div>
  <div class="kpi"><span>Equipos posibles en la red</span><b id="msHost"></b></div>
</div>
<div class="status" id="msStat" data-k="" aria-live="polite"><span class="dot"></span><span id="msMsg"></span></div>
</template>
<template data-lab="dn-resolver">
<p class="hint">Elige un nombre y avanza paso a paso. Las direcciones IP del ejemplo son ficticias (de los rangos reservados para documentación).</p>
<div class="chips" id="rsNom" role="group" aria-label="Nombre a resolver">
  <button class="chip" type="button" data-v="0" aria-pressed="true">es.wikipedia.org</button>
  <button class="chip" type="button" data-v="1" aria-pressed="false">www.unam.mx</button>
</div>
<ol class="rs-p" id="rsPasos"></ol>
<div class="kpis">
  <div class="kpi"><span>Tiempo de la resolución</span><b id="rsMs"></b></div>
  <div class="kpi"><span>Respuesta</span><b id="rsIp"></b></div>
</div>
<div class="status" id="rsStat" data-k="" aria-live="polite"><span class="dot"></span><span id="rsMsg"></span></div>
<div class="ctl">
  <button class="btn pri" type="button" id="rsSig">Siguiente paso</button>
  <button class="btn" type="button" id="rsOtra">Visitarlo otra vez</button>
  <button class="btn" type="button" id="rsVaciar">Vaciar la caché</button>
</div>
</template>
