<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="mv-traducir">
<p class="hint">Este proceso usa direcciones de 16 bits y páginas de 4 KB: los 4 bits de la izquierda son el número de página y los 12 de la derecha, el desplazamiento. Elige una dirección.</p>
<div class="chips" id="trDir" role="group" aria-label="Dirección virtual">
  <button class="chip" type="button" data-v="1234" aria-pressed="true">1,234</button>
  <button class="chip" type="button" data-v="9000" aria-pressed="false">9,000</button>
  <button class="chip" type="button" data-v="13000" aria-pressed="false">13,000</button>
  <button class="chip" type="button" data-v="30000" aria-pressed="false">30,000</button>
  <button class="chip" type="button" data-v="50000" aria-pressed="false">50,000</button>
</div>
<div class="tr-bits" id="trBits" aria-hidden="true"></div>
<div class="tr">
  <div class="tbl-wrap tr-w"><table class="tr-t"><thead><tr><th>Página</th><th>¿Dónde está?</th></tr></thead><tbody id="trTab"></tbody></table></div>
  <div class="tr-r">
    <div class="kpis tr-k">
      <div class="kpi"><span>Número de página</span><b id="trPag"></b></div>
      <div class="kpi"><span>Desplazamiento</span><b id="trDes"></b></div>
      <div class="kpi"><span>Dirección física</span><b id="trFis"></b></div>
    </div>
    <div class="status" id="trStat" data-k="" aria-live="polite"><span class="dot"></span><span id="trMsg"></span></div>
  </div>
</div>
</template>
<template data-lab="mv-reemplazo">
<p class="hint">Solo hay 3 marcos en la RAM. El programa pide estas 20 páginas en orden. Elige la regla y avanza: una celda marcada es un fallo de página.</p>
<div class="chips" id="rpAlg" role="group" aria-label="Regla de reemplazo">
  <button class="chip" type="button" data-v="fifo" aria-pressed="true">FIFO: sale la que llegó primero</button>
  <button class="chip" type="button" data-v="lru" aria-pressed="false">LRU: sale la que no se usa hace más</button>
  <button class="chip" type="button" data-v="opt" aria-pressed="false">Óptima: sale la que más tardará en usarse</button>
</div>
<div class="tbl-wrap rp-w"><table class="rp" id="rpTab"></table></div>
<div class="kpis">
  <div class="kpi"><span>Fallos de página</span><b id="rpFal"></b><div class="bar"><i id="rpBar"></i></div></div>
  <div class="kpi"><span>Accesos revisados</span><b id="rpN"></b></div>
</div>
<p class="msg" id="rpMsg" aria-live="polite"></p>
<div class="ctl">
  <button class="btn pri" type="button" id="rpSig">Siguiente acceso</button>
  <button class="btn" type="button" id="rpTodo">Todos</button>
  <button class="btn" type="button" id="rpReset">Reiniciar</button>
</div>
</template>

     {

     "id": "b-mv003"

   },
   {

     {

       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ": cada proceso cree que tiene para él solo un espacio de memoria enorme y continuo, y el sistema operativo, con ayuda del procesador, traduce cada dirección que usa el programa a un lugar real de la RAM (o del disco)."
     }

   },
   {

            "type": "bold"

          ]
         }

       },
       {

        "content": [
         {

     {

       {

     },
     {
      "type": "columna",
      "content": [
       {
        "type": "paragraph",

         {

          "text": "Más simple para programar",

           {
            "type": "bold"
           }
          ]
         }
        ]
       },
       {
        "type": "paragraph",

        "type": "bold"

      "text": " y los bajos, el "

     {

      "text": "desplazamiento",
      "marks": [
       {
        "type": "bold"
       }

   {

      "text": "Si la página no está en la RAM, ocurre un "

       {
        "type": "bold"
       }

           {
            "type": "bold"

         },
         {
          "type": "text",
          "text": "procesador",
          "marks": [

         {
          "type": "text",

   {

     {

        "type": "bold"

   },
   {

     {

       {

         {
          "type": "bold"

        "type": "text",

   {

    "content": [
     {
      "type": "text",
      "text": "Cada entrada de la tabla de páginas tiene permisos: lectura, escritura y ejecución. Así el sistema impide que un programa ejecute datos como si fueran código (una defensa clásica contra ataques) o que escriba sobre su propio código."

    "attrs": {
     "id": "b-mv016"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "La memoria virtual también permite "

        "type": "bold"

     {
      "type": "text",
      "text": ": si diez programas usan la misma biblioteca, sus páginas se cargan una sola vez en la RAM y aparecen en el espacio de los diez. Y al crear un proceso copia de otro, el sistema no copia nada hasta que alguno escribe ("

     "id": "b-mv017"

   },
   {

    "attrs": {
     "id": "s-dudas",
     "level": 2
    },

     {
      "type": "text",

     "id": "b-mv018"

     {

        "type": "text",

          "type": "text",

    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-mv019"
    },

     {
      "type": "desplegableTitulo",

        "type": "text",

       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Windows, macOS y Linux pueden comprimir páginas poco usadas y dejarlas en la RAM en vez de mandarlas al disco. Comprimir y descomprimir es más rápido que leer del SSD."

        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-mv020"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Por qué un sistema de 32 bits solo usa 4 GB?"

     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Porque con direcciones de 32 bits solo hay 2"

          "type": "text",
          "text": "32",

            "type": "superscript"
           }

         },
         {
          "type": "text",
          "text": " = 4,294,967,296 direcciones distintas: 4 GiB. Los sistemas de 64 bits tienen un espacio virtual tan grande que, en la práctica, el límite lo pone la RAM instalada."

        ]
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {

    },

   {

       "o": [
        "El disco duro",
        "La MMU del procesador, usando la tabla de páginas",
        "El navegador"
       ],
       "a": 1,
       "e": "La MMU consulta la tabla de páginas del proceso (y su caché, la TLB) en cada acceso."
