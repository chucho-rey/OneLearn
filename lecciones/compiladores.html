<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="co-lexico">
<p class="hint">Escribe una línea de código. Variables disponibles: precio, cantidad, descuento, x y y.</p>
<label class="lbl" for="lxIn">Código</label>
<input class="campo mono" type="text" id="lxIn" value="total = precio * cantidad - descuento" spellcheck="false" autocomplete="off">
<div class="tks" id="lxTok" aria-live="polite"></div>
<div class="leg"><span><i class="tk-id"></i>Identificador</span><span><i class="tk-num"></i>Número</span><span><i class="tk-op"></i>Operador</span><span><i class="tk-sig"></i>Asignación o paréntesis</span></div>
<div class="status" id="lxStat" data-k="" aria-live="polite"><span class="dot"></span><span id="lxMsg"></span></div>
</template>
<template data-lab="co-arbol">
<p class="hint">Elige una expresión o escribe la tuya, y mira cómo queda el árbol.</p>
<div class="chips" id="asPre" role="group" aria-label="Expresiones de ejemplo">
  <button class="chip" type="button" data-v="2 + 3 * 4" aria-pressed="true">2 + 3 * 4</button>
  <button class="chip" type="button" data-v="(2 + 3) * 4" aria-pressed="false">(2 + 3) * 4</button>
  <button class="chip" type="button" data-v="10 - 4 - 3" aria-pressed="false">10 - 4 - 3</button>
  <button class="chip" type="button" data-v="precio * cantidad - descuento" aria-pressed="false">precio * cantidad - descuento</button>
</div>
<label class="lbl as-l" for="asIn">Expresión</label>
<input class="campo mono" type="text" id="asIn" value="2 + 3 * 4" spellcheck="false" autocomplete="off">
<svg class="as-svg" id="asSvg" role="img" aria-label="Árbol de sintaxis"></svg>
<div class="status" id="asStat" data-k="" aria-live="polite"><span class="dot"></span><span id="asMsg"></span></div>
</template>
<template data-lab="co-codigo">
<p class="hint">El compilador recorre el árbol y genera instrucciones para una máquina de pila. Ejecútalas paso a paso.</p>
<label class="lbl" for="cdIn">Código</label>
<input class="campo mono" type="text" id="cdIn" value="total = precio * cantidad - descuento" spellcheck="false" autocomplete="off">
<div class="ctl">
  <label class="chk"><input type="checkbox" id="cdOpt"> Optimizar (plegado de constantes)</label>
  <div class="chips" id="cdPre" role="group" aria-label="Ejemplos">
    <button class="chip" type="button" data-v="total = precio * cantidad - descuento" aria-pressed="true">Precio total</button>
    <button class="chip" type="button" data-v="segundos = 60 * 60 * 24" aria-pressed="false">Segundos en un día</button>
  </div>
</div>
<div class="cd">
  <div><p class="lbl">Instrucciones</p><ol class="cd-ins" id="cdIns"></ol></div>
  <div><p class="lbl">Pila</p><div class="cd-pila" id="cdPila"></div><p class="lbl cd-v" id="cdVars"></p></div>
</div>
<div class="status" id="cdStat" data-k="" aria-live="polite"><span class="dot"></span><span id="cdMsg"></span></div>
<div class="ctl">
  <button class="btn pri" type="button" id="cdSig">Siguiente instrucción</button>
  <button class="btn" type="button" id="cdReset">Reiniciar</button>
</div>
</template>
