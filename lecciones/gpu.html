<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="gpu-pintar">
<p class="hint">Las dos pintan la misma imagen de 384 píxeles. La CPU tiene 8 núcleos que pintan un píxel en 1 µs; la GPU, 128 núcleos que tardan 4 µs cada uno. Elige el tipo de tarea y pulsa «Pintar».</p>
<div class="seg" id="ptTarea" role="group" aria-label="Tipo de tarea">
  <button type="button" data-v="0" aria-pressed="true">Cada píxel por separado</button>
  <button type="button" data-v="1" aria-pressed="false">Cada píxel depende del anterior</button>
</div>
<div class="pt">
  <div class="pt-p">
    <div class="pt-h"><b>CPU · 8 núcleos</b><span class="mono" id="ptTc"></span></div>
    <div class="pt-img" id="ptCpu" aria-hidden="true"></div>
  </div>
  <div class="pt-p">
    <div class="pt-h"><b>GPU · 128 núcleos</b><span class="mono" id="ptTg"></span></div>
    <div class="pt-img" id="ptGpu" aria-hidden="true"></div>
  </div>
</div>
<p class="msg" id="ptMsg" aria-live="polite"></p>
<div class="ctl">
  <button class="btn pri" type="button" id="ptGo">Pintar</button>
</div>
</template>
<template data-lab="gpu-raster">
<p class="hint">El triángulo es el mismo; cambia cuántos píxeles tiene la pantalla. Un píxel se pinta si su centro cae dentro del triángulo.</p>
<div class="ctl" style="margin-top:0">
  <span class="lbl">Píxeles por lado</span>
  <div class="seg" id="rsRes" role="group" aria-label="Píxeles por lado">
    <button type="button" data-v="8" aria-pressed="true">8</button>
    <button type="button" data-v="16" aria-pressed="false">16</button>
    <button type="button" data-v="32" aria-pressed="false">32</button>
  </div>
  <label class="chk"><input type="checkbox" id="rsTri" checked> Mostrar el triángulo</label>
  <label class="chk"><input type="checkbox" id="rsSom"> Sombrear (mezclar colores)</label>
</div>
<div class="rs">
  <svg class="rs-svg" id="rsSvg" viewBox="0 0 320 320" role="img" aria-label="Cuadrícula de píxeles con un triángulo"></svg>
  <div class="kpis rs-kpis">
    <div class="kpi"><span>Píxeles en la imagen</span><b id="rsTot"></b></div>
    <div class="kpi"><span>Píxeles dentro del triángulo</span><b id="rsIn"></b></div>
    <div class="kpi"><span>Comprobaciones que hace la GPU</span><b id="rsChk"></b></div>
  </div>
</div>
<p class="msg" id="rsMsg" aria-live="polite"></p>
</template>
<template data-lab="gpu-fps">
<p class="hint">Elige la resolución y cuántos cuadros por segundo quieres.</p>
<div class="ctl" style="margin-top:0">
  <span class="lbl">Resolución</span>
  <div class="seg" id="fpRes" role="group" aria-label="Resolución">
    <button type="button" data-v="0" aria-pressed="false">720p</button>
    <button type="button" data-v="1" aria-pressed="true">1080p</button>
    <button type="button" data-v="2" aria-pressed="false">1440p</button>
    <button type="button" data-v="3" aria-pressed="false">4K</button>
  </div>
</div>
<div class="ctl">
  <span class="lbl">Cuadros por segundo</span>
  <div class="seg" id="fpFps" role="group" aria-label="Cuadros por segundo">
    <button type="button" data-v="30" aria-pressed="false">30</button>
    <button type="button" data-v="60" aria-pressed="true">60</button>
    <button type="button" data-v="144" aria-pressed="false">144</button>
  </div>
</div>
<div class="kpis">
  <div class="kpi"><span>Píxeles en cada cuadro</span><b id="fpPx"></b></div>
  <div class="kpi"><span>Píxeles por segundo</span><b id="fpPs"></b></div>
  <div class="kpi"><span>Tiempo para dibujar cada cuadro</span><b id="fpMs"></b></div>
  <div class="kpi"><span>Trabajo comparado con 720p a 30 FPS</span><b id="fpX"></b><div class="bar"><i id="fpBar"></i></div></div>
</div>
<p class="msg" id="fpMsg" aria-live="polite"></p>
</template>
<template data-lab="gpu-vram">
<p class="hint">Ancho de banda = ancho del bus × velocidad por línea ÷ 8 (para pasar de bits a bytes). Elige una combinación y compárala.</p>
<div class="ctl" style="margin-top:0">
  <span class="lbl">Ancho del bus</span>
  <div class="seg" id="vrBus" role="group" aria-label="Ancho del bus">
    <button type="button" data-v="128" aria-pressed="false">128 bits</button>
    <button type="button" data-v="192" aria-pressed="false">192</button>
    <button type="button" data-v="256" aria-pressed="true">256</button>
    <button type="button" data-v="384" aria-pressed="false">384</button>
  </div>
</div>
<div class="ctl">
  <span class="lbl">Memoria y velocidad por línea</span>
  <div class="chips" id="vrVel" role="group" aria-label="Memoria y velocidad por línea">
    <button class="chip" type="button" data-v="14" aria-pressed="false">GDDR6 · 14 Gbps</button>
    <button class="chip" type="button" data-v="20" aria-pressed="true">GDDR6 · 20 Gbps</button>
    <button class="chip" type="button" data-v="21" aria-pressed="false">GDDR6X · 21 Gbps</button>
    <button class="chip" type="button" data-v="28" aria-pressed="false">GDDR7 · 28 Gbps</button>
  </div>
</div>
<div class="kpis">
  <div class="kpi"><span>Ancho de banda de esta VRAM</span><b id="vrBw"></b></div>
  <div class="kpi"><span>Leer 8 GB de texturas desde la VRAM</span><b id="vrT"></b></div>
</div>
<div class="vr" id="vrComp"></div>
<p class="msg" id="vrMsg" aria-live="polite"></p>
</template>
