<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="tr-mosfet">
<p class="hint">Sube el voltaje de la compuerta. El umbral de este transistor es de 2 V; el LED está en el circuito entre la fuente y el drenador.</p>
<div class="ctl" style="margin-top:0">
  <span class="lbl">Voltaje en la compuerta</span>
  <input class="slider" type="range" id="msV" min="0" max="5" step="0.1" value="0" aria-label="Voltaje en la compuerta">
  <b class="mono" id="msVv"></b>
</div>
<svg class="ms-svg" id="msSvg" viewBox="0 0 320 180" role="img" aria-label="Corte de un MOSFET con su canal"></svg>
<div class="kpis">
  <div class="kpi"><span>Estado</span><b id="msEst"></b></div>
  <div class="kpi"><span>Corriente por el LED</span><b id="msI"></b><div class="bar"><i id="msBar"></i></div></div>
</div>
<p class="msg" id="msMsg" aria-live="polite"></p>
</template>
<template data-lab="tr-compuertas">
<p class="hint">Elige una compuerta y cambia las entradas tocándolas.</p>
<div class="seg" id="cgTipo" role="group" aria-label="Compuerta">
  <button type="button" data-v="NOT" aria-pressed="false">NOT</button>
  <button type="button" data-v="AND" aria-pressed="true">AND</button>
  <button type="button" data-v="OR" aria-pressed="false">OR</button>
  <button type="button" data-v="NAND" aria-pressed="false">NAND</button>
  <button type="button" data-v="XOR" aria-pressed="false">XOR</button>
</div>
<div class="cg">
  <div class="cg-in">
    <button class="cg-b" type="button" id="cgA" aria-pressed="false">A = 0</button>
    <button class="cg-b" type="button" id="cgB" aria-pressed="false">B = 0</button>
  </div>
  <div class="cg-g" id="cgNom" aria-hidden="true"></div>
  <div class="cg-out" id="cgOut" aria-live="polite"></div>
</div>
<div class="tbl-wrap cg-tw"><table class="cg-t"><thead id="cgTh"></thead><tbody id="cgTb"></tbody></table></div>
<p class="msg" id="cgMsg"></p>
</template>
<template data-lab="tr-sumador">
<p class="hint">Toca los bits de A y de B para cambiarlos. Cada columna es un sumador completo: suma sus dos bits más el acarreo que llega de la derecha.</p>

  <div class="kpi"><span>Acarreos</span><b id="smCar"></b></div>
</div>
<p class="msg" id="smMsg" aria-live="polite"></p>
</template>
