<body data-leccion="almacenamiento">

<div class="app">

<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="alm-copiar">
<p class="hint">Elige qué copias. Cada barra es el tiempo que tarda en escribirse en cada tipo de almacenamiento: los datos en sí, más el trabajo de preparar cada archivo.</p>
<div class="chips" id="cpQue" role="group" aria-label="Qué copias">
  <button class="chip" type="button" data-v="0" aria-pressed="true">Una película (4 GB)</button>
  <button class="chip" type="button" data-v="1" aria-pressed="false">Fotos del celular (10 GB)</button>
  <button class="chip" type="button" data-v="2" aria-pressed="false">Un juego (60 GB)</button>
  <button class="chip" type="button" data-v="3" aria-pressed="false">Un proyecto de código (0.5 GB)</button>
</div>
<p class="lbl cp-n" id="cpN"></p>
<div class="cp" id="cpRows"></div>
<p class="msg" id="cpMsg" aria-live="polite"></p>
</template>
<template data-lab="alm-disco">
<p class="hint">El disco gira a 7,200 rpm (una vuelta cada 8.3 ms) y el cabezal está a la derecha. Elige qué leer y avanza: cada lectura suma el movimiento del brazo, la espera a que gire el plato y la lectura del sector. Los tiempos están simplificados.</p>
<div class="seg" id="dkPat" role="group" aria-label="Qué leer">
  <button type="button" data-v="0" aria-pressed="true">Un archivo en orden</button>
  <button type="button" data-v="1" aria-pressed="false">Archivos dispersos</button>
</div>
<div class="dk">
  <svg class="dk-svg" id="dkSvg" viewBox="-110 -110 250 220" role="img" aria-label="Plato del disco con sus pistas y sectores"></svg>
  <div class="dk-lado">
    <ol class="dk-lista" id="dkLista"></ol>
    <div class="leg"><span><i class="dk-l-on"></i>Siguiente lectura</span><span><i class="dk-l-ok"></i>Ya leído</span></div>
  </div>
</div>
<div class="status" id="dkStat" data-k="" aria-live="polite"><span class="dot"></span><span id="dkMsg"></span></div>
<div class="kpis">
  <div class="kpi"><span>Tiempo del disco duro</span><b id="dkT"></b></div>
  <div class="kpi"><span>Promedio por lectura</span><b id="dkProm"></b></div>
  <div class="kpi"><span>Un SSD tardaría unos</span><b id="dkSsd"></b></div>
</div>
<div class="ctl">
  <button class="btn pri" type="button" id="dkPaso">Siguiente lectura</button>
  <button class="btn" type="button" id="dkTodo">Leer todo</button>
  <button class="btn" type="button" id="dkReset">Reiniciar</button>
</div>
</template>
<template data-lab="alm-celdas">
<p class="hint">Elige cuántos bits guarda cada celda. La barra muestra los niveles de carga que el SSD tiene que distinguir; toca «Leer una celda» para ver cómo se traduce el nivel a bits.</p>
<div class="seg" id="ceTipo" role="group" aria-label="Bits por celda">
  <button type="button" data-v="1" aria-pressed="false">SLC · 1 bit</button>
  <button type="button" data-v="2" aria-pressed="false">MLC · 2</button>
  <button type="button" data-v="3" aria-pressed="true">TLC · 3</button>
  <button type="button" data-v="4" aria-pressed="false">QLC · 4</button>
</div>
<div class="ce">
  <div class="ce-col">
    <span class="ce-eje" aria-hidden="true">Más carga</span>
    <div class="ce-niv" id="ceNiv"></div>
    <span class="ce-eje" aria-hidden="true">Menos carga</span>
  </div>
  <div class="ce-info">
    <div class="kpis ce-kpis">
      <div class="kpi"><span>Niveles de carga</span><b id="ceN"></b></div>
      <div class="kpi"><span>Capacidad de un chip con 512 mil millones de celdas</span><b id="ceCap"></b></div>
      <div class="kpi"><span>Borrados que aguanta cada celda (aprox.)</span><b id="ceCic"></b></div>
      <div class="kpi"><span>Margen entre un nivel y otro</span><b id="ceMar"></b><div class="bar"><i id="ceMarBar"></i></div></div>
    </div>
    <p class="msg" id="ceMsg" aria-live="polite"></p>
    <div class="ctl"><button class="btn" type="button" id="ceLeer">Leer una celda</button></div>
  </div>
</div>
</template>
<template data-lab="alm-capacidad">
<p class="hint">Elige la capacidad que dice la caja.</p>
<div class="seg" id="caTam" role="group" aria-label="Capacidad en la caja">
  <button type="button" data-v="128e9" aria-pressed="false">128 GB</button>
  <button type="button" data-v="512e9" aria-pressed="false">512 GB</button>
  <button type="button" data-v="1e12" aria-pressed="true">1 TB</button>
  <button type="button" data-v="2e12" aria-pressed="false">2 TB</button>
  <button type="button" data-v="4e12" aria-pressed="false">4 TB</button>
</div>
<div class="kpis">
  <div class="kpi"><span>Bytes, según el fabricante</span><b id="caBytes"></b></div>
  <div class="kpi"><span>Lo que muestra Windows</span><b id="caWin"></b></div>
  <div class="kpi"><span>Lo que muestran macOS y Android</span><b id="caMac"></b></div>
</div>
<p class="lbl ca-t">Lo que cabe (sin contar el sistema operativo)</p>
<div class="tbl-wrap">
  <table class="ca-tab">
    <thead><tr><th>Archivo y tamaño típico</th><th>Cuántos caben</th></tr></thead>
    <tbody id="caCabe"></tbody>
  </table>
</div>
</template>

      "text": "Los datos están en círculos llamados "

     {
      "type": "text",
      "text": "pistas",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ", divididos en "
     },
     {
      "type": "text",
      "text": "sectores",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ". Para leer un sector, el disco hace dos esperas mecánicas:"
     }
    ],
    "attrs": {
     "id": "b-alm012"
    }
   },
   {
    "type": "orderedList",
    "attrs": {
     "id": "b-alm013"
    },
    "content": [
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Búsqueda:",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " el brazo mueve el cabezal hasta la pista correcta."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Latencia de rotación:",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " el cabezal espera a que el plato gire hasta que el sector pase por debajo. A 7,200 rpm, una vuelta dura 8.3 ms."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-alm014",
     "nombre": "alm-disco",
     "titulo": "Busca en el disco"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Estas esperas son milisegundos, una eternidad para un procesador que hace miles de millones de operaciones por segundo. Por eso los sistemas operativos tratan de leer y escribir en orden, y por eso desfragmentar (acomodar los pedazos de cada archivo uno junto a otro) ayudaba tanto a los discos duros."
     }
    ],
    "attrs": {
     "id": "b-alm015"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-ssd",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Cómo funciona un SSD"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Un SSD guarda cada bit en una "
     },
     {
      "type": "text",
      "text": "celda de memoria flash",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ": un transistor con una pequeña trampa que puede retener electrones durante años sin corriente. Para leer, el SSD mide cuánta carga hay atrapada. Para escribir, empuja electrones adentro o afuera con un voltaje alto."
     }
    ],
    "attrs": {
     "id": "b-alm016"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Para guardar más en el mismo espacio, cada celda puede distinguir varios niveles de carga en lugar de dos. Con 4 niveles guarda 2 bits; con 16 niveles, 4 bits. El costo es que los niveles quedan más juntos y son más difíciles de distinguir."
     }
    ],
    "attrs": {
     "id": "b-alm017"
    }
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-alm018",
     "nombre": "alm-celdas",
     "titulo": "Bits por celda"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "b-alm019",
     "level": 3
    },
    "content": [
     {
      "type": "text",
      "text": "Páginas, bloques y el controlador"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "La memoria flash tiene una regla incómoda: se "
     },
     {
      "type": "text",
      "text": "escribe por páginas",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " (unos 16 KB) pero solo se "
     },
     {
      "type": "text",
      "text": "borra por bloques",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " completos (cientos de páginas). Además, cada celda aguanta un número limitado de borrados. El "
     },
     {
      "type": "text",
      "text": "controlador",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ", un pequeño procesador dentro del SSD, se encarga de que no se note:"
     }
    ],
    "attrs": {
     "id": "b-alm020"
    }
   },
   {
    "type": "bulletList",
    "attrs": {
     "id": "b-alm021"
    },
    "content": [
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Nivelación de desgaste:",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " reparte las escrituras para que ninguna celda se gaste antes que las demás."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Recolección de basura:",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " junta las páginas que siguen en uso y borra bloques completos en los ratos libres."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "TRIM:",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " el sistema operativo le avisa qué datos ya borraste, para que no los copie de un lado a otro sin necesidad."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Espacio de reserva:",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " guarda celdas extra para reemplazar las que fallan."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-conexiones",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Conexiones: SATA, NVMe y USB"
     }
    ]

    "content": [
     {
      "type": "text",
      "text": "Un disco rápido no sirve de nada si el «cable» que lo une a la computadora es lento. La conexión pone un límite a la velocidad:"

   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "NVMe",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " es el idioma que usan los SSD para hablar directamente por PCIe, el mismo tipo de conexión que usa la tarjeta gráfica. SATA nació para discos duros y se quedó corto para la memoria flash."
     }
    ],
    "attrs": {
     "id": "b-alm024"
    }
   },
   {
    "type": "callout",
    "attrs": {
     "id": "b-alm025",
     "variante": "aviso"
    },
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "M.2 es una forma, no una velocidad.",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " Un SSD M.2 (una tarjetita del tamaño de un chicle) puede ser NVMe o SATA. Un M.2 SATA va igual de lento que un SSD SATA normal. Revisa que diga NVMe y que tu placa base lo acepte."
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-capacidad",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Capacidad: por qué tu disco «tiene menos»"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Compras un disco de 1 TB y Windows dice que tiene 931 GB. No falta nada: es un problema de unidades. Los fabricantes cuentan en potencias de 10 (1 TB = 1,000,000,000,000 bytes) y Windows cuenta en potencias de 2 (1 GiB = 1,073,741,824 bytes), aunque escriba «GB»."
     }
    ],
    "attrs": {
     "id": "b-alm026"
    }
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-alm027",
     "nombre": "alm-capacidad",
     "titulo": "De TB a lo que cabe"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "macOS, Android e iOS cuentan en potencias de 10, así que ahí el número coincide con la caja. Aparte, el sistema operativo y la partición de recuperación ocupan su parte."
     }
    ],
    "attrs": {
     "id": "b-alm028"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-cuidar",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Cuidar tus datos"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Todos los discos fallan tarde o temprano. Un disco duro suele avisar con ruidos o lentitud; un SSD puede dejar de funcionar de un día para otro. La única protección real es tener "
     },
     {
      "type": "text",
      "text": "copias",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ":"
     }
    ],
    "attrs": {
     "id": "b-alm029"
    }
   },
   {
    "type": "bulletList",
    "attrs": {
     "id": "b-alm030"
    },
    "content": [
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Regla 3-2-1:",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " 3 copias de lo importante, en 2 tipos de almacenamiento distintos, y 1 fuera de casa (por ejemplo, en la nube)."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "No llenes un SSD hasta el tope: con menos del 10 % libre, el controlador tiene menos espacio para trabajar y escribe más lento."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "No desfragmentes un SSD: no lo acelera y lo desgasta. Los sistemas actuales ya lo saben y solo le mandan TRIM."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Un disco duro externo no debe moverse ni golpearse mientras gira."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "callout",
    "attrs": {
     "id": "b-alm031",
     "variante": "idea"
    },
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "En OneBook, tus apuntes viven en el almacenamiento de tu dispositivo, dentro del navegador. Por eso «Tus datos» te deja descargar un respaldo: es la regla 3-2-1 aplicada a tus notas."
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-dudas",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Dudas comunes"
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-alm032"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Cuánto dura un SSD?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Los fabricantes lo indican en "
         },
         {
          "type": "text",
          "text": "TBW",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " (terabytes escritos): cuántos datos puedes escribir antes de que el desgaste sea un riesgo. Un SSD de 1 TB suele aguantar 600 TBW o más. Escribiendo 50 GB diarios, que ya es mucho, serían más de 30 años."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-alm033"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Por qué copiar muchas fotos tarda más que un video del mismo tamaño?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Por cada archivo, el sistema tiene que crearlo, buscar espacio y anotar dónde quedó. Con miles de archivos pequeños, ese trabajo extra pesa más que copiar los datos, sobre todo en un disco duro, que hace esperas mecánicas en cada uno. Juntarlos en un .zip antes de copiarlos ayuda."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-alm034"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "Si borro un archivo, ¿se puede recuperar?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "En un disco duro, casi siempre: borrar solo marca el espacio como libre, y los datos siguen ahí hasta que algo los sobrescriba. En un SSD con TRIM, el controlador suele borrar esas celdas pronto, así que recuperar es mucho más difícil. Para borrar de verdad un disco antes de venderlo, usa la opción de borrado seguro del sistema o del fabricante."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-alm035"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Qué es «la nube»?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
