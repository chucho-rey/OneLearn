<body data-leccion="cpu">

<div class="app">
  <aside class="side" id="side" aria-label="Lecciones"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="page">
      <noscript><p>Esta lección necesita JavaScript para mostrarse.</p></noscript>
      <div id="siguiente"></div>
    </main>
  </div>
</div>

<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="cpu-juguete">
<p class="hint">Esta CPU no sabe multiplicar, así que el programa calcula x × y sumando x una y otra vez. Avanza paso a paso y sigue al contador de programa (PC).</p>
<div class="ctl" style="margin-top:0">
  <span class="lbl">x</span>
  <div class="seg" id="cpuX" role="group" aria-label="Valor de x">
    <button type="button" data-v="2" aria-pressed="false">2</button>
    <button type="button" data-v="3" aria-pressed="true">3</button>
    <button type="button" data-v="4" aria-pressed="false">4</button>
    <button type="button" data-v="5" aria-pressed="false">5</button>
  </div>
  <span class="lbl">y</span>
  <div class="seg" id="cpuY" role="group" aria-label="Valor de y">
    <button type="button" data-v="2" aria-pressed="false">2</button>
    <button type="button" data-v="3" aria-pressed="false">3</button>
    <button type="button" data-v="4" aria-pressed="true">4</button>
    <button type="button" data-v="5" aria-pressed="false">5</button>
  </div>
</div>
<div class="cpu">
  <div>
    <div class="phases" id="cpuPh">
      <span class="phz" data-ph="buscar">1. Buscar</span>
      <span class="phz" data-ph="decod">2. Decodificar</span>
      <span class="phz" data-ph="ejec">3. Ejecutar</span>
    </div>
    <div class="regs">
      <div class="reg" data-r="PC"><span>PC</span><b id="rPC"></b></div>
      <div class="reg" data-r="A"><span>A</span><b id="rA"></b></div>
      <div class="reg" data-r="B"><span>B</span><b id="rB"></b></div>
      <div class="reg" data-r="Z"><span>Z (cero)</span><b id="rZ"></b></div>
      <div class="reg wide" data-r="IR"><span>IR (instrucción actual)</span><b id="rIR"></b></div>
      <div class="reg wide" data-r="ALU"><span>ALU</span><b id="rALU"></b></div>
    </div>
    <div class="callout cpu-msg"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-info"></use></svg><div id="cpuMsg" aria-live="polite"></div></div>
  </div>
  <div>
    <div class="tbl-wrap mem-wrap">
      <table class="memt">
        <thead><tr><th>Dir.</th><th>Contenido</th><th>Qué es</th><th><span class="vh">Contador de programa</span></th></tr></thead>
        <tbody id="cpuMem"></tbody>
      </table>
    </div>
  </div>
</div>
<div class="ctl">
  <button class="btn pri" type="button" id="cpuStep">Siguiente paso</button>
  <button class="btn" type="button" id="cpuInst">Instrucción completa</button>
  <button class="btn" type="button" id="cpuRun">Correr</button>
  <button class="btn" type="button" id="cpuReset">Reiniciar</button>
  <span class="lbl" id="cpuCnt"></span>
</div>
</template>
<template data-lab="cpu-reloj">
<p class="hint">Mueve la frecuencia y elige cuántas instrucciones completa el núcleo en cada ciclo.</p>
<div class="ctl" style="margin-top:0">
  <span class="lbl">Frecuencia</span>
  <input class="slider" type="range" id="fq" min="10" max="60" value="40" aria-label="Frecuencia">
  <b class="mono" id="fqVal"></b>
</div>
<div class="ctl">
  <span class="lbl">Instrucciones por ciclo</span>
  <div class="seg" id="ipcSeg" role="group" aria-label="Instrucciones por ciclo">
    <button type="button" data-v="1" aria-pressed="false">1</button>
    <button type="button" data-v="2" aria-pressed="true">2</button>
    <button type="button" data-v="4" aria-pressed="false">4</button>
  </div>
</div>
<div class="tk-h"><span>10 nanosegundos</span><span id="tkN"></span></div>
<div class="ticks" id="ticks" aria-hidden="true"></div>
<div class="kpis">
  <div class="kpi"><span>Duración de un ciclo</span><b id="kCyc"></b></div>
  <div class="kpi"><span>Lo que avanza la luz en un ciclo</span><b id="kLuz"></b></div>
  <div class="kpi"><span>Ciclos esperando un dato de la RAM (80 ns)</span><b id="kRam"></b></div>
  <div class="kpi"><span>Instrucciones por segundo</span><b id="kIps"></b></div>
</div>
</template>
<template data-lab="cpu-segmentacion">
<p class="hint">Cada fila es una instrucción y cada columna, un ciclo. I3 es un salto: hasta ejecutarlo, el procesador no sabe con certeza qué instrucción sigue.</p>
<div class="ctl" style="margin-top:0">
  <div class="seg" id="pipeSeg" role="group" aria-label="Modo">
    <button type="button" data-v="0" aria-pressed="false">Sin segmentación</button>
    <button type="button" data-v="1" aria-pressed="true">Con segmentación</button>
  </div>
  <label class="chk"><input type="checkbox" id="pipeMiss"> Predicción de salto equivocada</label>
</div>
<div class="pp-wrap"><div id="pipe" role="img"></div></div>
<div class="leg">
  <span><i class="s-B"></i>B: buscar</span><span><i class="s-D"></i>D: decodificar</span><span><i class="s-E"></i>E: ejecutar</span><span><i class="s-G"></i>G: guardar el resultado</span><span><i class="s-X"></i>Descartada</span>
</div>
<p class="out" id="pipeOut" aria-live="polite"></p>
<p class="hint" id="pipeNote" style="margin:4px 0 0"></p>
<div class="ctl">
  <button class="btn" type="button" id="pipePlay">Reproducir</button>
</div>
</template>
<template data-lab="cpu-cache">
<p class="hint">Elige un patrón de acceso y avanza. En esta caché caben 4 bloques de 4 direcciones, y cada bloque solo puede ir en una línea: el residuo de dividir su número entre 4. Un acierto tarda 1 ns y un fallo, 80 ns.</p>
<div class="chips" id="cPat" role="group" aria-label="Patrón de acceso"></div>
<div class="strip" id="cStrip" aria-hidden="true"></div>
<div class="tbl-wrap">
  <table class="ctab">
    <thead><tr><th>Línea</th><th>Bloque guardado</th><th>Direcciones</th></tr></thead>
    <tbody id="cTab"></tbody>
  </table>
</div>
<div class="status" id="cStat" data-k="" aria-live="polite"><span class="dot"></span><span id="cMsg"></span></div>
<div class="kpis">
  <div class="kpi"><span>Aciertos</span><b id="cHits"></b></div>
  <div class="kpi"><span>Tiempo promedio por acceso</span><b id="cAvg"></b><div class="bar"><i id="cAvgBar"></i></div></div>
</div>
<div class="ctl">
  <button class="btn pri" type="button" id="cStep">Paso</button>
  <button class="btn" type="button" id="cRun">Correr todo</button>
  <button class="btn" type="button" id="cReset">Reiniciar</button>
</div>
</template>
<template data-lab="cpu-nucleos">
<p class="hint">Elige cuántos núcleos hay y qué parte del programa se puede repartir entre ellos.</p>
<div class="ctl" style="margin-top:0">
  <span class="lbl">Núcleos</span>
  <div class="seg" id="amN" role="group" aria-label="Núcleos">
    <button type="button" data-v="1" aria-pressed="false">1</button>
    <button type="button" data-v="2" aria-pressed="false">2</button>
    <button type="button" data-v="4" aria-pressed="true">4</button>
    <button type="button" data-v="8" aria-pressed="false">8</button>
    <button type="button" data-v="16" aria-pressed="false">16</button>
  </div>
</div>
<div class="ctl">
  <span class="lbl">Parte que se puede repartir</span>
  <input class="slider" type="range" id="amP" min="0" max="100" step="5" value="90" aria-label="Parte que se puede repartir">
  <b class="mono" id="amPVal"></b>
</div>
<div class="am">
  <div class="am-h"><span>Con 1 núcleo</span><span class="mono">100%</span></div>
  <div class="abar" aria-hidden="true"><i class="s" id="am1s"></i><i class="p" id="am1p"></i></div>
  <div class="am-h"><span id="amNl"></span><span class="mono" id="amT"></span></div>
  <div class="abar" aria-hidden="true"><i class="s" id="amNs"></i><i class="p" id="amNp"></i></div>
</div>
<div class="leg"><span><i style="background:var(--c1)"></i>Parte que no se reparte</span><span><i style="background:var(--accent)"></i>Parte repartida entre los núcleos</span></div>
<div class="kpis">
  <div class="kpi"><span>Aceleración</span><b id="amS"></b></div>
  <div class="kpi"><span>Límite con núcleos infinitos</span><b id="amL"></b></div>
</div>
<p class="msg" id="amMsg" aria-live="polite"></p>
</template>

       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " (IPC). Un núcleo actual completa varias instrucciones en cada ciclo."
     }
    ],
    "attrs": {
     "id": "b-cpu011"
    }
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-cpu012",
     "nombre": "cpu-reloj",
     "titulo": "Cuánto dura un ciclo"
    }
   },
   {
    "type": "callout",
    "attrs": {
     "id": "b-cpu013",
     "variante": "info"
    },
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Un procesador de 3.5 GHz que completa 4 instrucciones por ciclo hace más trabajo que uno de 5 GHz que completa 2. Por eso los GHz solo sirven para comparar procesadores de la misma familia."
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-tuberia",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Segmentación: varias instrucciones a la vez"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "En la CPU de juguete, cada instrucción espera a que termine la anterior. Los procesadores reales trabajan como una línea de montaje: mientras una instrucción se ejecuta, la siguiente se decodifica y otra más se busca. A esto se le llama "
     },
     {
      "type": "text",
      "text": "segmentación",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " o "
     },
     {
      "type": "text",
      "text": "pipeline",
      "marks": [
       {
        "type": "italic"
       }
      ]
     },
     {
      "type": "text",
      "text": "."
     }
    ],
    "attrs": {
     "id": "b-cpu014"
    }
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-cpu015",
     "nombre": "cpu-segmentacion",
     "titulo": "La línea de montaje"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Para no detenerse en cada salto, el procesador "
     },
     {
      "type": "text",
      "text": "predice",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " hacia dónde irá y sigue trabajando. Los predictores actuales aciertan más del 95% de las veces. Cuando fallan, hay que tirar el trabajo adelantado. En un procesador real la línea tiene más de diez etapas, así que cada error cuesta de 10 a 20 ciclos."
     }
    ],
    "attrs": {
     "id": "b-cpu016"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-cache",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "La caché: los datos a la mano"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "En la lección de "
     },
     {
      "type": "text",
      "text": "memoria RAM",
      "marks": [
       {
        "type": "link",
        "attrs": {
         "href": "ram.html"
        }
       }
      ]
     },
     {
      "type": "text",
      "text": " viste que la RAM tarda unos 80 ns en responder: más de 300 ciclos en los que el procesador no avanza. La "
     },
     {
      "type": "text",
      "text": "caché",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " evita casi todas esas esperas. Es una memoria pequeña y muy rápida, dentro del procesador, que guarda copias de los datos usados hace poco."
     }
    ],
    "attrs": {
     "id": "b-cpu017"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Si la caché tiene el dato, es un "
     },
     {
      "type": "text",
      "text": "acierto",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ". Si no, es un "
     },
     {
      "type": "text",
      "text": "fallo",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " y hay que traerlo de la RAM. En cada fallo no se trae un solo byte, sino un bloque completo (64 bytes en los procesadores reales), porque lo más probable es que pronto se necesiten los datos vecinos."
     }
    ],
    "attrs": {
     "id": "b-cpu018"
    }
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-cpu019",
     "nombre": "cpu-cache",
     "titulo": "Aciertos y fallos"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Los programas tienen dos costumbres que la caché aprovecha: vuelven a usar lo que acaban de usar ("
     },
     {
      "type": "text",
      "text": "localidad temporal",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ") y usan los datos vecinos de lo que acaban de usar ("
     },
     {
      "type": "text",
      "text": "localidad espacial",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": "). Las cachés reales tienen tres niveles (L1, L2 y L3) y permiten que cada bloque vaya en varias líneas posibles, lo que reduce los choques."
     }
    ],
    "attrs": {
     "id": "b-cpu020"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-nucleos",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Núcleos e hilos"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Un "
     },
     {
      "type": "text",
      "text": "núcleo",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " es un procesador completo, con su unidad de control, sus ALU, sus registros y su caché L1. Los chips actuales traen varios núcleos (en una computadora personal, de 4 a más de 16) para ejecutar varias tareas al mismo tiempo."
     }
    ],
    "attrs": {
     "id": "b-cpu021"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Pero más núcleos no siempre se notan. Solo aceleran la parte de un programa que se puede dividir en trozos independientes; el resto sigue avanzando en un solo núcleo. Esta idea se conoce como "
     },
     {
      "type": "text",
      "text": "ley de Amdahl",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": "."
     }
    ],
    "attrs": {
     "id": "b-cpu022"
    }
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-cpu023",
     "nombre": "cpu-nucleos",
     "titulo": "Reparte el trabajo"
    }
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-cpu024"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Qué son los hilos?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Muchos núcleos pueden atender dos tareas a la vez (dos hilos) compartiendo sus piezas: cuando una tarea espera un dato, la otra aprovecha la ALU libre. Intel lo llama Hyper-Threading y AMD, SMT. Da algo de rendimiento extra, pero no el doble: los dos hilos comparten el mismo núcleo."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-cpu025"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "Núcleos de rendimiento y de eficiencia"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Muchos procesadores combinan núcleos grandes y rápidos con núcleos pequeños que consumen poco. El sistema manda las tareas pesadas a los grandes y las de fondo a los pequeños. Así funcionan casi todos los teléfonos y muchas laptops recientes."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-arq",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Arquitecturas: x86 y ARM"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "La "
     },
     {
      "type": "text",
      "text": "arquitectura",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " es el idioma del procesador: el conjunto de instrucciones que entiende. Un programa compilado para una arquitectura no corre directamente en otra; hay que volver a compilarlo o traducirlo."
     }
    ],
    "attrs": {
     "id": "b-cpu026"
    }
   },
   {
    "type": "table",
    "content": [
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableHeader",
        "content": [
         {
          "type": "paragraph"
         }
        ]
       },
       {
        "type": "tableHeader",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "x86"
           }
          ]
         }
        ]
       },
       {
        "type": "tableHeader",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "ARM"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Quién la diseña"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Intel y AMD"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Arm, que la licencia a Apple, Qualcomm, MediaTek y otros"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Instrucciones"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Muchas y de largo variable"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Más simples y de largo fijo"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Dónde se usa"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "La mayoría de las PC y servidores"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Casi todos los teléfonos, las Mac recientes y cada vez más laptops y servidores"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Su fuerte"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Compatibilidad con décadas de programas"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Bajo consumo de energía"
           }
          ]
         }
        ]
       }
      ]
     }
    ],
    "attrs": {
     "id": "b-cpu027"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "También existe "
     },
     {
      "type": "text",
      "text": "RISC-V",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ", una arquitectura abierta que cualquiera puede usar sin pagar licencia. Hoy aparece sobre todo en microcontroladores y en chips especializados."
     }
    ],
    "attrs": {
     "id": "b-cpu028"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-calor",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Calor y consumo"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Cada vez que un transistor cambia de estado gasta un poco de energía, que termina convertida en calor. El consumo crece con la frecuencia y con el cuadrado del voltaje, y para subir la frecuencia casi siempre hay que subir el voltaje. Por eso duplicar los GHz costaría mucho más que el doble de energía."
     }
    ],
    "attrs": {
     "id": "b-cpu029"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Hasta mediados de los años 2000, cada generación subía la frecuencia. Desde entonces se estancó entre 3 y 6 GHz, y los fabricantes usan los transistores nuevos para poner más núcleos, más caché y núcleos que completan más instrucciones por ciclo."
     }
    ],
    "attrs": {
     "id": "b-cpu030"
    }
   },
   {
    "type": "callout",
    "attrs": {
     "id": "b-cpu031",
     "variante": "info"
    },
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "El "
       },
       {
        "type": "text",
        "text": "turbo",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " sube la frecuencia por encima de la base mientras la temperatura y el consumo lo permitan. Si el procesador se calienta demasiado, baja la frecuencia para protegerse ("
       },
       {
        "type": "text",
        "text": "thermal throttling",
        "marks": [
         {
          "type": "italic"
         }
        ]
       },
       {
        "type": "text",
        "text": "). Por eso una buena refrigeración también es rendimiento."
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-dudas",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Dudas comunes"
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-cpu032"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Más GHz siempre significa más rápido?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Solo entre procesadores de la misma familia y generación. Entre arquitecturas distintas cambian las instrucciones por ciclo, la caché y el número de núcleos, y eso pesa tanto como la frecuencia."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-cpu033"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Para qué tantos núcleos si mi programa usa uno?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Aunque un programa use un solo núcleo, el sistema reparte las demás tareas en los otros: el navegador, la música, las descargas y los procesos del propio sistema. Para editar video, compilar código o renderizar, los programas sí usan todos."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-cpu034"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Qué es un SoC?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Un sistema en un chip ("
         },
         {
          "type": "text",
          "text": "System on a Chip",
          "marks": [
           {
            "type": "italic"
           }
          ]
         },
         {
          "type": "text",
          "text": "): el procesador, la tarjeta gráfica, el controlador de memoria y otras piezas en un mismo chip. Es lo normal en teléfonos y en muchas laptops."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-cpu035"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Qué significa que un procesador sea de 64 bits?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Que sus registros guardan números de 64 bits y que usa direcciones de 64 bits. Uno de 32 bits solo puede usar direcciones para 4 GB de memoria (2"
         },
         {
          "type": "text",
          "text": "32",
          "marks": [
           {
            "type": "superscript"
           }
          ]
         },
         {
          "type": "text",
          "text": " bytes); uno de 64 bits no tiene ese límite en la práctica."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-cpu036"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Qué quieren decir los «3 nm» o «5 nm»?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Es el nombre del proceso de fabricación. Un número menor indica una generación más nueva, con transistores más pequeños y eficientes, pero ya no mide ninguna pieza concreta del chip."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-repaso",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Repasa lo aprendido"
     }
    ]
   },
   {
    "type": "repaso",
    "attrs": {
     "id": "b-cpu037",
     "preguntas": [
      {
       "q": "¿En qué orden trabaja el procesador con cada instrucción?",
       "o": [
        "Ejecutar, buscar y guardar",
        "Buscar, decodificar y ejecutar",
        "Decodificar, compilar y ejecutar"
       ],
       "a": 1,
       "e": "Primero busca la instrucción en la dirección que indica el PC, luego decodifica qué pide y al final la ejecuta."
      },
      {
       "q": "El procesador A va a 5 GHz y completa 2 instrucciones por ciclo. El B va a 3.5 GHz y completa 4. ¿Cuál hace más trabajo por segundo?",
       "o": [
        "A, porque tiene más GHz",
        "B",
        "Los dos hacen lo mismo"
