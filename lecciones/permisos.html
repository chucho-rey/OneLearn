      "text": "a",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": " todos; "
     },
     {
      "type": "text",
      "text": "+",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": " agrega, "
     },
     {
      "type": "text",
      "text": "-",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": " quita y "
     },
     {
      "type": "text",
      "text": "=",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": " fija."
     }
    ],
    "attrs": {
     "id": "b-pm020"
    }
   },
   {
    "type": "codeBlock",
    "attrs": {
     "id": "b-pm021",
     "language": "bash"
    },
    "content": [
     {
      "type": "text",
      "text": "chmod +x respaldo.sh      # hazlo ejecutable\nchmod 600 claves.txt      # solo tú puedes leerlo y cambiarlo\nchmod g+w informe.txt     # el grupo también puede editarlo\nchmod o-r informe.txt     # los demás ya no pueden leerlo\nchmod u=rwx,g=rx,o= app   # igual que chmod 750 app\nchmod -R 750 proyecto/    # la carpeta y todo lo que tiene adentro"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Solo el dueño de un archivo (o root) puede cambiar sus permisos. Y para correr un script que está en la carpeta actual se escribe "
     },
     {
      "type": "text",
      "text": "./respaldo.sh",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": ": el "
     },
     {
      "type": "text",
      "text": "./",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": " le dice al shell «el de aquí», porque por seguridad no busca programas en la carpeta donde estás."
     }
    ],
    "attrs": {
     "id": "b-pm022"
    }
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-pm023",
     "nombre": "pm-practica",
     "titulo": "Permisos en la práctica"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-sudo",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "sudo y el usuario root"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Como root puede hacerlo todo, en Ubuntu nadie inicia sesión como root. Trabajas con tu usuario y, solo en el comando que lo necesita, escribes "
     },
     {
      "type": "text",
      "text": "`sudo`",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " antes: «hazlo como administrador»."
     }
    ],
    "attrs": {
     "id": "b-pm024"
    }
   },
   {
    "type": "bulletList",
    "attrs": {
     "id": "b-pm025"
    },
    "content": [
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "sudo",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " pide "
         },
         {
          "type": "text",
          "text": "tu",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " contraseña, no la de root, y la recuerda unos 15 minutos."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Al escribir la contraseña "
         },
         {
          "type": "text",
          "text": "no se ve nada",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": ", ni asteriscos. No está trabado: escríbela y pulsa Enter."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Solo pueden usarlo los usuarios del grupo "
         },
         {
          "type": "text",
          "text": "sudo",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": ". Si no estás, verás «no está en el archivo sudoers»."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Todo lo que haces con sudo queda registrado en "
         },
         {
          "type": "text",
          "text": "/var/log/auth.log",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": "."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "codeBlock",
    "attrs": {
     "id": "b-pm026",
     "language": "bash"
    },
    "content": [
     {
      "type": "text",
      "text": "sudo apt update        # un comando como administrador\nsudo !!                # repite el último comando, ahora con sudo\nsudo -u luis ls        # como otro usuario (útil para probar permisos)\nsudo -i                # una terminal de root; sal con exit"
     }
    ]
   },
   {
    "type": "callout",
    "attrs": {
     "id": "b-pm027",
     "variante": "aviso"
    },
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Usa "
       },
       {
        "type": "text",
        "text": "sudo",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": " solo cuando haga falta y entiende el comando antes de correrlo. Pegar con sudo algo que encontraste en internet es darle tu computadora a un desconocido."
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-pm028"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Por qué "
       },
       {
        "type": "text",
        "text": "sudo echo hola > /etc/archivo",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": " dice «Permiso denegado»?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Porque la redirección "
         },
         {
          "type": "text",
          "text": ">",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " la hace tu shell, con tu usuario, "
         },
         {
          "type": "text",
          "text": "antes",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " de que sudo corra: sudo solo eleva a "
         },
         {
          "type": "text",
          "text": "echo",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": ". La solución es que un programa con sudo escriba el archivo: "
         },
         {
          "type": "text",
          "text": "echo hola | sudo tee /etc/archivo",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": ". "
         },
         {
          "type": "text",
          "text": "tee",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " copia lo que recibe a la pantalla y al archivo (con "
         },
         {
          "type": "text",
          "text": "-a",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " lo agrega al final)."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-duenos",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Dueños: chown y chgrp"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "chown",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": " cambia el dueño (y, si quieres, el grupo) de archivos y carpetas. Solo root puede regalar un archivo a otro usuario, así que casi siempre va con sudo:"
     }
    ],
    "attrs": {
     "id": "b-pm029"
    }
   },
   {
    "type": "codeBlock",
    "attrs": {
     "id": "b-pm030",
     "language": "bash"
    },
    "content": [
     {
      "type": "text",
      "text": "sudo chown luis informe.txt                  # ahora es de luis\nsudo chown luis:contabilidad informe.txt     # de luis y del grupo contabilidad\nsudo chown -R www-data:www-data /var/www/tienda   # toda una carpeta, para el servidor web\nsudo chgrp contabilidad facturas/            # solo cambia el grupo"
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-cuentas",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Crear y administrar usuarios"
     }
    ]
   },
   {
    "type": "table",
    "attrs": {
     "id": "b-pm031"
    },
    "content": [
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableHeader",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Comando"
           }
          ]
         }
        ]
       },
       {
        "type": "tableHeader",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Qué hace"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "sudo adduser luis",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Crea el usuario con su carpeta y te pregunta la contraseña y su nombre (lo más cómodo en Ubuntu)"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "sudo useradd -m -s /bin/bash luis",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Lo mismo sin preguntar nada (ideal en scripts). Sin "
           },
           {
            "type": "text",
            "text": "-m",
            "marks": [
             {
              "type": "code"
             }
            ]
           },
           {
            "type": "text",
            "text": " no crea su carpeta"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "sudo passwd luis",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Le pone o cambia la contraseña. "
           },
           {
            "type": "text",
            "text": "passwd",
            "marks": [
             {
              "type": "code"
             }
            ]
           },
           {
            "type": "text",
            "text": " solo, cambia la tuya"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "sudo groupadd contabilidad",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Crea un grupo"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "sudo usermod -aG contabilidad luis",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Agrega a luis al grupo. ¡No olvides la "
           },
           {
            "type": "text",
            "text": "a",
            "marks": [
             {
              "type": "code"
             }
            ]
           },
           {
            "type": "text",
            "text": "!"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "id luis",
            "marks": [
             {
              "type": "code"
             }
            ]
           },
           {
            "type": "text",
            "text": " o "
           },
           {
            "type": "text",
            "text": "groups luis",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Muestra sus grupos"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "sudo deluser luis",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Borra el usuario ("
           },
           {
            "type": "text",
            "text": "userdel -r",
            "marks": [
             {
              "type": "code"
             }
            ]
           },
           {
            "type": "text",
            "text": " también borra su carpeta)"
           }
          ]
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "callout",
    "attrs": {
     "id": "b-pm032",
     "variante": "aviso"
    },
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "usermod -G",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": " "
       },
       {
        "type": "text",
        "text": "sin",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " la "
       },
       {
        "type": "text",
        "text": "-a",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": " reemplaza todos los grupos del usuario por los que escribas: puedes sacarlo de "
       },
       {
        "type": "text",
        "text": "sudo",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": " sin querer. Para agregar, siempre "
       },
       {
        "type": "text",
        "text": "-aG",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": ". Y los grupos nuevos se aplican la siguiente vez que esa persona inicia sesión."
       }
      ]
     }
    ]
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-pm033",
     "nombre": "pm-equipo",
     "titulo": "Una carpeta para el equipo de contabilidad"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-dudas",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Dudas comunes"
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-pm034"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Por qué mis archivos nuevos salen como "
       },
       {
        "type": "text",
        "text": "rw-rw-r--",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": "?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Por la "
         },
         {
          "type": "text",
          "text": "umask",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": ", los permisos que se quitan a todo lo que creas. En Ubuntu es "
         },
         {
          "type": "text",
          "text": "0002",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " para las personas: los archivos nacen con 664 y las carpetas con 775. Para root es "
         },
         {
          "type": "text",
          "text": "0022",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " (644 y 755). Puedes verla con "
         },
         {
          "type": "text",
          "text": "umask",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": "."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-pm035"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "Olvidé la contraseña de mi usuario. ¿Qué hago?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Otro usuario con sudo puede cambiártela con "
         },
         {
          "type": "text",
          "text": "sudo passwd ana",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": ". Si eres la única cuenta administradora de tu computadora, Ubuntu tiene un modo de recuperación en el menú de arranque que abre una terminal de root para cambiarla."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-pm036"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Y en Windows cómo funcionan los permisos?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
