<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="pq-dividir">
<p class="hint">Elige qué mandas. Cada paquete lleva hasta 1,460 bytes de datos y 40 bytes de encabezados (IP y TCP).</p>
<div class="chips" id="dvQue" role="group" aria-label="Qué mandas">
  <button class="chip" type="button" data-v="200" aria-pressed="true">Un mensaje de chat (200 bytes)</button>
  <button class="chip" type="button" data-v="2000000" aria-pressed="false">Una página web (2 MB)</button>
  <button class="chip" type="button" data-v="3000000" aria-pressed="false">Una foto (3 MB)</button>
  <button class="chip" type="button" data-v="8000000" aria-pressed="false">Una canción (8 MB)</button>
</div>
<div class="dv" id="dvPaq" aria-hidden="true"></div>
<p class="lbl dv-n" id="dvMas"></p>
<div class="kpis">
  <div class="kpi"><span>Paquetes</span><b id="dvN"></b></div>
  <div class="kpi"><span>Bytes de encabezados</span><b id="dvEnc"></b></div>
  <div class="kpi"><span>Datos extra por los encabezados</span><b id="dvPct"></b></div>
</div>
<p class="msg" id="dvMsg" aria-live="polite"></p>
</template>
<template data-lab="pq-ruta">
<p class="hint">El paquete va de tu casa al servidor. Cada router elige el siguiente salto por el camino más rápido; el número en cada enlace es su latencia en milisegundos.</p>
<label class="chk"><input type="checkbox" id="ruCorte"> Cortar el enlace entre B y D (por ejemplo, un cable dañado)</label>
<svg class="ru-svg" id="ruSvg" viewBox="0 0 360 200" role="img" aria-label="Mapa de routers entre tu casa y el servidor"></svg>
<div class="kpis">
  <div class="kpi"><span>Saltos</span><b id="ruSal"></b></div>
  <div class="kpi"><span>Tiempo acumulado</span><b id="ruMs"></b></div>
  <div class="kpi"><span>TTL del paquete</span><b id="ruTtl"></b></div>
</div>
<div class="status" id="ruStat" data-k="" aria-live="polite"><span class="dot"></span><span id="ruMsg"></span></div>
<div class="ctl">
  <button class="btn pri" type="button" id="ruSig">Siguiente salto</button>
  <button class="btn" type="button" id="ruReset">Reiniciar</button>
</div>
</template>
<template data-lab="pq-tcp">
<p class="hint">Se envían 10 paquetes por una red que pierde algunos. Elige cuántos se pierden y con qué protocolo se envían.</p>
<div class="ctl" style="margin-top:0">
  <span class="lbl">Pérdida</span>
  <input class="slider" type="range" id="tcPer" min="0" max="40" step="10" value="20" aria-label="Porcentaje de paquetes perdidos">
  <b class="mono" id="tcPerV"></b>
</div>
<div class="ctl">
  <button class="btn pri" type="button" id="tcTcp">Enviar con TCP</button>
  <button class="btn" type="button" id="tcUdp">Enviar con UDP</button>
</div>
<ol class="tc" id="tcRes" aria-label="Paquetes enviados"></ol>
<div class="leg"><span><i class="tc-l-ok"></i>Llegó</span><span><i class="tc-l-re"></i>Llegó al reenviarse</span><span><i class="tc-l-no"></i>Se perdió</span></div>
<div class="kpis">
  <div class="kpi"><span>Paquetes que llegaron</span><b id="tcOk"></b></div>
  <div class="kpi"><span>Envíos en total</span><b id="tcEnv"></b></div>
</div>
<p class="msg" id="tcMsg" aria-live="polite"></p>
</template>

   {
    "type": "laboratorio",

   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "En una videollamada no sirve de nada recibir tarde un pedazo de audio que ya pasó: es mejor seguir. En una descarga, en cambio, un solo byte faltante echa a perder el archivo."
     }
    ],
    "attrs": {
     "id": "b-pq018"

   {
    "type": "heading",
    "attrs": {
     "id": "s-latencia",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "¿Qué tan rápido viaja?"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "En la fibra óptica, la luz viaja a unos 200,000 km por segundo. De la Ciudad de México a Madrid hay unos 9,000 km: un paquete tarda al menos 45 ms en llegar, y 90 ms en ir y volver, sin contar el tiempo en cada router. Ese tiempo de ida y vuelta es la "
     },
     {
      "type": "text",
      "text": "latencia",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ", y ningún plan de internet la puede bajar del límite de la luz."
     }
    ],
    "attrs": {
     "id": "b-pq019"
    }
   },
   {
    "type": "callout",
    "attrs": {
     "id": "b-pq020",
     "variante": "info"
    },
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Ancho de banda",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " y "
       },
       {
        "type": "text",
        "text": "latencia",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " son cosas distintas. El ancho de banda es cuántos datos caben por segundo (como el ancho de una carretera); la latencia, cuánto tarda cada uno en llegar (como la distancia). Para descargar archivos importa el primero; para jugar en línea o videollamadas, la segunda."
       }
      ]
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "La mayor parte del tráfico entre continentes viaja por "
     },
     {
      "type": "text",
      "text": "cables submarinos",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " de fibra óptica, no por satélites. Hay cientos de ellos en el fondo del mar."
     }
    ],
    "attrs": {
     "id": "b-pq021"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-dudas",

     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-pq022"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Qué es el ping?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Un programa que manda un paquete pequeño a otro equipo y mide cuánto tarda la respuesta: la latencia. En los juegos, el «ping» es justo eso, en milisegundos."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-pq023"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Qué es un puerto?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Un número que indica a qué programa de un equipo va un paquete. La dirección IP lleva el paquete a la computadora y el puerto, al programa: 443 para HTTPS, 53 para DNS, y así."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-pq024"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "Contraté 100 megas, ¿por qué descargo a 12 MB/s?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Los planes se miden en megabits por segundo (Mb/s) y los programas de descarga muestran megabytes por segundo (MB/s). Un byte son 8 bits: 100 ÷ 8 = 12.5 MB/s, y algo se va en encabezados."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-pq025"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Wi-Fi o cable?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "El cable suele dar menos latencia y más estabilidad, porque no comparte el aire ni sufre interferencias. El Wi-Fi moderno es muy rápido, pero las paredes y los vecinos le afectan."
         }
        ]
       }
      ]
     }
    ]
   },

       "q": "¿Por qué los datos viajan en paquetes?",

   {

          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Internet es una red de redes que se entienden por protocolos comunes."

          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
