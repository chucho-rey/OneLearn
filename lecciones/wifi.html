<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="wf-canal">
<p class="hint">Tus vecinos ya tienen sus redes en 2.4 GHz. Elige el canal para tu red y mira cuánta interferencia recibe.</p>
<div class="wc-g" id="wcGraf" aria-hidden="true"></div>
<div class="ctl"><label class="lbl" for="wcCan">Tu canal</label><input class="slider" id="wcCan" type="range" min="1" max="13" step="1" value="3"><b class="mono" id="wcCanV"></b></div>
<div class="kpis">
  <div class="kpi"><span>Redes en tu mismo canal</span><b id="wcMismo"></b></div>
  <div class="kpi"><span>Redes encimadas</span><b id="wcEnc"></b></div>
  <div class="kpi"><span>Interferencia</span><b id="wcInt"></b><div class="bar"><i id="wcBar"></i></div></div>
</div>
<div class="status" id="wcStat" data-k="" aria-live="polite"><span class="dot"></span><span id="wcMsg"></span></div>
</template>
<template data-lab="wf-senal">
<p class="hint">Mueve la laptop y agrega paredes. Mira cómo cambian la señal y la velocidad en cada banda.</p>
<div class="ctl" style="margin-top:0"><label class="lbl" for="wsDist">Distancia</label><input class="slider" id="wsDist" type="range" min="1" max="40" step="1" value="5"><b class="mono" id="wsDistV"></b></div>
<div class="ctl"><label class="lbl" for="wsMuros">Muros de concreto</label><input class="slider" id="wsMuros" type="range" min="0" max="4" step="1" value="0"><b class="mono" id="wsMurosV"></b></div>
<div class="barras" id="wsBarras"></div>
<div class="status" id="wsStat" data-k="" aria-live="polite"><span class="dot"></span><span id="wsMsg"></span></div>
</template>
<template data-lab="wf-seguro">
<p class="hint">Así llegó configurado el router de una pequeña oficina. Cambia lo que haga falta hasta que quede seguro.</p>
<div class="ws-op">
  <div class="ctl"><span class="lbl">Cifrado</span><div class="seg" id="wqCif" role="group" aria-label="Cifrado"><button type="button" data-v="wep" aria-pressed="true">WEP</button><button type="button" data-v="wpa2" aria-pressed="false">WPA2-AES</button><button type="button" data-v="wpa3" aria-pressed="false">WPA3</button></div></div>
  <div class="ctl"><span class="lbl">Contraseña del Wi-Fi</span><div class="seg" id="wqClave" role="group" aria-label="Contraseña del Wi-Fi"><button type="button" data-v="corta" aria-pressed="true">oficina1</button><button type="button" data-v="larga" aria-pressed="false">cafe-azul-trompo-lunes</button></div></div>
  <label class="chk"><input type="checkbox" id="wqWps" checked> WPS encendido</label>
  <label class="chk"><input type="checkbox" id="wqAdmin" checked> Contraseña del router: la de fábrica (admin)</label>
  <label class="chk"><input type="checkbox" id="wqInv"> Red de invitados para visitas y cámaras</label>
  <label class="chk"><input type="checkbox" id="wqFw"> Firmware actualizado</label>
  <label class="chk"><input type="checkbox" id="wqOculto"> Ocultar el nombre de la red (SSID)</label>
</div>
<div class="kpis"><div class="kpi"><span>Puntuación de seguridad</span><b id="wqPunt"></b><div class="bar"><i id="wqBar"></i></div></div></div>
<ul class="wq-l" id="wqLista"></ul>
<div class="status" id="wqStat" data-k="" aria-live="polite"><span class="dot"></span><span id="wqMsg"></span></div>
</template>
