<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="ml-siguiente">
<p class="hint">El modelo leyó unas 30 frases sencillas. Elige una palabra para empezar y mira qué cree que sigue. Las probabilidades salen de contar.</p>
<div class="chips" id="sgIni" role="group" aria-label="Palabra inicial">
  <button class="chip" type="button" data-v="el" aria-pressed="true">el</button>
  <button class="chip" type="button" data-v="la" aria-pressed="false">la</button>
  <button class="chip" type="button" data-v="mi" aria-pressed="false">mi</button>

<p class="sg-frase" id="sgFrase" aria-live="polite"></p>
<p class="lbl sg-l">Qué podría seguir después de «<span id="sgUlt"></span>»</p>
<div class="barras" id="sgProb"></div>
<div class="ctl">
  <span class="lbl">Temperatura</span>
  <input class="slider" type="range" id="sgT" min="0.1" max="2" step="0.1" value="1" aria-label="Temperatura">
  <b class="mono" id="sgTv"></b>
</div>
<div class="ctl">

  <button class="btn" type="button" id="sgFin">Terminar la frase</button>
  <button class="btn" type="button" id="sgGreedy">Siempre la más probable</button>

</div>
<p class="msg" id="sgMsg"></p>
</template>
<template data-lab="ml-vectores">

<div class="ctl"><button class="btn" type="button" id="veAnalogia">Mostrar: rey − hombre + mujer</button></div>
