<template data-lab="so-llamadas">
<p class="hint">Elige qué quiere hacer el programa y avanza paso a paso. Fíjate en qué modo está el procesador en cada momento.</p>
<div class="chips" id="llAcc" role="group" aria-label="Qué quiere hacer el programa">

  <button class="chip" type="button" data-v="2" aria-pressed="false">Escribir en la pantalla</button>
  <button class="chip" type="button" data-v="3" aria-pressed="false">Abrir otro programa</button>
</div>
<div class="ll">

</div>

</div>
</template>
<template data-lab="so-planificador">
<p class="hint">Cuatro procesos llegan casi juntos. Cada cuadro es 1 ms de procesador. Elige cómo los reparte el planificador.</p>

  <button class="chip" type="button" data-v="rr" aria-pressed="false">Por turnos de 2 ms</button>
</div>
<div class="tbl-wrap pl-w"><table class="pl" id="plTab"></table></div>
<div class="kpis">

  <div class="kpi"><span>Tiempo promedio hasta su primer turno</span><b id="plRes"></b></div>

</div>
<p class="msg" id="plMsg" aria-live="polite"></p>
