     {

   {

     {

      "text": "Del hub al switch"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Un "
     },
     {
      "type": "text",
      "text": "hub",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " repetía todo lo que recibía por todos sus puertos: todos veían todo y los paquetes chocaban. Un "
     },
     {
      "type": "text",
      "text": "switch",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " es más listo: aprende qué MAC está conectada en cada puerto y entrega cada trama solo por el puerto correcto."
     }
    ],
    "attrs": {
     "id": "b-et013"
    }
   },
   {
    "type": "orderedList",
    "attrs": {
     "id": "b-et014"
    },
    "content": [
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Llega una trama por el puerto 1 con MAC de origen A: el switch anota «A está en el puerto 1» en su "
         },
         {
          "type": "text",
          "text": "tabla MAC",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": "."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Mira la MAC de destino. Si ya sabe en qué puerto está, la manda "
         },
         {
          "type": "text",
          "text": "solo",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " por ese puerto."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Si no la conoce, o si es de difusión, la manda por "
         },
         {
          "type": "text",
          "text": "todos",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " los puertos menos por donde llegó ("
         },
         {
          "type": "text",
          "text": "inundación",
          "marks": [
           {
            "type": "italic"
           }
          ]
         },
         {
          "type": "text",
          "text": ")."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Las entradas que no se usan se borran después de unos minutos, por si un equipo se cambió de lugar."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-et015",
     "nombre": "et-switch",
     "titulo": "La tabla del switch"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-arp",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "ARP: de IP a MAC"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Tu computadora sabe la IP del router (por ejemplo 192.168.1.1), pero para mandarle una trama necesita su MAC. Para averiguarla usa "
     },
     {
      "type": "text",
      "text": "ARP",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " ("
     },
     {
      "type": "text",
      "text": "Address Resolution Protocol",
      "marks": [
       {
        "type": "italic"
       }
      ]
     },
     {
      "type": "text",
      "text": "):"
     }
    ],
    "attrs": {
     "id": "b-et016"
    }
   },
   {
    "type": "orderedList",
    "attrs": {
     "id": "b-et017"
    },
    "content": [
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Manda a toda la red (difusión): «¿Quién tiene la IP 192.168.1.1? Díganle a 192.168.1.50»."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Solo el router contesta, directo a ti: «192.168.1.1 está en "
         },
         {
          "type": "text",
          "text": "c8:3a:35:1b:92:e0",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": "»."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Tu computadora lo guarda un rato en su "
         },
         {
          "type": "text",
          "text": "tabla ARP",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": ", para no preguntar en cada paquete."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "codeBlock",
    "attrs": {
     "id": "b-et018",
     "language": "bash"
    },
    "content": [
     {
      "type": "text",
      "text": "ip neigh          # la tabla ARP: IP, MAC y estado de cada vecino\nip link          # tus tarjetas de red y su MAC\nethtool enp0s3   # velocidad y dúplex del cable conectado"
     }
    ]
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-et019",
     "nombre": "et-arp",
     "titulo": "La MAC de tus vecinos"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-dudas",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Dudas comunes"
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-et020"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Se puede cambiar la MAC?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Sí, por software, y es lo que hacen los celulares con la MAC aleatoria. Por eso la MAC no es una forma segura de identificar a un equipo: filtrar el Wi-Fi por MAC no detiene a nadie que sepa lo que hace."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-et021"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Cable o Wi-Fi para trabajar?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "El cable es más estable, más rápido y con menos latencia. Para una computadora de escritorio, un servidor o una consola de videojuegos, siempre que se pueda, cable. El Wi-Fi es para lo que se mueve."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-et022"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Por qué mi cable solo da 100 Mbps si es «gigabit»?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Casi siempre es el cable: los de categoría 5 (sin la e) o con un hilo dañado se quedan en 100 Mbps. También puede ser un puerto viejo del switch o del router. "
         },
         {
          "type": "text",
          "text": "ethtool",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " te dice a qué velocidad negoció la tarjeta."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-repaso",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Repasa lo aprendido"
     }
    ]
   },
   {
    "type": "repaso",
    "attrs": {
     "id": "b-et023",
     "preguntas": [
      {
       "q": "¿Para qué sirve la dirección MAC?",
       "o": [
        "Para llegar a un servidor en otro país",
        "Para entregar datos dentro de la misma red local",
        "Para elegir el puerto del programa"
       ],
       "a": 1,
       "e": "La MAC se usa en la capa 2, dentro de la red local. Para cruzar redes se usa la IP."
      },
      {
       "q": "Llega a un switch una trama para una MAC que no está en su tabla. ¿Qué hace?",
       "o": [
        "La descarta",
        "La manda por todos los puertos menos por donde llegó",
        "La regresa"
       ],
       "a": 1,
       "e": "La inunda: así llega al destino, que al contestar le enseña al switch dónde está."
      },
      {
       "q": "¿Qué indican los primeros 3 bytes de una MAC?",
       "o": [
        "La red",
        "El fabricante (OUI)",
        "La velocidad"
       ],
       "a": 1,
       "e": "El OUI identifica al fabricante de la tarjeta."
      },
      {
       "q": "Tu PC quiere hablar con 192.168.1.1, pero no conoce su MAC. ¿Qué usa?",
       "o": [
        "DNS",
        "ARP",
        "DHCP"
       ],
       "a": 1,
       "e": "ARP pregunta a toda la red quién tiene esa IP y guarda la respuesta en la tabla ARP."
      },
      {
       "q": "¿Cuál es la distancia máxima de un cable de cobre Cat 6 a 1 Gbps?",
       "o": [
        "10 m",
        "100 m",
        "1 km"
       ],
       "a": 1,
       "e": "Los cables de cobre Ethernet llegan hasta 100 m. Para más, fibra óptica."
      }
     ]
    }
   },
   {
    "type": "resumen",
    "attrs": {
     "id": "b-et024"
    },
    "content": [
     {
      "type": "bulletList",
      "content": [
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Ethernet es la red local por cable: cobre hasta 100 m (Cat 5e, 6, 6a) y fibra para distancias largas."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "La MAC tiene 48 bits: los primeros 3 bytes son del fabricante. "
           },
           {
            "type": "text",
            "text": "ff:ff:ff:ff:ff:ff",
            "marks": [
             {
              "type": "code"
             }
            ]
           },
           {
            "type": "text",
            "text": " es la difusión."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "La trama lleva MAC de destino y origen, el tipo, hasta 1500 bytes de datos (MTU) y un código de errores."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "El switch aprende qué MAC hay en cada puerto y entrega solo por ese; si no la conoce, inunda."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "ARP traduce IP a MAC dentro de la red local; "
           },
           {
            "type": "text",
            "text": "ip neigh",
            "marks": [
             {
              "type": "code"
             }
            ]
           },
           {
            "type": "text",
            "text": " muestra su tabla."
           }
          ]
         }
        ]
       }
      ]
     }
    ]
   }
  ]
 }
