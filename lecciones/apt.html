           {

             {

         {

   {

    },
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Primero `update`, después `upgrade` o `install`.",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " "
       },
       {
        "type": "text",
        "text": "update",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": " no actualiza programas: solo baja el catálogo. Sin él, apt no sabe que existen versiones nuevas, y en un servidor recién creado ni siquiera conoce los paquetes. Por eso verás tanto "
       },
       {
        "type": "text",
        "text": "sudo apt update && sudo apt upgrade",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": "."
       }
      ]
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Instalar, quitar y actualizar llevan "
     },
     {
      "type": "text",
      "text": "sudo",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": " porque cambian el sistema para todos los usuarios. Buscar y ver detalles ("
     },
     {
      "type": "text",
      "text": "search",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": ", "
     },
     {
      "type": "text",
      "text": "show",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": ", "
     },
     {
      "type": "text",
      "text": "list",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": ") no lo necesitan."

    }

   {

   {

    },
    "content": [
     {

      "text": "Tu primer servidor web"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Instalar un servicio funciona igual que cualquier programa, con un extra: en Ubuntu, apt lo deja "
     },
     {
      "type": "text",
      "text": "habilitado y encendido",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " en cuanto termina. Basta un comando para tener un servidor web respondiendo en el puerto 80."

    "attrs": {
     "id": "b-ap014"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Para probarlo desde el mismo servidor se usa "
     },
     {
      "type": "text",
      "text": "curl",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": ", que pide una página web y muestra lo que llega, sin navegador. "
     },
     {
      "type": "text",
      "text": "localhost",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {

      "text": " es el nombre que cada computadora se da a sí misma."

    }

   {
    "type": "laboratorio",
    "attrs": {

   },
   {

    "content": [
     {

   {

    ]
   },
   {
    "type": "table",
    "attrs": {
     "id": "b-ap018"
    },
    "content": [
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableHeader",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Forma"

          ]
         }
        ]
       },
       {
        "type": "tableHeader",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Cómo"
           }
          ]
         }
        ]
       },
       {
        "type": "tableHeader",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Cuándo"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "snap",
            "marks": [
             {
              "type": "bold"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "sudo snap install code --classic",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Paquetes de Canonical que traen todo incluido y se actualizan solos. Ubuntu los usa para Firefox y otras apps de escritorio"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Flatpak",

             {
              "type": "bold"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "flatpak install flathub org.gimp.GIMP",

             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Parecido a snap, muy usado en escritorio con la tienda Flathub"

          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Un .deb descargado",
            "marks": [
             {
              "type": "bold"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "sudo apt install ./programa.deb",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Cuando el fabricante solo ofrece su propio .deb (Chrome, Zoom). apt resuelve las dependencias"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "AppImage",
            "marks": [
             {
              "type": "bold"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "chmod +x app.AppImage",
            "marks": [
             {
              "type": "code"
             }
            ]
           },
           {
            "type": "text",
            "text": " y ejecutarlo"
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Un solo archivo que funciona sin instalar"
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Desde el código",
            "marks": [
             {
              "type": "bold"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "./configure && make && sudo make install",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Último recurso, cuando no hay paquete: no se actualiza solo"

          ]
         }
        ]
       }
      ]
     },
     {
      "type": "tableRow",
      "content": [
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "pip, npm, cargo",
            "marks": [
             {
              "type": "bold"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "pip install requests",
            "marks": [
             {
              "type": "code"
             }
            ]
           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Paquetes de un lenguaje de programación, no del sistema"
           }
          ]
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "callout",
    "attrs": {
     "id": "b-ap019",
     "variante": "aviso"
    },
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Instala solo de fuentes confiables:",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " los repositorios oficiales o la página oficial del proyecto. Desconfía de las guías que piden "
       },
       {
        "type": "text",
        "text": "curl https://… | sudo bash",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": ": eso descarga un script y lo ejecuta como root sin que lo leas. Si de verdad lo necesitas, descárgalo primero, léelo y después decide."
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "b-ap020",
     "level": 3
    },
    "content": [
     {
      "type": "text",
      "text": "Mantener el sistema al día"
     }
    ]
   },
   {
    "type": "bulletList",
    "attrs": {
     "id": "b-ap021"
    },
    "content": [
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Corre "
         },
         {
          "type": "text",
          "text": "sudo apt update && sudo apt upgrade",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " con regularidad. La mayoría de los ataques aprovechan fallas que ya tenían parche."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Ubuntu instala solo las actualizaciones de seguridad con el servicio "
         },
         {
          "type": "text",
          "text": "unattended-upgrades",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": "."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Las versiones "
         },
         {
          "type": "text",
          "text": "LTS",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " (como la 24.04) reciben actualizaciones por 5 años: son las que se usan en servidores. Para saber cuál tienes: "
         },
         {
          "type": "text",
          "text": "cat /etc/os-release",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " o "
         },
         {
          "type": "text",
          "text": "lsb_release -a",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": "."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Después de actualizar el kernel hay que reiniciar. Si existe el archivo "
         },
         {
          "type": "text",
          "text": "/var/run/reboot-required",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": ", el sistema te lo está pidiendo."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-dudas",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Dudas comunes"
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-ap022"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Qué diferencia hay entre apt y apt-get?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Hacen lo mismo. "
         },
         {
          "type": "text",
          "text": "apt",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " es la versión cómoda para personas, con barra de progreso y colores; "
         },
         {
          "type": "text",
          "text": "apt-get",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " es la versión de siempre, con una salida que no cambia entre versiones, por eso se prefiere en scripts."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-ap023"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Dónde quedan los archivos de un programa instalado?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "El programa en "
         },
         {
          "type": "text",
          "text": "/usr/bin",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " o "
         },
         {
          "type": "text",
          "text": "/usr/sbin",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": ", su configuración en "
         },
         {
          "type": "text",
          "text": "/etc",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": ", su documentación en "
         },
         {
          "type": "text",
          "text": "/usr/share/doc",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " y sus datos en "
         },
         {
          "type": "text",
          "text": "/var/lib",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": ". "
         },
         {
          "type": "text",
          "text": "dpkg -L nginx",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " lista todos los archivos de un paquete y "
         },
         {
          "type": "text",
          "text": "which tree",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " dice dónde quedó un comando."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-ap024"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "Me sale «No se pudo obtener el bloqueo /var/lib/dpkg/lock»."
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Hay otro apt trabajando, casi siempre la actualización automática. Espera unos minutos y vuelve a intentarlo. No borres el archivo de bloqueo: podrías dañar la base de datos de paquetes."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-ap025"
    },
    "content": [
     {
      "type": "desplegableTitulo",
