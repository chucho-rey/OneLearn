<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="rn-neurona">
<p class="hint">Ajusta los pesos y el sesgo. La tabla muestra qué responde la neurona con cada combinación de entradas (1 si la salida pasa de 0.5).</p>
<div class="chips" id="nnPre" role="group" aria-label="Ejemplos de pesos">
  <button class="chip" type="button" data-v="AND" aria-pressed="false">Hacer AND</button>
  <button class="chip" type="button" data-v="OR" aria-pressed="false">Hacer OR</button>
  <button class="chip" type="button" data-v="NAND" aria-pressed="false">Hacer NAND</button>
</div>
<div class="ctl"><span class="lbl">Peso 1</span><input class="slider" type="range" id="nnW1" min="-6" max="6" step="0.5" value="1" aria-label="Peso de la entrada 1"><b class="mono" id="nnW1v"></b></div>
<div class="ctl"><span class="lbl">Peso 2</span><input class="slider" type="range" id="nnW2" min="-6" max="6" step="0.5" value="1" aria-label="Peso de la entrada 2"><b class="mono" id="nnW2v"></b></div>
<div class="ctl"><span class="lbl">Sesgo</span><input class="slider" type="range" id="nnB" min="-10" max="10" step="0.5" value="0" aria-label="Sesgo"><b class="mono" id="nnBv"></b></div>
<div class="nn">
  <svg class="nn-svg" id="nnSvg" viewBox="0 0 220 130" role="img" aria-label="Neurona con dos entradas y una salida"></svg>
  <div class="tbl-wrap nn-tw"><table class="nn-t"><thead><tr><th>Entrada 1</th><th>Entrada 2</th><th>Salida</th><th>0 o 1</th></tr></thead><tbody id="nnTab"></tbody></table></div>
</div>
<p class="msg" id="nnMsg" aria-live="polite"></p>
</template>
<template data-lab="rn-xor">
<p class="hint">Esta red tiene 2 neuronas ocultas y 1 de salida, con pesos ya entrenados. Cambia las entradas tocándolas.</p>
<div class="ctl" style="margin-top:0">
  <button class="cg-b xr-b" type="button" id="xrA" aria-pressed="false">A = 0</button>
  <button class="cg-b xr-b" type="button" id="xrB" aria-pressed="false">B = 0</button>
</div>
<svg class="xr-svg" id="xrSvg" viewBox="0 0 320 170" role="img" aria-label="Red con dos entradas, dos neuronas ocultas y una salida"></svg>
<div class="kpis">
  <div class="kpi"><span>Oculta 1 (detecta «al menos una»)</span><b id="xrH1"></b></div>
  <div class="kpi"><span>Oculta 2 (detecta «no las dos»)</span><b id="xrH2"></b></div>
  <div class="kpi"><span>Salida (las dos ocultas encendidas)</span><b id="xrO"></b></div>
</div>
<p class="msg" id="xrMsg" aria-live="polite"></p>
</template>
<template data-lab="rn-gradiente">
<p class="hint">La curva es el error según el valor de un peso. La pelota empieza en un mal valor; cada paso la mueve en contra de la pendiente. Elige la tasa de aprendizaje.</p>
<div class="seg" id="gdLr" role="group" aria-label="Tasa de aprendizaje">
  <button type="button" data-v="0.1" aria-pressed="false">Muy pequeña (0.1)</button>
  <button type="button" data-v="0.6" aria-pressed="true">Adecuada (0.6)</button>
  <button type="button" data-v="1.9" aria-pressed="false">Grande (1.9)</button>
  <button type="button" data-v="2.2" aria-pressed="false">Demasiado (2.2)</button>
</div>
<svg class="gd-svg" id="gdSvg" viewBox="0 0 340 190" role="img" aria-label="Curva del error y la posición del peso"></svg>
<div class="kpis">
  <div class="kpi"><span>Peso</span><b id="gdW"></b></div>
  <div class="kpi"><span>Error</span><b id="gdE"></b><div class="bar"><i id="gdBar"></i></div></div>
  <div class="kpi"><span>Pasos</span><b id="gdN"></b></div>
</div>
<div class="ctl">
  <button class="btn pri" type="button" id="gdUno">Un paso</button>
  <button class="btn" type="button" id="gdDiez">10 pasos</button>
  <button class="btn" type="button" id="gdReset">Reiniciar</button>
</div>
<p class="msg" id="gdMsg" aria-live="polite"></p>
</template>
