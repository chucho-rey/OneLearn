<template data-lab="pw-fuerza">

<template data-lab="pw-frase">

  <div class="kpi"><span>Fuera de línea (10 mil millones por segundo)</span><b id="frT"></b></div>
</div>
<div class="ctl"><button class="btn pri" type="button" id="frGen">Generar</button></div>
<p class="msg" id="frMsg"></p>
