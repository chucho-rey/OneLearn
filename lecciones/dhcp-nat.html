    "type": "heading",
    "attrs": {
     "id": "s-fija",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Una IP fija para un servidor"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "En Ubuntu Server la red se configura con "
     },
     {
      "type": "text",
      "text": "netplan",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ", en archivos YAML dentro de "
     },
     {
      "type": "text",
      "text": "/etc/netplan/",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": ". Por defecto usa DHCP. Para darle una IP fija a un servidor:"
     }
    ],
    "attrs": {
     "id": "b-dn020"
    }
   },
   {
    "type": "codeBlock",
    "attrs": {
     "id": "b-dn021",
     "language": "yaml"
    },
    "content": [
     {
      "type": "text",
      "text": "network:\n  version: 2\n  ethernets:\n    enp0s3:\n      dhcp4: false\n      addresses: [192.168.1.60/24]\n      routes:\n        - to: default\n          via: 192.168.1.1\n      nameservers:\n        addresses: [192.168.1.1]"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Se aplica con "
     },
     {
      "type": "text",
      "text": "sudo netplan apply",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": ". Cuidado con YAML: la "
     },
     {
      "type": "text",
      "text": "sangría",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " importa (se usan espacios, nunca tabuladores) y un error deja al servidor sin red. Si estás conectado a distancia, "
     },
     {
      "type": "text",
      "text": "sudo netplan try",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": " aplica el cambio y lo revierte solo si no confirmas en 2 minutos."
     }
    ],
    "attrs": {
     "id": "b-dn022"
    }
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-dn023",
     "nombre": "dn-fija",
     "titulo": "IP fija para el servidor"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-dudas",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Dudas comunes"
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-dn024"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Qué pasa si dos equipos tienen la misma IP?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Un "
         },
         {
          "type": "text",
          "text": "conflicto de IP",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": ": los dos dejan de funcionar bien, porque los paquetes llegan a veces a uno y a veces al otro. Pasa cuando alguien pone una IP fija dentro del rango del DHCP. Por eso las fijas se ponen fuera de ese rango."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-dn025"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Mi IP pública cambia?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "En casi todos los planes de casa sí: el proveedor también te la presta por DHCP y puede cambiarla al reiniciar el módem. Para un servidor en casa se usa un servicio de DNS dinámico, que actualiza tu nombre cada vez que cambia la IP."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-dn026"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Qué es un servidor DHCP «pirata»?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Un segundo servidor DHCP en la red, puesto por error (alguien conectó un router de casa) o a propósito. Los equipos aceptan la primera oferta que llega y pueden quedar con una puerta de enlace o un DNS falsos. Los switches administrables tienen una función, "
         },
         {
          "type": "text",
          "text": "DHCP snooping",
          "marks": [
           {
            "type": "italic"
           }
          ]
         },
         {
          "type": "text",
          "text": ", para bloquearlos."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-repaso",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Repasa lo aprendido"
     }
    ]
   },
   {
    "type": "repaso",
    "attrs": {
     "id": "b-dn027",
     "preguntas": [
      {
       "q": "¿En qué orden van los mensajes de DHCP?",
       "o": [
        "Request, Offer, Discover, Ack",
        "Discover, Offer, Request, Ack",
        "Offer, Discover, Ack, Request"
       ],
       "a": 1,
       "e": "DORA: Discover, Offer, Request y Ack."
      },
      {
       "q": "¿Por qué el Discover se manda a toda la red?",
       "o": [
        "Para ir más rápido",
        "Porque el equipo todavía no tiene IP ni sabe dónde está el servidor",
        "Por seguridad"
       ],
       "a": 1,
       "e": "Sin IP ni servidor conocido, la única opción es una difusión."
      },
      {
       "q": "Una laptop tiene la IP 169.254.10.3. ¿Qué pasó?",
       "o": [
        "Tiene una IP pública",
        "No recibió respuesta de ningún servidor DHCP",
        "Usa IPv6"
       ],
       "a": 1,
       "e": "169.254 es la dirección provisional que se pone sola cuando DHCP no contesta."
      },
      {
       "q": "¿Qué hace el router con NAT al mandar un paquete a internet?",
       "o": [
        "Cifra el paquete",
        "Cambia la IP y el puerto de origen por los suyos y anota la traducción",
        "Borra la IP de destino"
       ],
       "a": 1,
       "e": "Así el servidor responde a la IP pública y el router sabe a quién entregar la respuesta."
      },
      {
       "q": "¿Cómo se le da una IP fija a un servidor Ubuntu?",
       "o": [
        "Con netplan, en /etc/netplan, y sudo netplan apply",
        "Con ping",
        "Reiniciando el router"
       ],
       "a": 0,
       "e": "netplan lee los archivos YAML de /etc/netplan; netplan apply los aplica."
      }
     ]
    }
   },
   {
    "type": "resumen",
    "attrs": {
     "id": "b-dn028"
    },
    "content": [
     {
      "type": "bulletList",
      "content": [
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "DHCP reparte IP, máscara, puerta de enlace y DNS con cuatro mensajes: Discover, Offer, Request y Ack."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "La dirección se presta por un tiempo y se renueva. Una IP 169.254 indica que DHCP no respondió."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Servidores e impresoras usan reserva DHCP o IP fija, fuera del rango del DHCP."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "NAT traduce las IP privadas a la pública del router y lleva una tabla de conexiones; por eso desde internet no se entra sin reenvío de puertos."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "En Ubuntu la IP fija se configura con netplan (YAML con espacios) y se aplica con sudo netplan apply."
           }
          ]
         }
        ]
       }
      ]
     }
    ]
   }
  ]
 }
