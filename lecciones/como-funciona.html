<body data-leccion="como-funciona">

<div class="app">
  <aside class="side" id="side" aria-label="Lecciones"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="page">
      <noscript><p>Esta lección necesita JavaScript para mostrarse.</p></noscript>
      <div id="siguiente"></div>
    </main>
  </div>
</div>

<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="cf-lectura">
<p class="hint">Son los mismos ajustes del panel Lectura (Aa): cambia uno y mira cómo cambia toda la página.</p>
<div class="ctl" style="margin-top:0">
  <span class="lbl">Tamaño de letra</span>
  <div class="seg" id="clTam" role="group" aria-label="Tamaño de letra">
    <button type="button" data-v="-1" aria-label="Letra más pequeña">A−</button>
    <button type="button" data-v="1" aria-label="Letra más grande">A+</button>
  </div>
  <b class="mono" id="clTamV"></b>
</div>
<div class="ctl">
  <span class="lbl">Tema</span>
  <div class="seg" id="clTema" role="group" aria-label="Tema">
    <button type="button" data-v="auto" aria-pressed="false">Como mi dispositivo</button>
    <button type="button" data-v="light" aria-pressed="false">Claro</button>
    <button type="button" data-v="dark" aria-pressed="false">Oscuro</button>
  </div>
</div>
<div class="ctl">
  <span class="lbl">Contraste</span>
  <div class="seg" id="clCon" role="group" aria-label="Contraste">
    <button type="button" data-v="auto" aria-pressed="false">Como mi dispositivo</button>
    <button type="button" data-v="normal" aria-pressed="false">Normal</button>
    <button type="button" data-v="high" aria-pressed="false">Alto</button>
  </div>
</div>
<div class="ctl">
  <span class="lbl">Fuente</span>
  <div class="seg" id="clFue" role="group" aria-label="Fuente">
    <button type="button" data-v="normal" aria-pressed="false">Normal</button>
    <button type="button" data-v="atkinson" aria-pressed="false">Atkinson</button>
    <button type="button" data-v="opendyslexic" aria-pressed="false">OpenDyslexic</button>
  </div>
</div>
<div class="ctl"><button class="btn" type="button" id="clReset">Volver a como estaba al principio</button></div>
<p class="msg" id="clMsg" aria-live="polite"></p>
</template>
<template data-lab="cf-atajos">
<p class="hint">Presiona cada tecla (fuera de cualquier campo de texto) y se marcará como probada. Esc cierra lo que se abra.</p>
<ul class="ca-l" id="caLista"></ul>
<p class="msg" id="caMsg" aria-live="polite"></p>
</template>
<template data-lab="cf-datos">
<p class="hint">Esto es lo que OneLearn tiene guardado ahora mismo en este navegador.</p>
<div class="kpis" id="cdKpis"></div>
<div class="status" id="cdStat" data-k="" aria-live="polite"><span class="dot"></span><span id="cdMsg"></span></div>
<div class="ctl">
  <button class="btn" type="button" id="cdPedir">Pedir que los conserve</button>
  <button class="btn pri" type="button" id="cdAbrir">Abrir «Tus datos»</button>
</div>
</template>
<template data-lab="cf-instalar">
<p class="hint">Elige tu dispositivo para ver cómo instalarlo.</p>
<div class="status" id="ciEstado" data-k="" aria-live="polite"><span class="dot"></span><span id="ciEstadoTxt"></span></div>
<div class="chips" id="ciDisp" role="group" aria-label="Tu dispositivo">
  <button class="chip" type="button" data-v="android" aria-pressed="false">Android</button>
  <button class="chip" type="button" data-v="ios" aria-pressed="false">iPhone o iPad</button>
  <button class="chip" type="button" data-v="pc" aria-pressed="false">Computadora</button>
</div>
<ol class="ci-pasos" id="ciPasos"></ol>
<div class="ctl"><button class="btn pri" type="button" id="ciInstalar" hidden>Instalar ahora</button></div>
</template>
