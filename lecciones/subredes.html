<template data-lab="sb-calc">

<template data-lab="sb-vlsm">
<p class="hint">Una oficina tiene la red 192.168.10.0/24. Ajusta cuántos equipos necesita cada área y mira cómo se reparte la red, de la más grande a la más chica.</p>

   {
    "type": "callout",
    "attrs": {
     "id": "b-sb009",

    },
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "La fórmula: una red /n tiene 2"
       },
       {
        "type": "text",
        "text": "(32 − n)",
        "marks": [
         {
          "type": "superscript"
         }
        ]
       },
       {
        "type": "text",
        "text": " direcciones. Se restan 2 porque la primera es la "
       },
       {
        "type": "text",
        "text": "dirección de red",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " (el nombre de la red) y la última es la de "
       },
       {
        "type": "text",
        "text": "difusión",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " (para hablarle a todos): no se le pueden dar a ningún equipo."
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-calcular",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Calcular una subred"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Ejemplo: ¿a qué red pertenece "
     },
     {
      "type": "text",
      "text": "192.168.10.77/26",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": "?"
     }
    ],
    "attrs": {
     "id": "b-sb010"
    }
   },
   {
    "type": "orderedList",
    "attrs": {
     "id": "b-sb011"
    },
    "content": [
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "/26 deja 32 − 26 = "
         },
         {
          "type": "text",
          "text": "6 bits",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " para los equipos: cada red tiene 2"
         },
         {
          "type": "text",
          "text": "6",
          "marks": [
           {
            "type": "superscript"
           }
          ]
         },
         {
          "type": "text",
          "text": " = "
         },
         {
          "type": "text",
          "text": "64 direcciones",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": "."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Las redes /26 empiezan en múltiplos de 64 en el último octeto: 0, 64, 128 y 192. El 77 cae en la que empieza en "
         },
         {
          "type": "text",
          "text": "64",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": "."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Dirección de red: "
         },
         {
          "type": "text",
          "text": "192.168.10.64",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": ". Difusión: la última de esa red, 64 + 63 = "
         },
         {
          "type": "text",
          "text": "192.168.10.127",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": "."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Equipos utilizables: del "
         },
         {
          "type": "text",
          "text": ".65",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": " al "
         },
         {
          "type": "text",
          "text": ".126",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": ", es decir, "
         },
         {
          "type": "text",
          "text": "62",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": "."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Lo que hace la computadora es un "
     },
     {
      "type": "text",
      "text": "Y lógico",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " (AND) bit por bit entre la IP y la máscara: donde la máscara tiene 1, el bit de la IP se queda; donde tiene 0, se vuelve 0. Lo que queda es la dirección de red. Así sabe si otro equipo está en su misma red (le habla directo) o en otra (se lo manda al router)."
     }
    ],
    "attrs": {
     "id": "b-sb012"
    }
   },

    "type": "laboratorio",
    "attrs": {

     "titulo": "Calculadora de subredes"

   {
    "type": "heading",
    "attrs": {
     "id": "s-dividir",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Dividir una red"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Una oficina con ventas, administración y servidores podría usar una sola red /24, pero separarlos tiene ventajas: menos tráfico de difusión, y reglas distintas para cada área (que las visitas no lleguen a los servidores, por ejemplo). Dividir una red es tomar bits de la parte de equipo y usarlos como parte de red: cada bit que tomas "
     },
     {
      "type": "text",
      "text": "duplica",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " las subredes y "
     },
     {
      "type": "text",
      "text": "parte a la mitad",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " su tamaño."
     }
    ],
    "attrs": {
     "id": "b-sb014"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Cuando cada área necesita un tamaño distinto se usa "
     },
     {
      "type": "text",
      "text": "VLSM",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " (máscaras de longitud variable): se acomodan primero las redes más grandes y después las más chicas en el espacio que sobra, para no desperdiciar direcciones."
     }
    ],
    "attrs": {
     "id": "b-sb015"
    }
   },

    "attrs": {

   {
    "type": "heading",
    "attrs": {
     "id": "s-practica",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Practica"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Calcular subredes de cabeza es una habilidad que se pide en entrevistas y certificaciones, y que ahorra tiempo al revisar una red. Practica hasta que te salga sin la calculadora."
     }
    ],
    "attrs": {
     "id": "b-sb018"
    }
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-sb019",
     "nombre": "sb-practica",
     "titulo": "Ejercicios de subredes"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-dudas",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Dudas comunes"
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-sb020"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Por qué todos usan 192.168.1.0/24 en su casa?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Porque es lo que configuran casi todos los routers de fábrica. Como es una red privada, no importa que millones de casas usen la misma: cada una sale a internet con su propia IP pública gracias a NAT."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-sb021"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Qué pasa si dos equipos tienen máscaras distintas en la misma red?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Cada uno decide quién es «vecino» con su propia máscara, así que pueden no ponerse de acuerdo: uno intenta hablar directo y el otro manda sus respuestas al router. Los síntomas son raros e intermitentes. Por eso la máscara debe ser la misma en toda la red, y por eso conviene que la reparta DHCP."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-sb022"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Hay subredes en IPv6?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Sí, y es más sencillo: casi siempre cada red es un /64, y a una casa u oficina le dan un /48 o un /56, de donde salen miles de redes /64. Lo ves en la lección "
         },
         {
          "type": "text",
          "text": "IPv6 en la práctica",
          "marks": [
           {
            "type": "link",
            "attrs": {
             "href": "ipv6.html"
            }
           }
          ]
         },
         {
          "type": "text",
          "text": "."
         }
        ]
       }
      ]
     }
    ]
   },

    "type": "heading",

      "type": "text",
      "text": "Repasa lo aprendido"
     }
    ]
   },
   {
    "type": "repaso",
    "attrs": {
     "id": "b-sb023",
     "preguntas": [
      {
       "q": "¿Cuántos equipos caben en una red /27?",
       "o": [
        "32",
        "30",
        "27"
       ],
       "a": 1,
       "e": "2^(32−27) = 32 direcciones, menos la de red y la de difusión: 30 equipos."
      },
      {
       "q": "¿A qué red pertenece 10.0.5.200/25?",
       "o": [
        "10.0.5.0",
        "10.0.5.128",
        "10.0.5.200"
       ],
       "a": 1,
       "e": "Las /25 empiezan en 0 y 128. 200 está en la segunda."
      },
      {
       "q": "¿Cuál es la máscara de un /26?",
       "o": [
        "255.255.255.192",
        "255.255.255.224",
        "255.255.255.0"
       ],
       "a": 0,
       "e": "26 unos: los 24 de los tres primeros octetos y 2 más (128 + 64 = 192)."
      },
      {
       "q": "Una computadora tiene la IP 169.254.33.7. ¿Qué significa?",
       "o": [
        "Que está bien configurada",
        "Que no recibió IP de un servidor DHCP",
        "Que es un servidor"
       ],
       "a": 1,
       "e": "Es una dirección de enlace local que el sistema se pone solo cuando DHCP no responde."
      },
      {
       "q": "Divides una /24 en subredes /26. ¿Cuántas te quedan?",
       "o": [
        "2",
        "4",
        "8"
       ],
       "a": 1,
       "e": "Tomas 2 bits: 2^2 = 4 subredes de 64 direcciones."
      }
     ]
    }
   },
   {
    "type": "resumen",
    "attrs": {
     "id": "b-sb024"
    },
    "content": [
     {
      "type": "bulletList",
      "content": [
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Una IPv4 son 32 bits; la máscara (o el /n de CIDR) dice cuántos son de red y cuántos de equipo."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Una red /n tiene 2"
           },
           {
            "type": "text",
            "text": "(32−n)",
            "marks": [
             {
              "type": "superscript"
             }
            ]
           },
           {
            "type": "text",

        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Las redes empiezan en múltiplos de su tamaño: con /26, en 0, 64, 128 y 192."

        ]

       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Dividir una red es tomar bits de equipo: cada bit duplica las subredes y las parte a la mitad. VLSM acomoda tamaños distintos, las grandes primero."

        ]
