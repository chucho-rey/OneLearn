          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Cada red (sistema autónomo) anuncia qué direcciones tiene; decide por reglas comerciales y de distancia"
           }
          ]
         }
        ]
       }
      ]

      "content": [
       {
        "type": "tableCell",
        "content": [

          "type": "paragraph",

            "text": "RIP",

             {
              "type": "bold"

           }
          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",

           {
            "type": "text",
            "text": "Redes pequeñas y antiguas"

          ]
         }
        ]
       },
       {
        "type": "tableCell",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {

   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-en015",
     "nombre": "en-sim",
     "titulo": "Tres sucursales"
    }
   },
   {
    "type": "callout",
    "attrs": {
     "id": "b-en016",
     "variante": "aviso"
    },
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "El 4 de octubre de 2021, Facebook, Instagram y WhatsApp desaparecieron de internet durante unas seis horas. Un cambio de configuración retiró sus anuncios BGP y el resto de internet dejó de saber cómo llegar a sus servidores, incluidos sus DNS. Los propios ingenieros tampoco podían entrar a la red para arreglarlo."
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-linux",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Rutas en Linux"
     }
    ]
   },
   {
    "type": "codeBlock",
    "attrs": {
     "id": "b-en017",
     "language": "bash"
    },
    "content": [
     {
      "type": "text",
      "text": "ip route                       # la tabla de rutas\nip route get 10.0.30.5         # ¿qué ruta usaría para llegar ahí?\nsudo ip route add 10.0.30.0/24 via 192.168.1.254   # agrega una ruta estática\nsudo ip route del 10.0.30.0/24                     # la quita\ntraceroute 10.0.30.5           # cada router del camino"
     }
    ]
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-en018",
     "nombre": "en-terminal",
     "titulo": "La red de la oficina"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Las rutas que agregas con "
     },
     {
      "type": "text",
      "text": "ip route add",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": " se pierden al reiniciar. Para que sean permanentes en Ubuntu, se escriben en la configuración de "
     },
     {
      "type": "text",
      "text": "netplan",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ":"
     }
    ],
    "attrs": {
     "id": "b-en019"
    }
   },
   {
    "type": "codeBlock",
    "attrs": {
     "id": "b-en020",
     "language": "yaml"
    },
    "content": [
     {
      "type": "text",
      "text": "network:\n  version: 2\n  ethernets:\n    enp0s3:\n      dhcp4: true\n      routes:\n        - to: 10.0.30.0/24\n          via: 192.168.1.254"
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-dudas",
     "level": 2

     {
      "type": "text",
      "text": "Dudas comunes"
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-en021"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿El router de mi casa usa OSPF o BGP?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "No. Solo conoce dos cosas: tu red de casa, que está conectada, y la ruta por defecto hacia tu proveedor de internet. Los protocolos dinámicos los usan las empresas, los proveedores y los centros de datos."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-en022"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Qué es un sistema autónomo?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Una red que pertenece a una sola organización y tiene su propia política de rutas: un proveedor de internet, una universidad, una empresa de nube. Cada uno tiene un número (ASN). Internet son decenas de miles de sistemas autónomos que se anuncian sus direcciones con BGP."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-en023"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Por qué traceroute a veces muestra asteriscos?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Algunos routers no contestan a los paquetes con TTL vencido, o los contestan muy despacio, por seguridad o para no gastar recursos. El paquete sí pasa por ahí; solo que ese router no se identifica."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-repaso",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Repasa lo aprendido"
     }
    ]
   },
   {
    "type": "repaso",
    "attrs": {
     "id": "b-en024",
     "preguntas": [
      {
       "q": "¿Qué sabe un router del camino hacia un destino lejano?",
       "o": [
        "El camino completo, router por router",
        "Solo cuál es el siguiente salto",
        "Nada: manda el paquete a todos sus vecinos"
       ],
       "a": 1,
       "e": "Solo el siguiente salto. Cada router del camino vuelve a decidir con su propia tabla."
      },
      {
       "q": "Una tabla tiene 10.0.0.0/8, 10.1.0.0/16 y 0.0.0.0/0. ¿Cuál se usa para 10.1.4.20?",
       "o": [
        "10.0.0.0/8",
        "10.1.0.0/16",
        "0.0.0.0/0"
       ],
       "a": 1,
       "e": "Las tres coinciden, y gana la más específica: la /16."
      },
      {
       "q": "¿Cuándo se usa la ruta por defecto?",
       "o": [
        "Siempre, antes que las demás",
        "Cuando ninguna otra ruta coincide",
        "Solo cuando no hay internet"
       ],
       "a": 1,
       "e": "Su prefijo es /0, el más corto posible: solo gana si no hay otra coincidencia."
      },
      {
       "q": "Se cae el enlace por donde pasa una ruta estática. ¿Qué pasa?",
       "o": [
        "El router busca otro camino solo",
        "Los paquetes se siguen mandando por ahí y se pierden",
        "La ruta se borra sola"
       ],
       "a": 1,
       "e": "Las rutas estáticas no se enteran. Para recalcular hace falta un protocolo dinámico como OSPF."
      },
      {
       "q": "¿Qué protocolo une a los proveedores y empresas que forman internet?",
       "o": [
        "OSPF",
        "BGP",
        "DHCP"
       ],
       "a": 1,
       "e": "BGP: cada sistema autónomo anuncia sus direcciones a los demás."
      }
     ]
    }
   },
   {
    "type": "resumen",
    "attrs": {
     "id": "b-en025"

    "content": [
     {
      "type": "bulletList",
      "content": [
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Un router une redes y decide el siguiente salto de cada paquete con su tabla de rutas."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Si varias rutas coinciden, gana la más específica: la coincidencia más larga."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [

            "type": "text",
            "text": "0.0.0.0/0",
            "marks": [
             {
              "type": "code"
             }
            ]
           },
           {
            "type": "text",
            "text": ", se usa cuando nada más coincide; apunta a la puerta de enlace."

         }

       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Las rutas estáticas se escriben a mano y no reaccionan a fallas; OSPF y BGP recalculan solos."

          ]
         }
        ]
       },
       {
        "type": "listItem",
