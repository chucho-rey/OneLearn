<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="ram-llenar">
<p class="hint">Elige cuánta RAM tiene el equipo y abre programas. Los consumos son estimaciones típicas.</p>
<div class="ctl" style="margin-top:0">
  <span class="lbl">Memoria instalada</span>
  <div class="seg" id="capSeg" role="group" aria-label="Memoria instalada">
    <button data-cap="4" aria-pressed="false">4 GB</button>
    <button data-cap="8" aria-pressed="true">8 GB</button>
    <button data-cap="16" aria-pressed="false">16 GB</button>
    <button data-cap="32" aria-pressed="false">32 GB</button>
  </div>
</div>
<div class="meter" aria-hidden="true"><div class="meter-t" id="mtrack"></div><div class="over" id="mover" hidden=""></div></div>
<div class="meter-l"><span id="mused"></span><span id="mpill"></span></div>
<div class="apps" id="appList"></div>
<p class="msg" id="mmsg" aria-live="polite"></p>
</template>
<template data-lab="ram-jerarquia">
<p class="hint">Toca un nivel para ver su detalle. Son tiempos típicos de acceso.</p>
<div class="ctl" style="margin-top:0">
  <span class="lbl">Escala de las barras</span>
  <div class="seg" id="lvScale" role="group" aria-label="Escala de las barras">
    <button data-mode="log" aria-pressed="true">Logarítmica</button>
    <button data-mode="lin" aria-pressed="false">Lineal</button>
  </div>
</div>
<div class="lvs" id="lvList"></div>
<p class="hint" id="lvNote" style="margin:10px 0 0"></p>
<div class="callout lv-info"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-info"></use></svg><div><p id="lvInfo" aria-live="polite"></p></div></div>
</template>
<template data-lab="ram-celdas">
<p class="hint">Cada cuadro es un capacitor. Toca uno para escribir un bit. Apaga el refresco y observa. Aquí el tiempo se alarga para que se vea; en la realidad todo pasa en milisegundos.</p>
<div class="bytes" id="dram"></div>
<div class="leg"><span><i style="background:var(--accent)"></i>Carga suficiente (se lee 1)</span><span><i style="background:var(--warn)"></i>Carga insuficiente (se lee 0)</span></div>
<div class="status" id="dramStatus" data-k="good" aria-live="polite"><span class="dot"></span><span id="dramMsg"></span></div>
<div class="ctl">
  <label class="chk"><input type="checkbox" id="refreshChk" checked=""> Refresco automático</label>
  <button class="btn" id="writeBtn">Escribir «Hola»</button>
  <button class="btn" id="pwrBtn">Cortar energía</button>
</div>
</template>
<template data-lab="ram-direccion">
<p class="hint">Elige una dirección (toca una celda o mueve el control) y pulsa Leer. Lee otra celda de la misma fila para ver qué se ahorra.</p>
<div class="split">
  <div>
    <div class="abits"><span class="mono"><span class="rb" id="rBits">010</span> <span class="cb" id="cBits">110</span></span><span id="addrTxt"></span></div>
    <div class="mat" id="mat"></div>
    <div class="buf-l">Buffer de fila</div>
    <div class="buf" id="buf"></div>
    <div class="leg"><span><i style="background:var(--accent-bg);border:1px solid var(--accent)"></i>Fila</span><span><i style="background:var(--accent-solid)"></i>Celda elegida</span></div>
  </div>
  <div>
    <ol class="steps" id="steps"></ol>
    <p class="out" id="outTxt" aria-live="polite"></p>
  </div>
</div>
<div class="ctl">
  <input class="slider" type="range" id="addrSlider" min="0" max="63" value="22" aria-label="Dirección">
</div>
<div class="ctl">
  <button class="btn pri" id="readBtn">Leer</button>
  <button class="btn" id="closeBtn">Cerrar fila</button>
  <span class="lbl" id="openTxt"></span>
</div>
<p class="hint" style="margin:12px 0 0"><b>tRCD</b> es el tiempo entre abrir la fila y pedir la columna. <b>CL</b> es el tiempo entre pedir la columna y recibir el dato. <b>tRP</b> es el tiempo para cerrar una fila abierta antes de activar otra.</p>
</template>
<template data-lab="ram-modulos">
<p class="hint">Elige un módulo y la cantidad de canales. Los CL son valores típicos de venta.</p>
<div class="chips" id="modChips" role="group" aria-label="Módulo"></div>
<div class="ctl">
  <span class="lbl">Canales</span>
  <div class="seg" id="chanSeg" role="group" aria-label="Canales">
    <button data-ch="1" aria-pressed="false">1 canal</button>
    <button data-ch="2" aria-pressed="true">2 canales</button>
  </div>
</div>
<div class="met">
  <div class="met-h"><span>Reloj</span><b id="cClk"></b></div>
</div>
<div class="met">
  <div class="met-h"><span>Ancho de banda máximo</span><b id="cBw"></b></div>
  <div class="bar"><i id="cBwBar"></i></div>
  <p class="fm" id="cBwF"></p>
</div>
<div class="met">
  <div class="met-h"><span>Latencia del primer dato</span><b id="cLat"></b></div>
  <div class="bar alt"><i id="cLatBar"></i></div>
  <p class="fm" id="cLatF"></p>
</div>
</template>

        "content": [
         {
          "type": "text",

       {

   {

      "text": "Calculadora de rendimiento"

   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Cada transferencia mueve 8 bytes, porque el bus de un módulo es de 64 bits. De ahí salen dos fórmulas: el ancho de banda máximo es MT/s × 8 bytes × canales, y la latencia del primer dato es 2000 × CL ÷ MT/s."
     }
    ],
    "attrs": {

   {

    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Más ancho de banda no siempre significa menos latencia. DDR5-4800 CL40 mueve más datos por segundo que DDR4-3200 CL16, pero tarda más en entregar el primero."
       }
      ]
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Dos módulos iguales en doble canal duplican el máximo teórico. En el uso real se obtiene menos que ese máximo."
       }
      ]
     }
    ]

   {

     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Más RAM hace más rápido mi equipo?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Solo si la que tienes se llena. Mientras sobre memoria, añadir más no cambia la velocidad. Cuando se llena, el sistema usa el disco como respaldo y todo se pone lento; ahí más RAM sí ayuda mucho."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-ram033"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Por qué el sistema muestra tanta RAM en uso?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Los sistemas operativos aprovechan la memoria libre para guardar archivos usados hace poco (caché), porque tener RAM vacía no sirve de nada. Cuando un programa pide memoria, el sistema la libera al instante."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-ram034"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿La RAM guarda mis archivos?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "No. Lo que solo está en la RAM se pierde al apagar, por eso hay que guardar los documentos. La hibernación copia el contenido de la RAM al disco antes de apagar y lo restaura al encender."
         }
        ]
       }
      ]
     }
    ]
   },

    "type": "desplegable",
    "attrs": {
     "id": "b-ram035"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Qué es la memoria virtual?"

      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Cuando la RAM se llena, el sistema mueve a un archivo del disco los datos que hace rato no se usan (swap o archivo de paginación). Libera espacio, pero acceder a ese archivo es mucho más lento que acceder a la RAM."
         }
        ]
       }
      ]
     }
    ]
   },

    "type": "desplegable",
    "attrs": {
     "id": "b-ram036"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Puedo mezclar módulos distintos?"

      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Suele funcionar, pero todos trabajan a la velocidad y los tiempos del más lento. Para aprovechar el doble canal conviene instalar módulos iguales."
         }
        ]
       }
      ]
     }
    ]

      {
       "q": "¿Qué pasa con el contenido de la RAM cuando apagas el equipo?",
       "o": [
        "Se guarda automáticamente en el SSD",
        "Se pierde, porque la RAM es volátil",
        "Se conserva durante 24 horas"
       ],
       "a": 1,
       "e": "La RAM necesita energía para mantener la carga de sus capacitores. Sin corriente, el contenido desaparece. Por eso los archivos se guardan en el almacenamiento."
      },
      {
       "q": "¿Por qué la DRAM necesita refresco?",
       "o": [
        "Porque los capacitores pierden carga con el tiempo",
        "Porque el procesador es más lento que ella",
        "Porque los transistores se desgastan al leer"
       ],
       "a": 0,
       "e": "Cada capacitor se descarga solo. Si no se reescribe a tiempo, un 1 se confunde con un 0."
      },
      {
       "q": "Un módulo DDR4-3200 hace 3,200 millones de transferencias por segundo. ¿Cuál es su reloj?",
       "o": [
        "3,200 MHz",
        "1,600 MHz",
        "6,400 MHz"
       ],
       "a": 1,
       "e": "DDR transfiere en la subida y en la bajada del reloj, dos veces por ciclo. Por eso el reloj es la mitad: 1,600 MHz."
      },
      {
       "q": "Instalas dos módulos iguales y la placa los usa en doble canal. ¿Qué pasa con el ancho de banda máximo?",
       "o": [
        "Se duplica",
        "Se mantiene igual",
        "Baja a la mitad"
       ],
       "a": 0,
       "e": "Cada canal tiene su propio bus de 64 bits. Con dos canales el procesador mueve el doble de datos por ciclo. La latencia casi no cambia."
      }

        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "La RAM es la memoria de trabajo: rápida, volátil y de acceso aleatorio."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Cada bit de DRAM es un capacitor con su transistor, y se refresca cada pocos milisegundos."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Los datos se ubican por fila y columna: abrir una fila cuesta, leer dentro de ella es barato."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Más RAM ayuda cuando la actual se llena. El rendimiento también depende del ancho de banda (MT/s y canales) y de la latencia (CL junto con MT/s)."
           }
          ]
         }
        ]
