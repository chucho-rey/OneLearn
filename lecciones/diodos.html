<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="di-polaridad">
<p class="hint">Gira el diodo y sube el voltaje de la pila. En el circuito hay una resistencia de 100 Ω que limita la corriente.</p>
<div class="seg" id="poDir" role="group" aria-label="Sentido del diodo">
  <button type="button" data-v="1" aria-pressed="true">Directa</button>
  <button type="button" data-v="0" aria-pressed="false">Inversa</button>
</div>
<div class="ctl">
  <span class="lbl">Voltaje de la pila</span>
  <input class="slider" type="range" id="poV" min="0" max="5" step="0.1" value="1.5" aria-label="Voltaje de la pila">
  <b class="mono" id="poVv"></b>
</div>
<svg class="po-svg" id="poSvg" viewBox="0 0 320 120" role="img" aria-label="Circuito con una pila, una resistencia y un diodo"></svg>
<div class="kpis">
  <div class="kpi"><span>Corriente</span><b id="poI"></b><div class="bar"><i id="poBar"></i></div></div>
  <div class="kpi"><span>Voltaje en el diodo</span><b id="poVd"></b></div>
</div>
<p class="msg" id="poMsg" aria-live="polite"></p>
</template>
<template data-lab="di-rectificar">
<p class="hint">La línea punteada es la corriente alterna que entra; la línea gruesa, lo que sale. Elige el circuito.</p>
<div class="chips" id="reModo" role="group" aria-label="Circuito">
  <button class="chip" type="button" data-v="0" aria-pressed="true">Sin diodos</button>
  <button class="chip" type="button" data-v="1" aria-pressed="false">Un diodo</button>
  <button class="chip" type="button" data-v="2" aria-pressed="false">Puente de 4 diodos</button>
  <button class="chip" type="button" data-v="3" aria-pressed="false">Puente + capacitor</button>
</div>
<svg class="re-svg" id="reSvg" viewBox="0 0 320 150" role="img" aria-label="Forma de la onda de entrada y de salida"></svg>
<div class="leg"><span><i class="re-l-in"></i>Entrada (alterna)</span><span><i class="re-l-out"></i>Salida</span></div>
<p class="msg" id="reMsg" aria-live="polite"></p>
</template>
<template data-lab="di-led">
<p class="hint">Elige la fuente, el color del LED y la corriente. Los voltajes del LED son típicos; los exactos están en su hoja de datos.</p>
<div class="ctl" style="margin-top:0">
  <span class="lbl">Fuente</span>
  <div class="seg" id="ldF" role="group" aria-label="Voltaje de la fuente">
    <button type="button" data-v="3.3" aria-pressed="false">3.3 V</button>
    <button type="button" data-v="5" aria-pressed="true">5 V</button>
    <button type="button" data-v="9" aria-pressed="false">9 V</button>
    <button type="button" data-v="12" aria-pressed="false">12 V</button>
  </div>
</div>
<div class="ctl">
  <span class="lbl">LED</span>
  <div class="chips" id="ldC" role="group" aria-label="Color del LED">
    <button class="chip" type="button" data-v="rojo" aria-pressed="true">Rojo · 2.0 V</button>
    <button class="chip" type="button" data-v="amarillo" aria-pressed="false">Amarillo · 2.1 V</button>
    <button class="chip" type="button" data-v="verde" aria-pressed="false">Verde · 3.0 V</button>
    <button class="chip" type="button" data-v="azul" aria-pressed="false">Azul · 3.0 V</button>
    <button class="chip" type="button" data-v="blanco" aria-pressed="false">Blanco · 3.0 V</button>
  </div>
</div>
<div class="ctl">
  <span class="lbl">Corriente</span>
  <div class="seg" id="ldI" role="group" aria-label="Corriente del LED">
    <button type="button" data-v="0.005" aria-pressed="false">5 mA</button>
    <button type="button" data-v="0.01" aria-pressed="false">10 mA</button>
    <button type="button" data-v="0.02" aria-pressed="true">20 mA</button>
  </div>
</div>
<div class="ld">
  <span class="ld-led" id="ldLed" aria-hidden="true"></span>
  <div class="kpis ld-k">
    <div class="kpi"><span>Resistencia exacta</span><b id="ldR"></b></div>
    <div class="kpi"><span>Valor comercial a usar</span><b id="ldRc"></b></div>
    <div class="kpi"><span>Potencia en la resistencia</span><b id="ldP"></b></div>
  </div>
</div>
<p class="msg" id="ldMsg" aria-live="polite"></p>
</template>
