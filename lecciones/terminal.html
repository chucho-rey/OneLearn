<!-- Plantillas de los laboratorios: bloques.js las copia dentro de cada bloque «laboratorio» -->
<template data-lab="tm-partes">
<p class="hint">Elige un comando y mira qué hace cada una de sus partes.</p>
<div class="chips" id="tpCmd" role="group" aria-label="Comando de ejemplo">
  <button class="chip mono" type="button" data-v="0" aria-pressed="true">ls -l /etc</button>
  <button class="chip mono" type="button" data-v="1" aria-pressed="false">cp -r fotos respaldo</button>
  <button class="chip mono" type="button" data-v="2" aria-pressed="false">grep -i error app.log</button>
  <button class="chip mono" type="button" data-v="3" aria-pressed="false">mkdir -p escuela/redes</button>
  <button class="chip mono" type="button" data-v="4" aria-pressed="false">sudo apt install tree</button>
</div>
<p class="tp-linea" id="tpLinea" aria-hidden="true"></p>
<ol class="tp-lista" id="tpLista"></ol>
<div class="status" id="tpStat" data-k="good" aria-live="polite"><span class="dot"></span><span id="tpMsg"></span></div>
<div class="leg"><span><i class="tp-c"></i>Comando</span><span><i class="tp-o"></i>Opción</span><span><i class="tp-a"></i>Argumento</span></div>
</template>
<template data-lab="tm-pasos">
<p class="hint">Escribe los comandos en la terminal y pulsa Enter. Los ejercicios se marcan solos cuando los cumples.</p>
<div class="term-host"></div>
</template>
<template data-lab="tm-ordenar">
<p class="hint">Tu carpeta de Descargas es un desorden. Ordénala desde la terminal. Si algo sale mal, «Empezar de nuevo» la deja como estaba.</p>
<div class="term-host"></div>
</template>
<template data-lab="tm-buscar">
<p class="hint">La app de una tienda en línea guarda lo que pasa en <code>~/registros/app.log</code>. Investiga qué falló sin abrir el archivo completo.</p>
<div class="term-host"></div>
</template>

    },
    "content": [
     {
      "type": "text",
      "text": "pwd              # ¿en qué carpeta estoy?\nls               # ¿qué hay aquí?\nls -l            # lista larga: permisos, dueño, tamaño y fecha\nls -a            # incluye los archivos ocultos (los que empiezan con punto)\nls -la /etc      # se pueden juntar opciones y elegir la carpeta\ncd Documentos    # entra a Documentos\ncd ..            # sube un nivel\ncd /var/log      # ve directo a una ruta absoluta\ncd               # regresa a tu carpeta personal (igual que cd ~)"
     }

        "Que eres administrador",

       "a": 1,
       "e": "`~` es el atajo de tu carpeta personal, `/home/ana`. El `$` dice que eres un usuario normal."

       "q": "En `ls -l /etc`, ¿qué es `-l`?",
       "o": [

       "a": 1,
       "e": "Las opciones empiezan con guion y cambian cómo trabaja el comando. `/etc` es el argumento: la carpeta que quieres ver."

       "o": [

       "a": 0,
       "e": "`..` es la carpeta de arriba. Desde Documentos, sube a `/home/ana`."
