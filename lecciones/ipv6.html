   {
    "type": "callout",
    "attrs": {
     "id": "b-v6013",
     "variante": "idea"
    },
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Un equipo con IPv6 tiene "
       },
       {
        "type": "text",
        "text": "varias direcciones a la vez",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": ": la de enlace local, una o más globales (algunas temporales, que cambian para proteger tu privacidad) y quizá una ULA. Es normal ver tres o cuatro en "
       },
       {
        "type": "text",
        "text": "ip -6 a",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": "."
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-slaac",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Cómo obtiene su dirección"
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "En IPv6 casi siempre es el propio equipo el que arma su dirección, con "
     },
     {
      "type": "text",
      "text": "SLAAC",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " ("
     },
     {
      "type": "text",
      "text": "autoconfiguración sin estado",
      "marks": [
       {
        "type": "italic"
       }
      ]
     },
     {
      "type": "text",
      "text": "):"
     }
    ],
    "attrs": {
     "id": "b-v6014"
    }
   },
   {
    "type": "orderedList",
    "attrs": {
     "id": "b-v6015"
    },
    "content": [
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "El router anuncia el "
         },
         {
          "type": "text",
          "text": "prefijo",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " de la red: los primeros 64 bits, por ejemplo "
         },
         {
          "type": "text",
          "text": "2001:db8:4a1:20::/64",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": "."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "El equipo agrega sus propios 64 bits, el "
         },
         {
          "type": "text",
          "text": "identificador de interfaz",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": ". Puede salir de su MAC (método EUI-64) o ser aleatorio."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Antes de usarla, pregunta a la red si alguien más la tiene (detección de duplicados)."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "Con "
     },
     {
      "type": "text",
      "text": "EUI-64",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ", la MAC de 48 bits se parte a la mitad, se inserta "
     },
     {
      "type": "text",
      "text": "ff:fe",
      "marks": [
       {
        "type": "code"
       }
      ]
     },
     {
      "type": "text",
      "text": " en medio y se invierte el séptimo bit. El problema es que la MAC queda a la vista y te pueden seguir de una red a otra; por eso los sistemas actuales usan identificadores "
     },
     {
      "type": "text",
      "text": "aleatorios",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " para salir a internet."
     }
    ],
    "attrs": {
     "id": "b-v6016"
    }
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-v6017",
     "nombre": "v6-slaac",
     "titulo": "Arma tu dirección"
    }
   },
   {
    "type": "paragraph",
    "content": [
     {
      "type": "text",
      "text": "En IPv6 las redes son casi siempre "
     },
     {
      "type": "text",
      "text": "/64",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ", y a una casa u oficina el proveedor le da un bloque "
     },
     {
      "type": "text",
      "text": "/56",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": " o "
     },
     {
      "type": "text",
      "text": "/48",
      "marks": [
       {
        "type": "bold"
       }
      ]
     },
     {
      "type": "text",
      "text": ", del que salen 256 o 65,536 redes /64. Dividir redes se vuelve sencillo: se cambia un grupo."
     }
    ],
    "attrs": {
     "id": "b-v6018"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-practica",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "IPv6 en la práctica"
     }
    ]
   },
   {
    "type": "codeBlock",
    "attrs": {
     "id": "b-v6019",
     "language": "bash"
    },
    "content": [
     {
      "type": "text",
      "text": "ip -6 a                  # tus direcciones IPv6\nping -6 example.com      # ping por IPv6\ndig AAAA example.com     # el registro DNS de IPv6 se llama AAAA\ncurl -6 https://example.com"
     }
    ]
   },
   {
    "type": "bulletList",
    "attrs": {
     "id": "b-v6020"
    },
    "content": [
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "La mayoría de las redes usan "
         },
         {
          "type": "text",
          "text": "doble pila",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " ("
         },
         {
          "type": "text",
          "text": "dual stack",
          "marks": [
           {
            "type": "italic"
           }
          ]
         },
         {
          "type": "text",
          "text": "): IPv4 e IPv6 a la vez. Si un sitio tiene las dos, el sistema prefiere IPv6."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Sin NAT, cada equipo es alcanzable desde internet: el "
         },
         {
          "type": "text",
          "text": "firewall",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " del router es lo que bloquea las conexiones que nadie pidió. Revisa que esté activo para IPv6."
         }
        ]
       }
      ]
     },
     {
      "type": "listItem",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "En una URL, la dirección va entre corchetes para no confundir los dos puntos con el puerto: "
         },
         {
          "type": "text",
          "text": "http://[2001:db8::10]:8080/",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": "."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "laboratorio",
    "attrs": {
     "id": "b-v6021",
     "nombre": "v6-terminal",
     "titulo": "IPv6 desde la terminal"
    }
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-dudas",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Dudas comunes"
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-v6022"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Tengo que dejar de usar IPv4?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "No. Las dos van a convivir muchos años. Casi todo funciona en doble pila y el sistema elige solo. Lo que sí conviene es saber leer y configurar las dos."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-v6023"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿Cómo sé si tengo IPv6?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "En la terminal, "
         },
         {
          "type": "text",
          "text": "ip -6 a",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": ": si ves una dirección que empieza con 2 o 3 (global), lo tienes. Desde el navegador, hay sitios de prueba que te lo dicen. En México, varios proveedores de fibra y casi todos los de celular ya lo dan."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "desplegable",
    "attrs": {
     "id": "b-v6024"
    },
    "content": [
     {
      "type": "desplegableTitulo",
      "content": [
       {
        "type": "text",
        "text": "¿IPv6 es más seguro?"
       }
      ]
     },
     {
      "type": "desplegableCuerpo",
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "No por sí mismo. Trae algunas mejoras, pero sin NAT tus equipos son alcanzables si el firewall lo permite. La seguridad depende de configurarlo bien, igual que en IPv4."
         }
        ]
       }
      ]
     }
    ]
   },
   {
    "type": "heading",
    "attrs": {
     "id": "s-repaso",
     "level": 2
    },
    "content": [
     {
      "type": "text",
      "text": "Repasa lo aprendido"
     }
    ]
   },
   {
    "type": "repaso",
    "attrs": {
     "id": "b-v6025",
     "preguntas": [
      {
       "q": "¿Cuántos bits tiene una dirección IPv6?",
       "o": [
        "32",
        "64",
        "128"
       ],
       "a": 2,
       "e": "128 bits, escritos como 8 grupos de 4 dígitos hexadecimales."
      },
      {
       "q": "¿Cuál es la forma abreviada de 2001:0db8:0000:0000:0000:0000:0000:0001?",
       "o": [
        "2001:db8::1",
        "2001:db8:0:0::1:",
        "2001::db8::1"
       ],
       "a": 0,
       "e": "Se quitan los ceros a la izquierda y la serie de grupos en cero se cambia por :: una sola vez."
      },
      {
       "q": "Una dirección que empieza con fe80:: es…",
       "o": [
        "Global",
        "De enlace local: solo sirve en la misma red",
        "Privada de internet"
       ],
       "a": 1,
       "e": "fe80::/10 es de enlace local: toda tarjeta tiene una y no sale de la red local."
      },
      {
       "q": "¿Cómo se llama el registro DNS que guarda una dirección IPv6?",
       "o": [
        "A",
        "AAAA",
        "MX"
       ],
       "a": 1,
       "e": "A es para IPv4 y AAAA para IPv6 (cuatro veces más grande)."
      },
      {
       "q": "Sin NAT, ¿qué protege a tus equipos de conexiones que nadie pidió?",
       "o": [
        "Nada, IPv6 no las permite",
        "El firewall",
        "El DNS"
       ],
       "a": 1,
       "e": "En IPv6 todos tienen dirección pública: el firewall del router es indispensable."
      }
     ]
    }
   },
   {
    "type": "resumen",
    "attrs": {
     "id": "b-v6026"
    },
    "content": [
     {
      "type": "bulletList",
      "content": [
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "IPv6 tiene 128 bits: direcciones de sobra para que cada equipo tenga una pública, sin NAT."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Se escribe en 8 grupos hexadecimales: se quitan ceros a la izquierda y la serie de ceros más larga se vuelve :: una vez."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Tipos: global (2000::/3), enlace local (fe80::/10), local única (fc00::/7), loopback (::1) y multicast (ff00::/8). No hay difusión."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Con SLAAC el equipo arma su dirección: prefijo /64 del router más su identificador (EUI-64 o aleatorio)."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Doble pila: IPv4 e IPv6 conviven. "
           },
           {
            "type": "text",
            "text": "ip -6 a",
            "marks": [
             {
              "type": "code"
             }
            ]
           },
           {
            "type": "text",
            "text": ", "
           },
           {
            "type": "text",
            "text": "ping -6",
            "marks": [
             {
              "type": "code"
             }
            ]
           },
           {
            "type": "text",
            "text": " y "
           },
           {
            "type": "text",
            "text": "dig AAAA",
            "marks": [
             {
              "type": "code"
             }
            ]
           },
           {
            "type": "text",
            "text": " son tus herramientas."
           }
          ]
         }
        ]
       }
      ]
     }
    ]
   }
  ]
