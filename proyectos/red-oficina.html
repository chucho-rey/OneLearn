<!-- Plantillas de los diagramas interactivos: bloques.js las copia dentro de cada bloque «laboratorio» -->

<template data-lab="ro-topologia">
<p class="hint">Toca un equipo para ver su papel, o elige una situación para seguir el camino de los datos.</p>
<div class="chips" id="toRuta" role="group" aria-label="Situación">
  <button class="chip" type="button" data-v="oficina" aria-pressed="false">Laura edita desde la oficina</button>
  <button class="chip" type="button" data-v="casa" aria-pressed="false">Carlos entra desde su casa</button>
  <button class="chip" type="button" data-v="visita" aria-pressed="false">Una visita intenta entrar</button>
</div>
<svg class="to-svg" id="toSvg" viewBox="0 0 600 340" role="img" aria-label="Diagrama de la red del despacho"></svg>
<div class="leg"><span><i class="to-l-cable"></i>Cable</span><span><i class="to-l-wifi"></i>Wi-Fi</span><span><i class="to-l-vpn"></i>Túnel VPN</span><span><i class="to-l-ruta"></i>Camino de los datos</span></div>
<div class="status" id="toStat" data-k="" aria-live="polite"><span class="dot"></span><span id="toMsg"></span></div>
<div class="chips to-eq" id="toEq" role="group" aria-label="Equipos"></div>
</template>
<template data-lab="ro-ip">
<p class="hint">Quieres agregar un equipo con dirección fija a la red 192.168.10.0/24. Escribe la dirección que le darías.</p>
<label class="lbl" for="ipNueva">Dirección del equipo nuevo</label>
<input class="campo mono" type="text" id="ipNueva" value="192.168.10.30" spellcheck="false" autocomplete="off" inputmode="decimal">
<div class="chips ip-ej" id="ipEj" role="group" aria-label="Ejemplos">
  <button class="chip" type="button" data-v="192.168.10.30" aria-pressed="true">192.168.10.30</button>
  <button class="chip" type="button" data-v="192.168.10.10" aria-pressed="false">192.168.10.10</button>
  <button class="chip" type="button" data-v="192.168.10.150" aria-pressed="false">192.168.10.150</button>
  <button class="chip" type="button" data-v="192.168.11.5" aria-pressed="false">192.168.11.5</button>
  <button class="chip" type="button" data-v="192.168.10.255" aria-pressed="false">192.168.10.255</button>
</div>
<div class="ip-mapa" id="ipMapa" aria-hidden="true"></div>
<div class="leg"><span><i class="ip-l-fija"></i>Fijas en uso</span><span><i class="ip-l-dhcp"></i>Rango DHCP</span><span><i class="ip-l-libre"></i>Libres para fijas</span><span><i class="ip-l-tu"></i>Tu equipo</span></div>
<div class="status" id="ipStat" data-k="" aria-live="polite"><span class="dot"></span><span id="ipMsg"></span></div>
</template>
<template data-lab="ro-remoto">
<p class="hint">Elige una forma de que Carlos y Ana entren desde fuera y compara.</p>
<div class="chips" id="reOp" role="group" aria-label="Opción de acceso remoto">
  <button class="chip" type="button" data-v="0" aria-pressed="false">Abrir un puerto del router</button>
  <button class="chip" type="button" data-v="1" aria-pressed="false">VPN propia con WireGuard</button>
  <button class="chip" type="button" data-v="2" aria-pressed="true">Tailscale (VPN administrada)</button>
</div>
<div class="tbl-wrap"><table class="re-t"><tbody id="reTab"></tbody></table></div>
<div class="status" id="reStat" data-k="" aria-live="polite"><span class="dot"></span><span id="reMsg"></span></div>
</template>

          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "La imagen de "
           },
           {
            "type": "text",
            "text": "Ubuntu Server 24.04 LTS",
            "marks": [
             {
              "type": "bold"
             }
            ]
           },
           {
            "type": "text",
            "text": " (ubuntu.com/download/server)."

          ]

        ]
       }
      ]
     },
     {
      "type": "callout",
      "attrs": {
       "id": "b-rf3004",
       "variante": "idea"
      },
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "¿Tienes una computadora vieja que ya nadie usa? Instalar Ubuntu Server directamente en ella es todavía mejor práctica: así funciona un servidor real."

     },
     {
      "type": "heading",
      "attrs": {
       "id": "b-rf3005",

      },
      "content": [
       {

       }
      ]
     },
     {
      "type": "orderedList",
      "attrs": {
       "id": "b-rf3006"
      },
      "content": [
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "En VirtualBox, crea una máquina nueva: tipo Linux, Ubuntu (64-bit), "
           },
           {
            "type": "text",
            "text": "2 GB de RAM",
            "marks": [
             {
              "type": "bold"
             }
            ]
           },
           {
            "type": "text",
            "text": " o más, "
           },
           {
            "type": "text",
            "text": "2 procesadores",
            "marks": [
             {
              "type": "bold"
             }
            ]
           },
           {
            "type": "text",
            "text": " y un disco de "
           },
           {
            "type": "text",
            "text": "25 GB",
            "marks": [
             {
              "type": "bold"
             }
            ]
           },
           {
            "type": "text",

           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "En "
           },
           {
            "type": "text",
            "text": "Red",
            "marks": [
             {
              "type": "bold"
             }

           },
           {
            "type": "text",

           {
            "type": "text",
            "text": "Adaptador puente",
            "marks": [
             {
              "type": "bold"
             }
            ]
           },
           {
            "type": "text",
            "text": " ("
           },
           {
            "type": "text",

             {
              "type": "italic"

           {

        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Arranca la máquina con la imagen de Ubuntu Server e instálalo con las opciones predeterminadas. Cuando te pregunte, marca "
           },
           {
            "type": "text",
            "text": "Install OpenSSH server",
            "marks": [
             {
              "type": "bold"
             }
            ]
           },
           {
            "type": "text",
            "text": "."
           }
          ]
         }
        ]
       },
       {
        "type": "listItem",
        "content": [
         {
          "type": "paragraph",
          "content": [

            "type": "text",
            "text": "Crea tu usuario (por ejemplo, «admin») con una contraseña fuerte."
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "heading",
      "attrs": {
       "id": "b-rf3007",
       "level": 3
      },
      "content": [
       {
        "type": "text",
        "text": "Primeros comandos"
       }
      ]
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Al terminar, inicia sesión en la máquina virtual y averigua su dirección IP:"
       }
      ],
      "attrs": {
       "id": "b-rf3008"
      }
     },
     {
      "type": "codeBlock",
      "attrs": {
       "id": "b-rf3009",
       "language": "bash"
      },
      "content": [
       {
        "type": "text",
        "text": "ip a"
       }
      ]
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Busca una línea como "
       },
       {
        "type": "text",
        "text": "inet 192.168.1.57/24",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": " en el adaptador que empieza con «enp». Esa es la dirección del servidor en tu red. Después, desde la terminal de "
       },
       {
        "type": "text",
        "text": "tu computadora",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " (no de la máquina virtual), comprueba que lo ves y conéctate por SSH:"
       }
      ],
      "attrs": {
       "id": "b-rf3010"
      }
     },
     {
      "type": "codeBlock",
      "attrs": {
       "id": "b-rf3011",
       "language": "bash"
      },
      "content": [
       {
        "type": "text",
        "text": "ping 192.168.1.57\nssh admin@192.168.1.57"
       }
      ]
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "SSH",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " abre una terminal del servidor desde otra computadora. Así se administran casi todos los servidores del mundo: nadie se sienta frente a ellos."
       }
      ],
      "attrs": {
       "id": "b-rf3012"
      }
     },
     {
      "type": "callout",
      "attrs": {
       "id": "b-rf3013",
       "variante": "info"
      },
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Tu red de casa probablemente usa 192.168.1.x o 192.168.0.x, no la 192.168.10.x del diseño. Es normal: en el laboratorio adaptas el plan a tu red; en el despacho usarías el plan de la fase 2."
         }
        ]
       }
      ]
     },
     {
      "type": "desplegable",
      "attrs": {
       "id": "b-rf3014"
      },
      "content": [
       {
        "type": "desplegableTitulo",
        "content": [
         {
          "type": "text",
          "text": "Si te atoras: la máquina virtual no recibe una dirección de tu red"
         }
        ]
       },
       {
        "type": "desplegableCuerpo",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "Revisa que el adaptador esté en «Adaptador puente» y que el nombre del adaptador elegido sea el que usa tu computadora para conectarse (el de Wi-Fi o el de cable). Algunas redes Wi-Fi de escuelas o empresas no permiten el modo puente; en casa casi siempre funciona."
           }
          ]
         }
        ]
       }
      ]
     },
     {
      "type": "desplegable",
      "attrs": {
       "id": "b-rf3015"
      },
      "content": [
       {
        "type": "desplegableTitulo",
        "content": [
         {
          "type": "text",
          "text": "Si te atoras: «ssh: connect to host … Connection refused»"
         }
        ]
       },
       {
        "type": "desplegableCuerpo",
        "content": [
         {
          "type": "paragraph",
          "content": [
           {
            "type": "text",
            "text": "No se instaló el servidor SSH. Dentro de la máquina virtual escribe "
           },
           {
            "type": "text",
            "text": "sudo apt install openssh-server",
            "marks": [
             {
              "type": "code"
             }
            ]
           },
           {
            "type": "text",
            "text": "."
           }
          ]
         }
        ]
       }
      ]
     }
    ]

  {
   "id": "f4",
   "titulo": "Configura el servidor",
   "duracion": "2 horas",
   "objetivo": "Dejar el servidor actualizado, con una dirección fija, acceso seguro y firewall.",
   "aprenderas": [
    "Configurar la red de Linux con netplan",
    "Entrar por SSH con llaves",
    "Configurar un firewall con ufw"
   ],
   "trabajo": "«Endurecer» un servidor (actualizar, cerrar puertos, usar llaves) es una de las primeras tareas que te encargarán en un puesto de soporte o de administración de sistemas.",
   "contenido": {
    "type": "doc",
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Un servidor nuevo se prepara siempre igual: actualizarlo, darle una dirección que no cambie, proteger el acceso y encender el firewall."
       }
      ],
      "attrs": {
       "id": "b-rf4001"
      }
     },
     {
      "type": "heading",
      "attrs": {
       "id": "b-rf4002",
       "level": 3
      },
      "content": [
       {
        "type": "text",
        "text": "1. Actualiza el sistema"
       }
      ]
     },
     {
      "type": "codeBlock",
      "attrs": {
       "id": "b-rf4003",
       "language": "bash"
      },
      "content": [
       {
        "type": "text",
        "text": "sudo apt update\nsudo apt upgrade -y"
       }
      ]
     },
     {
      "type": "heading",
      "attrs": {
       "id": "b-rf4004",
       "level": 3
      },
      "content": [
       {
        "type": "text",
        "text": "2. Una dirección que no cambie"
       }
      ]
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Las PC del despacho necesitan encontrar el servidor siempre en el mismo lugar. Hay dos formas: hacer una "
       },
       {
        "type": "text",
        "text": "reserva DHCP",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " en el router (lo más sencillo si tienes acceso a él) o configurar una "
       },
       {
        "type": "text",
        "text": "IP fija",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " en el servidor. Para la fija, Ubuntu usa "
       },
       {
        "type": "text",
        "text": "netplan",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": ". Primero mira el nombre de tu adaptador con "
       },
       {
        "type": "text",
        "text": "ip a",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": " (por ejemplo, enp0s3) y el de tu archivo de configuración con "
       },
       {
        "type": "text",
        "text": "ls /etc/netplan",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": " (suele llamarse 50-cloud-init.yaml), y edítalo:"
       }
      ],
      "attrs": {
       "id": "b-rf4005"
      }
     },
     {
      "type": "codeBlock",
      "attrs": {
       "id": "b-rf4006",
       "language": "bash"
      },
      "content": [
       {
        "type": "text",
        "text": "sudo nano /etc/netplan/50-cloud-init.yaml"
       }
      ]
     },
     {
      "type": "codeBlock",
      "attrs": {
       "id": "b-rf4007",
       "language": "yaml"
      },
      "content": [
       {
        "type": "text",
        "text": "network:\n  version: 2\n  ethernets:\n    enp0s3:\n      dhcp4: false\n      addresses: [192.168.1.50/24]\n      routes:\n        - to: default\n          via: 192.168.1.1\n      nameservers:\n        addresses: [1.1.1.1, 8.8.8.8]"
       }
      ]
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Cambia los valores por los de tu red: una dirección "
       },
       {
        "type": "text",
        "text": "fuera",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " del rango DHCP de tu router, la puerta de enlace de tu router (normalmente termina en .1) y el nombre de tu adaptador. Guarda (Ctrl+O, Enter, Ctrl+X) y aplica:"
       }
      ],
      "attrs": {
       "id": "b-rf4008"
      }
     },
     {
      "type": "codeBlock",
      "attrs": {
       "id": "b-rf4009",
       "language": "bash"
      },
      "content": [
       {
        "type": "text",
        "text": "sudo netplan apply"
       }
      ]
     },
     {
      "type": "callout",
      "attrs": {
       "id": "b-rf4010",
       "variante": "aviso"
      },
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "En YAML los espacios importan: usa espacios, nunca tabulaciones, y respeta la sangría exacta. Si te equivocas, el servidor puede quedarse sin red; por eso conviene hacerlo desde la consola de la máquina virtual y no por SSH."
         }
        ]
       }
      ]
     },
     {
      "type": "heading",
      "attrs": {
       "id": "b-rf4011",
       "level": 3
      },
      "content": [
       {
        "type": "text",
        "text": "3. Entra con llaves, no con contraseña"
       }
      ]
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Una "
       },
       {
        "type": "text",
        "text": "llave SSH",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " es como un candado y su llave: la parte pública va al servidor y la privada se queda en tu computadora. Es más seguro que una contraseña. Desde "
       },
       {
        "type": "text",
        "text": "tu computadora",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": ":"
       }
      ],
      "attrs": {
       "id": "b-rf4012"
      }
     },
     {
      "type": "codeBlock",
      "attrs": {
       "id": "b-rf4013",
       "language": "bash"
      },
      "content": [
       {
        "type": "text",
        "text": "ssh-keygen -t ed25519\nssh-copy-id admin@192.168.1.50"
       }
      ]
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "En Windows, si no tienes "
       },
       {
        "type": "text",
        "text": "ssh-copy-id",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": ", copia el contenido de tu archivo "
       },
       {
        "type": "text",
        "text": ".ssh/id_ed25519.pub",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": " al archivo "
       },
       {
        "type": "text",
        "text": "~/.ssh/authorized_keys",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": " del servidor. Comprueba que ya entras sin que te pida la contraseña del usuario."
       }
      ],
      "attrs": {
       "id": "b-rf4014"
      }
     },
     {
      "type": "heading",
      "attrs": {
       "id": "b-rf4015",
       "level": 3
      },
      "content": [
       {
        "type": "text",
        "text": "4. Enciende el firewall"
       }
      ]
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "El firewall bloquea todo lo que no autorices. Solo abrimos lo necesario: SSH para administrar y la web (80 y 443) para Nextcloud:"
       }
      ],
      "attrs": {
       "id": "b-rf4016"
      }
     },
     {
      "type": "codeBlock",
      "attrs": {
       "id": "b-rf4017",
       "language": "bash"
      },
      "content": [
       {
        "type": "text",
        "text": "sudo ufw allow OpenSSH\nsudo ufw allow 80/tcp\nsudo ufw allow 443/tcp\nsudo ufw enable\nsudo ufw status"
       }
      ]
     },
     {
      "type": "callout",
      "attrs": {
       "id": "b-rf4018",
       "variante": "idea"
      },
      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Permite SSH "
         },
         {
          "type": "text",
          "text": "antes",
          "marks": [
           {
            "type": "bold"
           }
          ]
         },
         {
          "type": "text",
          "text": " de encender el firewall. Si lo enciendes primero, te quedas fuera de tu propio servidor (y tendrás que entrar por la consola de la máquina virtual)."
         }
        ]
       }
      ]
     },
     {
      "type": "heading",
      "attrs": {
       "id": "b-rf4019",
       "level": 3
      },
      "content": [
       {
        "type": "text",
        "text": "5. Actualizaciones automáticas de seguridad"
       }
      ]
     },
     {
      "type": "codeBlock",
      "attrs": {
       "id": "b-rf4020",
       "language": "bash"
      },
      "content": [
       {
        "type": "text",
        "text": "sudo apt install unattended-upgrades\nsudo dpkg-reconfigure --priority=low unattended-upgrades"
       }
      ]
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Así el servidor instala solo los parches de seguridad, que es lo que detiene a los gusanos (lo viste en la lección de "
       },
       {
        "type": "text",
        "text": "malware",
        "marks": [
         {
          "type": "link",
          "attrs": {
           "href": "../lecciones/malware.html"
          }
         }
        ]
       },
       {
        "type": "text",
        "text": ")."
       }
      ],
      "attrs": {
       "id": "b-rf4021"
      }
     }
    ]
   },
   "tareas": [
    {
     "id": "f4-1",
     "texto": "Actualicé el servidor"
    },
    {
     "id": "f4-2",

  {
   "id": "f5",
   "titulo": "Instala Nextcloud",
   "duracion": "2 a 3 horas",
   "objetivo": "Montar una nube privada con usuarios, grupos y carpetas compartidas.",
   "aprenderas": [
    "Instalar un servicio en Linux",
    "HTTPS y certificados",
    "Usuarios, grupos y el principio de mínimo privilegio"
   ],
   "trabajo": "Administrar usuarios, grupos y permisos es el día a día de cualquier área de TI. Nextcloud, además, es una herramienta real que muchas organizaciones usan.",
   "contenido": {
    "type": "doc",
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Nextcloud",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " es un programa libre que convierte tu servidor en una nube propia, parecida a Google Drive: carpetas compartidas, permisos, sincronización con las computadoras y edición de documentos en el navegador, varias personas a la vez. Lo usan escuelas, gobiernos y empresas que quieren tener sus datos en casa."
       }
      ],
      "attrs": {
       "id": "b-rf5001"
      }
     },
     {
      "type": "heading",
      "attrs": {
       "id": "b-rf5002",
       "level": 3
      },
      "content": [
       {
        "type": "text",
        "text": "1. Instálalo"
       }
      ]
     },
     {
      "type": "paragraph",
      "content": [

      "content": [

      "attrs": {
       "id": "b-rf5007",

      "content": [

        "type": "text",

      },
      "content": [

      "content": [

        "text": "Aunque sea dentro de la oficina, las contraseñas no deben viajar en texto plano. Activa HTTPS con un certificado propio:"

  {
   "id": "f7",
   "titulo": "Acceso remoto seguro",
   "duracion": "2 horas",
   "objetivo": "Que las laptops entren al servidor desde cualquier lugar por un túnel cifrado, sin abrir puertos.",
   "aprenderas": [

    "WireGuard, CGNAT y Tailscale",
    "Quitar el acceso a un dispositivo perdido"
   ],
   "trabajo": "El trabajo remoto hizo de la VPN una pieza básica de cualquier empresa. Saber explicar por qué no se expone un servidor directamente a internet es una pregunta clásica de entrevista.",
   "contenido": {
    "type": "doc",
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Carlos y Ana necesitan los archivos desde su casa o con clientes. El servidor está en la oficina, detrás del router. ¿Cómo llegan a él desde internet sin abrirle la puerta a todo el mundo?"
       }
      ],
      "attrs": {
       "id": "b-rf7001"
      }
     },
     {
      "type": "laboratorio",
      "attrs": {
       "id": "b-rf7002",
       "nombre": "ro-remoto",
       "titulo": "¿Cómo entran las laptops desde fuera?"
      }
     },
     {
      "type": "heading",
      "attrs": {
       "id": "b-rf7003",
       "level": 3
      },
      "content": [
       {
        "type": "text",
        "text": "La idea de una VPN"
       }
      ]
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Una "
       },
       {
        "type": "text",
        "text": "VPN",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " (red privada virtual) crea un "
       },
       {
        "type": "text",
        "text": "túnel cifrado",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " entre la laptop y la red de la oficina. Para la laptop, es como si estuviera conectada al switch del despacho, aunque esté en otra ciudad. Todo lo que viaja por el túnel va cifrado (lo viste en la lección de "
       },
       {
        "type": "text",
        "text": "cifrado",
        "marks": [
         {
          "type": "link",
          "attrs": {
           "href": "../lecciones/cifrado.html"
          }
         }
        ]
       },
       {
        "type": "text",
        "text": "), y solo entran los dispositivos que tienen su llave."
       }
      ],
      "attrs": {
       "id": "b-rf7004"
      }
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "WireGuard",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " es un protocolo de VPN moderno, rápido y libre. Montarlo a mano requiere que el router de la oficina tenga una dirección pública y abrir un puerto. Pero muchos proveedores de internet en México comparten una misma IP pública entre varios clientes (se llama "
       },
       {
        "type": "text",
        "text": "CGNAT",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": "), y entonces no se puede recibir conexiones desde fuera."
       }
      ],
      "attrs": {
       "id": "b-rf7005"
      }
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Tailscale",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " resuelve eso: usa WireGuard por dentro, pero se encarga de conectar los equipos aunque estén detrás de CGNAT, sin abrir puertos. Su plan personal es gratuito para practicar. Lo vas a usar en el laboratorio."

      ],
      "attrs": {
       "id": "b-rf7006"
      }
     },

      "content": [

        "type": "text",
        "text": "1. Instala Tailscale en el servidor"

      "type": "codeBlock",
      "attrs": {
       "id": "b-rf7008",
       "language": "bash"
      },
      "content": [
       {
        "type": "text",
        "text": "curl -fsSL https://tailscale.com/install.sh | sh\nsudo tailscale up"

      ]
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "El segundo comando te da un enlace: ábrelo en tu navegador e inicia sesión para autorizar el servidor. Luego mira la dirección que le asignó Tailscale (empieza con 100.):"

       "variante": "aviso"

      "content": [
       {
        "type": "paragraph",
        "content": [
         {
          "type": "text",
          "text": "Antes de ejecutar un comando que descarga y corre un script de internet ("
         },
         {
          "type": "text",
          "text": "curl … | sh",
          "marks": [
           {
            "type": "code"
           }
          ]
         },
         {
          "type": "text",
          "text": "), comprueba que la dirección sea exactamente la del sitio oficial. Es una práctica común, pero solo es segura con fuentes confiables."
         }

       }
      ]
     },
     {
      "type": "heading",
      "attrs": {
       "id": "b-rf7012",
       "level": 3
      },
      "content": [
       {
        "type": "text",
        "text": "2. Instala Tailscale en la «laptop»"
       }
      ]
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Instala la app de Tailscale en tu celular (o en otra computadora) e inicia sesión con la misma cuenta. Ya forman una red privada."
       }

      "attrs": {
       "id": "b-rf7013"
      }
     },
     {
      "type": "heading",
      "attrs": {
       "id": "b-rf7014",
       "level": 3
      },
      "content": [
       {
        "type": "text",
        "text": "3. Autoriza la nueva dirección en Nextcloud"

      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Cambia 100.x.y.z por la dirección de tu servidor en Tailscale."

       "id": "b-rf7016"

     {
      "type": "heading",
      "attrs": {
       "id": "b-rf7017",
       "level": 3
      },
      "content": [
       {
        "type": "text",
        "text": "4. La prueba de fuego"

     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "En tu celular, "

      "content": [
       {

       }

      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Desde el panel de Tailscale puedes "
       },
       {
        "type": "text",
        "text": "quitar el acceso",
        "marks": [
         {
          "type": "bold"
         }

       },
       {
        "type": "text",
        "text": " a un dispositivo al instante, y en Nextcloud puedes cerrar las sesiones de esa persona. Agrega además la "

   "trabajo": "La documentación y los respaldos probados son lo que separa a un técnico de un profesional. Un cliente o un jefe confía en quien deja todo por escrito.",
   "contenido": {
    "type": "doc",
    "content": [
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Un sistema que nadie más entiende y sin respaldos no está terminado. La última fase es la que convierte tu laboratorio en un trabajo profesional."

      "attrs": {
       "id": "b-rf8001"

      "attrs": {
       "id": "b-rf8002",

      },
      "content": [
       {
        "type": "text",
        "text": "1. Respaldos"
       }
      ]
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "El paquete de Nextcloud trae un comando que exporta la configuración, la base de datos y los archivos:"
       }
      ],
      "attrs": {
       "id": "b-rf8003"
      }
     },
     {
      "type": "codeBlock",
      "attrs": {
       "id": "b-rf8004",
       "language": "bash"
      },
      "content": [
       {
        "type": "text",
        "text": "sudo nextcloud.export"
       }
      ]
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Crea una carpeta con la fecha dentro de /var/snap/nextcloud/common/backups. Ese respaldo debe salir del servidor: cópialo a un disco externo y, si se puede, a otro lugar fuera de la oficina (la "
       },
       {
        "type": "text",
        "text": "regla 3-2-1",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": " de la lección de "
       },
       {
        "type": "text",
        "text": "almacenamiento",
        "marks": [
         {
          "type": "link",
          "attrs": {
           "href": "../lecciones/almacenamiento.html"
          }
         }
        ]
       },
       {
        "type": "text",
        "text": "). Para que sea diario, se programa con "
       },
       {
        "type": "text",
        "text": "cron",
        "marks": [
         {
          "type": "bold"
         }
        ]
       },
       {
        "type": "text",
        "text": ":"
       }
      ],
      "attrs": {
       "id": "b-rf8005"
      }
     },
     {
      "type": "codeBlock",
      "attrs": {
       "id": "b-rf8006",
       "language": "bash"
      },
      "content": [
       {
        "type": "text",
        "text": "sudo crontab -e\n# Todos los días a las 2:30 de la mañana\n30 2 * * * /snap/bin/nextcloud.export -abc"
       }
      ]
     },
     {
      "type": "paragraph",
      "content": [
       {
        "type": "text",
        "text": "Las opciones -a, -b y -c exportan las apps, la base de datos y la configuración; sin -d no copian los archivos, que pesan más y conviene respaldar aparte (por ejemplo, con rsync al disco externo). Revisa con "
       },
       {
        "type": "text",
        "text": "nextcloud.export --help",
        "marks": [
         {
          "type": "code"
         }
        ]
       },
       {
        "type": "text",
        "text": " qué incluye tu versión."

      ],
      "attrs": {
       "id": "b-rf8007"
      }
     },
     {
      "type": "callout",
      "attrs": {
       "id": "b-rf8008",
       "variante": "aviso"

          "text": "Un respaldo que nunca restauraste es solo una esperanza. Haz la prueba: en una máquina virtual nueva, instala Nextcloud y restaura con "

          "marks": [

            "type": "code"
