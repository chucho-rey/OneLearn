        "text": "// El botón que cambia entre modo claro y oscuro\nconst boton = document.getElementById('tema');\n\n// Aplica un modo: agrega o quita la clase \"oscuro\" y actualiza el botón\nfunction aplicar(oscuro) {\n  document.body.classList.toggle('oscuro', oscuro);\n  boton.setAttribute('aria-pressed', oscuro);\n  boton.textContent = oscuro ? 'Modo claro' : 'Modo oscuro';\n}\n\n// Al hacer clic, cambia al modo contrario y lo guarda en el navegador\nboton.addEventListener('click', () => {\n  const oscuro = !document.body.classList.contains('oscuro');\n  aplicar(oscuro);\n  localStorage.setItem('tema', oscuro ? 'oscuro' : 'claro');\n});\n\n// Al cargar la página, usa el modo que se guardó la última vez\naplicar(localStorage.getItem('tema') === 'oscuro');\n\n// El año del pie de página se pone solo\ndocument.getElementById('anio').textContent = new Date().getFullYear();"
